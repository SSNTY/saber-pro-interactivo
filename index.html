<title>Saber Pro Interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: hoja de respuestas de examen. Burbujas A–H, números en mono, una pregunta a la vez. */
:root{
  --bg:#F2F5FB; --surf:#FFFFFF; --ink:#0E1A3A; --mut:#55607C; --line:#D8DFEE;
  --acc:#1F4FD8; --acc-ink:#FFFFFF; --acc-soft:#E3EAFC;
  --ok:#0F7A57; --ok-soft:#DCF2E8; --bad:#BE2F28; --bad-soft:#FBE4E1;
  --warn:#8F5F00; --warn-soft:#FFF0C7;
  --c1:#1F4FD8; --c2:#C4357F; --c3:#0F8F7A; --c4:#B7791F; --c5:#6D4AC9; --c6:#6B7A99;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1226; --surf:#111B35; --ink:#E8ECF8; --mut:#9AA6C6; --line:#26335A;
  --acc:#8AA8FF; --acc-ink:#0A1226; --acc-soft:#1B2B58;
  --ok:#4FD1A1; --ok-soft:#0F3327; --bad:#FF8F85; --bad-soft:#3B1816;
  --warn:#F2C14E; --warn-soft:#3A2E0B;
  --c1:#8AA8FF; --c2:#F27BB0; --c3:#4FD1B8; --c4:#F2C14E; --c5:#B79CFF; --c6:#9AA6C6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1226; --surf:#111B35; --ink:#E8ECF8; --mut:#9AA6C6; --line:#26335A;
  --acc:#8AA8FF; --acc-ink:#0A1226; --acc-soft:#1B2B58;
  --ok:#4FD1A1; --ok-soft:#0F3327; --bad:#FF8F85; --bad-soft:#3B1816;
  --warn:#F2C14E; --warn-soft:#3A2E0B;
  --c1:#8AA8FF; --c2:#F27BB0; --c3:#4FD1B8; --c4:#F2C14E; --c5:#B79CFF; --c6:#9AA6C6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--line);background:var(--surf);padding:10px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.tag{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* Inicio */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.hero h1{font-size:clamp(28px,6vw,40px)}
.hero p{margin:0;color:var(--mut);max-width:62ch}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mod{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mod h2{font-size:21px}
.mod .meta{color:var(--mut);font-size:14px;display:flex;flex-direction:column;gap:2px}
.mod .stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font:500 22px var(--mono)}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.mod .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mod .acts .btn.pri{flex:1 1 100%}
.hist{margin-top:30px}
.hist h2{font-size:20px;margin-bottom:10px}
.hist ul{list-style:none;margin:0;padding:0;background:var(--surf);border:1.5px solid var(--line);border-radius:14px}
.hist li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.hist li:first-child{border-top:0}
.hist .when{color:var(--mut);font-size:13px}
.note{margin-top:22px;color:var(--mut);font-size:13.5px;max-width:72ch}

/* Examen */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h2{font-size:18px}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.partbanner{background:var(--acc-soft);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;margin-bottom:12px}
.partbanner b{font-family:var(--mono);font-weight:500}
.qcard{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qnum{font:500 14px var(--mono);color:var(--mut)}
.passage{background:var(--bg);border-left:3px solid var(--line);padding:12px 16px;border-radius:0 8px 8px 0;white-space:pre-line;max-width:74ch;overflow-wrap:anywhere}
.passage .ttl{display:block;font-weight:600;margin-bottom:6px;white-space:normal}
.passage.aviso{border:2px dashed var(--mut);border-radius:8px;text-align:center;font:500 16px var(--mono);padding:18px 16px;max-width:380px}
.review details.pass{background:var(--bg);border-radius:8px;padding:6px 12px}
.review details.pass summary{cursor:pointer;color:var(--mut);font-size:14px}
.qtext{font-weight:600;font-size:17px;max-width:74ch;overflow-wrap:anywhere;white-space:pre-line}
.fig{margin:0;background:var(--bg);border-radius:10px;padding:10px;overflow-x:auto}
.fig figcaption{font:500 13px var(--mono);color:var(--mut);margin-bottom:4px}
.fig svg{display:block;width:100%;max-width:520px;height:auto}
.fig table{border-collapse:collapse;font:500 14px var(--mono)}
.fig td,.fig th{border:1px solid var(--line);padding:6px 12px;text-align:center}
.fig th{background:var(--acc-soft);color:var(--ink)}
.fig .fnote{font-size:12px;color:var(--mut);margin-top:6px}
.legend{font-size:13px;color:var(--mut);margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:12px 14px;min-height:48px}
.opt:hover{border-color:var(--acc)}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font:500 13px var(--mono);color:var(--mut)}
.opt .txt{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.sel .bub{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opts.dense{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.nav .grp{display:flex;gap:10px;flex-wrap:wrap}
.flag.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:18px}
.grid button{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surf);font:500 13px var(--mono);position:relative}
.grid button.done{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.grid button.cur{outline:3px solid var(--acc);outline-offset:1px}
.grid button.fl::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* Resultados */
.score{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:700 30px var(--display)}
.ring circle{fill:none;stroke-width:12}
.score h2{font-size:26px}
.sc-nums{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
.sc-nums .stat b.ok{color:var(--ok)} .sc-nums .stat b.bad{color:var(--bad)}
.facets{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.facets h3{font-size:16px}
.fr{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:12px;align-items:center;font-size:14px}
@media (max-width:560px){.fr{grid-template-columns:1fr auto}.fr .tr{grid-column:1/-1;order:3}}
.fr .tr{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.fr .tr i{display:block;height:100%;background:var(--acc)}
.acts2{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
.tabs button{border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:38px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{display:flex;flex-direction:column;gap:14px}
.ritem{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ritem.ok{border-left:6px solid var(--ok)} .ritem.bad{border-left:6px solid var(--bad)} .ritem.blank{border-left:6px solid var(--warn)}
.ritem .opts .opt{cursor:default;min-height:0;padding:8px 12px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surf)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surf)}
.expl{background:var(--acc-soft);border-radius:10px;padding:10px 14px;font-size:15px;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--surf);border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--line)}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Escritura */
.wbox{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:14px}
.wprompt{background:var(--bg);border-left:3px solid var(--acc);padding:12px 16px;border-radius:0 8px 8px 0;max-width:74ch}
.wprompt p{margin:0 0 10px}
.wprompt .wq{font-weight:600;margin:0}
.phase{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phase .step{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--mut)}
.phase .step.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.clock{font:500 28px var(--mono);font-variant-numeric:tabular-nums}
.clock.late{color:var(--bad)}
textarea{width:100%;min-height:220px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;line-height:1.6}
textarea.plan{min-height:150px}
.wc{font:500 13px var(--mono);color:var(--mut)}
.chk{display:flex;flex-direction:column;gap:8px}
.chk h3{font-size:16px;margin-top:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc);flex:none}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ideas div{background:var(--bg);border-radius:10px;padding:10px 14px;font-size:14.5px}
.ideas h4{margin:0 0 6px;font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.ideas ul{margin:0;padding-left:18px}
.fb{white-space:pre-wrap;background:var(--acc-soft);border-radius:10px;padding:14px 16px;font-size:15px;overflow-wrap:anywhere}
.essay{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere;max-width:74ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const DATA={"mods":[{"id":"ciudadanas","name":"Competencias ciudadanas","desc":"Constitución, argumentación, multiperspectivismo y pensamiento sistémico","ctx":{"cc-c01":{"kind":"texto","title":"Una mina en el páramo","text":"El municipio de San Isidro del Alto, de 14.000 habitantes, vive del cultivo de papa, de la ganadería de leche y del agua que nace en su páramo. Una empresa con título minero y licencia ambiental vigente planea abrir una mina de cobre a cielo abierto a pocos kilómetros de la cabecera municipal. La empresa calcula que generará 600 empleos directos y que el proyecto dejará regalías a la región. Líderes campesinos y la junta del acueducto veredal temen que la mina contamine las fuentes y reduzca el caudal. A solicitud de un grupo de ciudadanos, el alcalde anuncia que los habitantes votarán la pregunta de si el municipio debe permitir actividades mineras en su territorio. El Gobierno nacional recuerda que el subsuelo y los recursos naturales no renovables son propiedad del Estado y que la minería puede ser de interés para todo el país."},"cc-c02":{"kind":"texto","title":"Repartidores y plataformas","text":"Una plataforma digital de domicilios conecta a restaurantes, repartidores y clientes. Los repartidores usan su propia moto y su celular y se conectan cuando quieren; sin embargo, la aplicación asigna los pedidos según su calificación y los desconecta temporalmente si rechazan muchos. En una reunión con el Ministerio del Trabajo, un grupo de repartidores pide afiliación a seguridad social y un pago mínimo por pedido. La empresa responde que sus repartidores son \"socios independientes\", que la flexibilidad de horarios es lo que más valoran y que una mayor carga laboral la obligaría a subir las comisiones a los restaurantes y las tarifas a los clientes. Una asociación de consumidores advierte que un alza de tarifas reduciría el acceso al servicio de las familias de menores ingresos."},"cc-c03":{"kind":"texto","title":"Cámaras con reconocimiento facial","text":"La alcaldía de una ciudad intermedia instalará 400 cámaras con reconocimiento facial en el transporte público y en los parques, para identificar a personas con órdenes de captura y reducir los hurtos. Los registros biométricos de todos los usuarios quedarían almacenados cinco años por la empresa contratista, y aún no se ha definido quién podrá consultarlos. Organizaciones de derechos digitales piden suspender el proyecto hasta que se explique cómo se manejarán los datos. La secretaría de Seguridad responde que \"quien no tiene nada que ocultar no tiene nada que temer\"."},"cc-c04":{"kind":"texto","title":"Un bloqueo de cuatro días","text":"Durante cuatro días, habitantes de varias veredas de un municipio de montaña bloquean la única vía que conecta la cabecera con la capital del departamento. Exigen que se termine la pavimentación de un tramo abandonado hace dos años por el contratista y que se atienda la emergencia del puesto de salud rural. Mientras tanto, camiones con leche y hortalizas se pierden, una ambulancia debe tomar un desvío de cuatro horas y los comerciantes de la cabecera reportan una fuerte caída en sus ventas. La alcaldesa pide levantar el bloqueo para instalar una mesa de diálogo; los voceros responden que solo lo levantarán cuando haya un cronograma firmado."},"cc-c05":{"kind":"texto","title":"Cupos escolares","text":"En un barrio de una ciudad capital, el colegio público ofrece 1.200 cupos y este año recibió 1.450 solicitudes, 230 de ellas de niños migrantes cuyas familias llegaron hace menos de un año y aún tramitan su permiso de permanencia. Un grupo de padres propone dar prioridad a los niños nacidos en la ciudad, pues \"los cupos se pagan con los impuestos de los residentes\". La rectora recuerda que el colegio ha recibido apoyo de la cooperación internacional para ampliar aulas, pero que ese apoyo termina en dos años. La secretaría de Educación analiza las opciones."},"cc-c06":{"kind":"texto","title":"Una finca restituida","text":"Tras un proceso de restitución de tierras, un juez ordena devolver a una familia campesina, desplazada hace quince años, la finca que perdió durante el conflicto armado. La finca hoy está ocupada por un productor de palma que se la compró a un tercero y dice no haber sabido que la venta original se hizo bajo presión. El ocupante afirma que ha invertido allí sus ahorros y que dejarla significaría perder el sustento de doce familias de trabajadores. La familia desplazada sostiene que sin su tierra no hay reparación posible. Las autoridades locales temen que la ejecución de la orden genere enfrentamientos."},"cc-c07":{"kind":"texto","title":"Un escenario para los jóvenes","text":"Un municipio de 6.000 habitantes recibe la mayor parte de su presupuesto en transferencias del Gobierno nacional, destinadas por ley a salud, educación y agua potable. Su concejo discute si usar una parte de los recursos propios para construir un escenario cultural, pues los jóvenes no tienen dónde ensayar ni presentar su música. La gobernación advierte que antes deben cubrirse las deudas pendientes con el acueducto. Un concejal sostiene que \"el municipio es autónomo y nadie puede decirle en qué gastar\"; otro responde que \"la música no resuelve necesidades básicas\"."},"cc-c08":{"kind":"texto","title":"Columna: mentiras en campaña","text":"Cada vez que se acercan las elecciones, las redes sociales se llenan de mensajes falsos: un video manipulado, una cifra inventada, una cadena de WhatsApp que circula más rápido que cualquier desmentido. Hace dos semanas, un vecino compartió un audio que le atribuía a una candidata una frase que ella nunca dijo. Cuando le mostraron que era falso, no lo borró: \"Igual es lo que ella piensa\", respondió.\nPor eso creo que hay que prohibir que las plataformas muestren contenido político durante las campañas. Quien se oponga a esta medida es porque se beneficia de la mentira. Además, un estudio reciente de la Universidad de la Ribera muestra que el 70 % de las personas que comparten desinformación tiene más de cincuenta años; es decir, son los adultos mayores quienes están destruyendo la democracia.\n(Fragmento de una columna de opinión ficticia)"},"cc-c09":{"kind":"texto","title":"El puerto y la bahía","text":"El Gobierno y una empresa privada proyectan ampliar un puerto en la bahía de un municipio de la costa Pacífica. El área colinda con territorios colectivos de comunidades afrodescendientes que pescan y recolectan moluscos en los manglares. La empresa presentó un estudio de impacto ambiental y realizó una reunión informativa de una hora, en la que anunció que las obras empezarían en tres meses. Los consejos comunitarios afirman que nunca se les consultó sobre el proyecto y piden suspender las obras. La empresa responde que el puerto traerá empleo y que ya cumplió con \"socializar\" el proyecto."},"cc-c10":{"kind":"texto","title":"Un medicamento de alto costo","text":"Mateo, de 9 años, tiene una enfermedad rara. Su médico tratante ordenó un medicamento de alto costo que su EPS se niega a entregar porque \"no está incluido en el plan de beneficios\" y porque el tratamiento anual equivale al gasto en varias decenas de pacientes con enfermedades más comunes. Los padres presentan una acción de tutela. Un analista del sector salud advierte que si todos los casos de este tipo se resuelven a favor de los pacientes el sistema podría desfinanciarse. Una organización de pacientes responde que la salud es un derecho fundamental y no puede depender de la rentabilidad."}},"qs":[{"i":"cc-001","q":"¿Qué intereses o valores están en tensión en esta situación?","o":["El interés del alcalde en conservar su cargo mediante la votación, y el de la empresa en evitar que la comunidad conozca los detalles del proyecto minero.","El interés de la comunidad en proteger el agua y su vida agrícola, y el de la empresa y la Nación en aprovechar el subsuelo con empleo y regalías.","El desarrollo económico, que solo le interesa a la empresa, y la protección del agua, que interesa únicamente a los campesinos y a la junta del acueducto.","La legalidad del proyecto, que defiende el Gobierno nacional, y la ilegalidad de la votación, que promueve el alcalde junto con los ciudadanos."],"a":1,"e":"Los textos muestran dos intereses legítimos: proteger el agua y la economía agrícola local, y aprovechar un recurso que produce empleo y regalías. La opción sobre la exclusividad de los intereses sobregeneraliza: el empleo también podría interesar a habitantes del municipio y el agua a todos. Las demás atribuyen motivos que el texto no menciona o presentan la votación como ilegal, lo cual no se afirma.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c01"},{"i":"cc-002","q":"La votación que anuncia el alcalde corresponde a uno de los mecanismos de participación ciudadana previstos en la Constitución y desarrollados en la Ley 1757 de 2015. ¿De cuál se trata?","o":["Revocatoria del mandato.","Plebiscito.","Cabildo abierto.","Consulta popular."],"a":3,"e":"La consulta popular somete a votación de los habitantes de la entidad territorial una pregunta de interés general. El plebiscito lo convoca el Presidente para pronunciarse sobre decisiones del Ejecutivo; la revocatoria termina el mandato de un elegido; y el cabildo abierto es una reunión pública del concejo para discutir asuntos de interés de la comunidad, sin votación de una pregunta.","t":{"comp":"conocimientos","dif":1},"c":"cc-c01"},{"i":"cc-003","q":"En el debate se han considerado sobre todo los aspectos económicos, ambientales y jurídicos. ¿Cuál de los siguientes aspectos NO se ha tenido en cuenta y podría ser relevante para decidir?","o":["Los ingresos por regalías que recibiría la región y que podrían invertirse en obras para el municipio si el proyecto se ejecuta.","El hecho de que el subsuelo sea propiedad del Estado y de que la minería pueda ser de interés para todo el país.","Los cambios sociales y culturales por la llegada de trabajadores de otras regiones y el posible abandono de las labores campesinas.","La preocupación de la junta del acueducto por la contaminación y por la reducción del caudal de las fuentes de agua."],"a":2,"e":"El texto menciona empleos y regalías (económico), agua (ambiental) y propiedad del subsuelo (jurídico). No considera cómo cambiarían la composición de la población, las costumbres y las actividades productivas locales, que son dimensiones social y cultural. Las otras opciones ya están expresamente en la situación.","t":{"comp":"sistemico","dif":2},"c":"cc-c01"},{"i":"cc-004","q":"Si el Gobierno exigiera afiliación a seguridad social y un pago mínimo por pedido, ¿cuál de las siguientes opciones describe mejor cómo se afectaría a los distintos actores?","o":["Los repartidores perderían la protección que hoy tienen porque la empresa los desvincularía a todos, y los clientes no se verían afectados de ninguna manera.","Los repartidores ganarían protección e ingresos más estables; clientes y restaurantes podrían asumir costos mayores y la empresa vería reducidos sus márgenes.","Solo la empresa resultaría afectada, porque todos los costos adicionales se absorberían por completo dentro de sus propias ganancias, sin trasladarse a nadie.","Los restaurantes serían los más beneficiados, porque la empresa tendría menos capacidad de competir con los domicilios que ellos mismos ofrecen a sus clientes."],"a":1,"e":"Una medida de este tipo beneficia a quienes hoy no tienen protección, pero tiene costos que se pueden repartir entre empresa, restaurantes y clientes, como lo advierten la empresa y las asociaciones de consumidores. Las otras opciones afirman efectos absolutos (nadie más se afecta, todo lo absorbe la empresa) o inventan consecuencias que el caso no sustenta.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c02"},{"i":"cc-005","q":"La empresa afirma que los repartidores son \"socios independientes\" porque eligen cuándo conectarse. ¿Cuál de las siguientes observaciones cuestiona con más fuerza la solidez de ese argumento?","o":["Los repartidores usan su propia moto y su celular, y eso demuestra por sí solo que en realidad son empleados de la empresa.","La mayoría de los clientes prefiere pagar tarifas bajas, así que la empresa debería asumir todos los costos de la seguridad social.","Elegir el horario no prueba independencia, pues la empresa también controla la asignación de pedidos y sanciona los rechazos.","Las empresas de tecnología suelen tener conflictos con las autoridades laborales, por lo que su afirmación no resulta creíble."],"a":2,"e":"Un buen contraargumento usa un hecho del caso que muestra que la razón dada (el horario libre) es insuficiente: la empresa conserva control sobre cómo se asigna y se sanciona el trabajo. Usar moto propia no prueba una relación laboral; la preferencia de los clientes es irrelevante; y desconfiar de la empresa por su sector es una generalización, no una razón.","t":{"comp":"argumentacion","dif":3},"c":"cc-c02"},{"i":"cc-006","q":"Las organizaciones de derechos digitales se preocupan por el almacenamiento y uso de datos personales. ¿Cuál derecho constitucional se relaciona de forma más directa con esa preocupación?","o":["La libre circulación, que garantiza a toda persona moverse por el territorio y escoger su lugar de residencia en Colombia.","El hábeas data, que permite conocer, actualizar y rectificar la información personal en bancos de datos.","El derecho de petición, que permite presentar solicitudes respetuosas a las autoridades y obtener una pronta resolución.","La libertad de empresa, que protege la actividad económica de los contratistas y su derecho a prestar servicios al Estado."],"a":1,"e":"El artículo 15 de la Constitución protege la intimidad personal y reconoce el derecho a conocer, actualizar y rectificar la información que sobre las personas reposa en bancos de datos. El derecho de petición sirve para pedir información, pero no es el derecho que protege el tratamiento de datos.","t":{"comp":"conocimientos","dif":1},"c":"cc-c03"},{"i":"cc-007","q":"¿Qué valores o derechos están en tensión en esta situación?","o":["La libertad de empresa del contratista que instala las cámaras, frente a la libertad de prensa de las organizaciones críticas.","El derecho de petición de las organizaciones, frente al derecho a la libre locomoción de los usuarios del transporte público.","La seguridad y la prevención del delito, frente a la intimidad y al control sobre los datos personales.","La autonomía de la ciudad para administrar su sistema de transporte, frente a la soberanía nacional sobre las vías del país."],"a":2,"e":"La alcaldía busca seguridad y reducir los hurtos; las organizaciones defienden la intimidad y el manejo adecuado de los datos. Las demás opciones combinan derechos que el texto no enfrenta.","t":{"comp":"multiperspectivismo","dif":1},"c":"cc-c03"},{"i":"cc-008","q":"Según la Constitución, ¿cuál de las siguientes afirmaciones sobre el derecho a manifestarse es correcta?","o":["Solo pueden manifestarse las organizaciones registradas y únicamente cuando la alcaldía les haya dado un permiso previo y por escrito.","El derecho de reunión es absoluto, de modo que ninguna autoridad ni ley puede ponerle límites, aunque se afecten derechos de otras personas.","Toda parte del pueblo puede reunirse y manifestarse pública y pacíficamente; solo la ley puede establecer de manera expresa las limitaciones.","La protesta solo es legítima cuando no genera ninguna molestia ni afecta de ninguna manera las actividades cotidianas de terceros."],"a":2,"e":"El artículo 37 reconoce el derecho a la reunión y manifestación pública y pacífica y reserva a la ley el establecimiento de limitaciones. Ni es un derecho sin ningún límite, ni se condiciona a un permiso de la alcaldía, ni se exige que la protesta no cause molestias, pues muchas formas de protesta alteran la rutina.","t":{"comp":"conocimientos","dif":2},"c":"cc-c04"},{"i":"cc-009","q":"¿Qué derechos o intereses de distintos grupos están en tensión en esta situación?","o":["El derecho de los manifestantes a reclamar a las autoridades, y los derechos de otras personas a la movilidad, la salud y el sustento.","El derecho de la alcaldesa a gobernar sin que sus decisiones sean cuestionadas, y el derecho de los comerciantes a cerrar sus negocios.","La libertad de expresión de los manifestantes, y la libertad del contratista a no recibir críticas por el abandono de la obra.","El interés de los manifestantes en la salud rural, y el interés de los comerciantes en que el puesto de salud no sea atendido."],"a":0,"e":"Los manifestantes ejercen un derecho para exigir obras y atención, mientras que el bloqueo afecta a otros: la ambulancia (salud), los comerciantes y productores (sustento) y los viajeros (movilidad). Las demás opciones inventan intereses que el texto no atribuye, como que los comerciantes se opongan a la atención en salud.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c04"},{"i":"cc-010","q":"Un columnista escribe: \"Si se acepta bloquear vías para exigir un pavimento, mañana cualquier grupo bloqueará el país por cualquier capricho; por eso toda protesta con bloqueo debe impedirse\". ¿Qué falla tiene este razonamiento?","o":["Ataca a las personas que participan en la protesta en lugar de refutar lo que piden a las autoridades.","Se apoya en una autoridad que no tiene conocimiento del tema para justificar su conclusión sobre las protestas.","Presenta solo dos alternativas posibles, bloquear o no bloquear, cuando en realidad existen muchas otras opciones.","Salta de un caso particular a un escenario extremo sin demostrarlo, para justificar una prohibición general."],"a":3,"e":"Es una pendiente resbaladiza: afirma que una cosa llevará inevitablemente a consecuencias extremas sin mostrar por qué. El columnista no ataca a las personas (ad hominem), no cita autoridades y no plantea una disyuntiva de dos opciones; por eso las otras fallas no corresponden.","t":{"comp":"argumentacion","dif":2},"c":"cc-c04"},{"i":"cc-011","q":"¿Cuál de las siguientes opciones reconoce mejor las perspectivas de los actores del caso?","o":["Los padres actúan solo por rechazo a los migrantes, y las familias migrantes buscan desplazar a los niños residentes.","La rectora defiende los intereses de los migrantes, y los padres defienden los intereses de la cooperación internacional.","Los padres buscan asegurar cupo para sus hijos ante la escasez; las familias migrantes, garantizar la educación de los suyos.","Los padres y las familias migrantes buscan exactamente lo mismo, por lo que no existe un conflicto real de intereses."],"a":2,"e":"Ambas partes tienen una preocupación comprensible: los padres temen quedarse sin cupo y las familias migrantes quieren escolarizar a sus hijos. Atribuir a los padres solo xenofobia o a los migrantes la intención de desplazar a otros simplifica la situación, y afirmar que no hay conflicto ignora que los cupos son insuficientes.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c05"},{"i":"cc-012","q":"Si la secretaría de Educación decidiera negar los cupos a los niños migrantes, ¿cuál sería una consecuencia probable a mediano plazo?","o":["La escasez de cupos quedaría resuelta porque bajaría la demanda, y los efectos sociales para el barrio serían nulos.","Las familias migrantes regresarían a su país de origen, lo que eliminaría la presión sobre todo el sistema educativo.","La cooperación internacional aumentaría su apoyo al colegio como reconocimiento a la decisión de la secretaría.","Habría más niños fuera de la escuela, con efectos en su desarrollo y en el barrio, sin resolver la falta de cupos."],"a":3,"e":"Negar el cupo no crea aulas ni docentes: solo deja a un grupo sin escuela y genera efectos sociales (aislamiento, riesgos para los niños, tensiones en la comunidad). Las otras opciones suponen efectos que el caso no sustenta, como el regreso de las familias o más ayuda internacional.","t":{"comp":"sistemico","dif":2},"c":"cc-c05"},{"i":"cc-013","q":"Las autoridades buscan una salida que reconozca las razones de ambas partes sin desconocer la decisión del juez. ¿Cuál de las siguientes opciones lo logra mejor?","o":["Cumplir la orden de restitución y explorar apoyos para el ocupante y los trabajadores, como compensaciones o empleo.","Suspender indefinidamente la orden hasta que la familia y el ocupante lleguen a un acuerdo voluntario entre ellos.","Cumplir la orden sin ninguna consideración hacia el ocupante, porque su situación es irrelevante frente a la sentencia.","Sustituir la devolución por una indemnización en dinero, porque la tierra es solo un bien económico para la familia."],"a":0,"e":"La sentencia ya reconoció el derecho de la familia, así que lo que corresponde es cumplirla; eso no impide que el Estado atienda el impacto sobre el ocupante y sus trabajadores. Suspender la orden desconoce la decisión judicial, ignorar al ocupante agrava el conflicto local y tratar la tierra como un bien intercambiable desconoce lo que ella significa para la familia desplazada.","t":{"comp":"multiperspectivismo","dif":3},"c":"cc-c06"},{"i":"cc-014","q":"Para que la restitución sea sostenible y no se limite a un acto jurídico, ¿cuál de las siguientes dimensiones es indispensable considerar?","o":["La dimensión jurídica de los títulos, ya resuelta con la sentencia, pues una vez entregada la finca el problema termina.","La dimensión ambiental exclusivamente, porque lo único que importa es cómo se use el suelo de la finca en adelante.","La dimensión cultural exclusivamente, recuperando tradiciones sin preocuparse por la forma en que la familia se sostendrá.","La dimensión económica y social: seguridad, vías, crédito y asistencia técnica para que la familia viva de la tierra."],"a":3,"e":"Devolver la tierra no basta si la familia no puede volver a producir ni vivir con seguridad: la reparación tiene dimensiones económicas y sociales. Las demás opciones tratan el problema como si tuviera una sola dimensión (jurídica, ambiental o cultural), lo contrario de un enfoque sistémico.","t":{"comp":"sistemico","dif":2},"c":"cc-c06"},{"i":"cc-015","q":"¿Cuál afirmación sobre la autonomía de los municipios es correcta según la Constitución?","o":["Son autónomos de manera absoluta, de modo que ninguna ley nacional puede limitar lo que decidan sobre su presupuesto.","Gozan de autonomía para gestionar sus intereses dentro de los límites de la Constitución y la ley, en un Estado unitario.","Su autonomía depende de que el presidente la autorice cada año, según el cumplimiento de sus metas de gestión.","Solo los departamentos tienen autonomía; los municipios se limitan a ejecutar las órdenes de las gobernaciones."],"a":1,"e":"El artículo 1 define a Colombia como república unitaria, descentralizada y con autonomía de sus entidades territoriales, y el artículo 287 precisa que esa autonomía se ejerce \"dentro de los límites de la Constitución y la ley\". El concejal que dice que \"nadie puede decirle en qué gastar\" ignora esos límites, por ejemplo, la destinación legal de las transferencias.","t":{"comp":"conocimientos","dif":2},"c":"cc-c07"},{"i":"cc-016","q":"El concejal dice que \"la música no resuelve necesidades básicas\". ¿Cuál de los siguientes aspectos pasa por alto esa afirmación?","o":["Que el municipio debe garantizar agua potable, salud y educación con las transferencias que recibe del Gobierno nacional.","Que el municipio tiene deudas pendientes con el acueducto que deben cubrirse antes de emprender nuevas obras.","El valor social y cultural de los espacios de creación para los jóvenes: identidad, tiempo libre y posibles ingresos.","Que los recursos propios del municipio son limitados y por eso deben priorizarse las necesidades más urgentes."],"a":2,"e":"La afirmación ve el problema solo desde las necesidades materiales básicas. Las demás opciones no son omisiones: el propio concejal parte de que existen necesidades básicas, deudas y recursos limitados. Lo que no ve es que los espacios culturales también tienen efectos sociales y económicos sobre los jóvenes.","t":{"comp":"sistemico","dif":2},"c":"cc-c07"},{"i":"cc-017","q":"El columnista escribe: \"Quien se oponga a esta medida es porque se beneficia de la mentira\". ¿Qué falla tiene este argumento?","o":["Se apoya en un dato estadístico que no cita ninguna fuente verificable ni explica cómo se obtuvo la cifra.","Descalifica a quienes piensan distinto atribuyéndoles una intención, en vez de responder a sus razones.","Generaliza a partir del comportamiento de un único vecino que compartió una cadena de mensajes falsos.","Contradice la libertad de prensa, que la Constitución no permite limitar en ninguna circunstancia."],"a":1,"e":"El enunciado no discute las razones de quienes se oponen a la medida, sino que les atribuye un motivo oculto (beneficiarse de la mentira) para invalidarlos. El estudio y el caso del vecino aparecen en otras partes de la columna, y la afirmación sobre la libertad de prensa es incorrecta: la Constitución prohíbe la censura, pero reconoce responsabilidades y límites legales.","t":{"comp":"argumentacion","dif":1},"c":"cc-c08"},{"i":"cc-018","q":"A partir del estudio citado, el columnista concluye que los adultos mayores \"están destruyendo la democracia\". ¿Por qué esa conclusión no se sigue del dato?","o":["Porque una cifra de 70 % es demasiado baja para sacar conclusiones sobre un fenómeno político tan complejo como la desinformación y sus efectos.","Porque un estudio hecho por una universidad no es una fuente válida para analizar fenómenos políticos como la desinformación en campañas.","Porque saber qué parte de quienes comparten desinformación es mayor de cincuenta años no dice qué parte de los mayores la comparte.","Porque los adultos mayores casi no usan redes sociales, así que el dato del estudio no puede ser cierto en ningún caso."],"a":2,"e":"El dato describe la composición del grupo que comparte desinformación, no la frecuencia con la que cada grupo de edad lo hace; además, pasa de ahí a un daño a la democracia sin evidencia. Las otras opciones cuestionan el tamaño de la cifra, el tipo de fuente o un supuesto no probado sobre el uso de redes.","t":{"comp":"argumentacion","dif":3},"c":"cc-c08"},{"i":"cc-019","q":"Ante el desmentido, el vecino responde: \"Igual es lo que ella piensa\". ¿Qué hace esa respuesta?","o":["Justifica un mensaje falso porque coincide con lo que él cree de la persona, sin examinar si es verdadero.","Presenta pruebas de que la candidata sostiene realmente esa postura, a pesar de que el audio haya sido manipulado.","Rebate con argumentos la autenticidad del audio y demuestra que el desmentido que le mostraron era erróneo.","Reconoce que se equivocó y se compromete a rectificar el mensaje ante las personas con quienes lo compartió."],"a":0,"e":"La respuesta no discute si el audio es auténtico: acepta una falsedad porque encaja con su prejuicio. No aporta pruebas, no argumenta sobre la autenticidad y tampoco rectifica; por eso las otras opciones describen acciones que no ocurrieron.","t":{"comp":"argumentacion","dif":1},"c":"cc-c08"},{"i":"cc-020","q":"Las comunidades afrodescendientes sostienen que se vulneró su derecho a ser consultadas antes de adoptar medidas que las afecten directamente. ¿Cómo se denomina ese derecho?","o":["Consulta popular.","Audiencia pública ambiental.","Consulta previa.","Cabildo abierto."],"a":2,"e":"La consulta previa, derivada del Convenio 169 de la OIT (aprobado por la Ley 21 de 1991) y reconocida por la jurisprudencia constitucional, protege a los pueblos indígenas y afrodescendientes frente a medidas que afecten sus territorios y su cultura. La consulta popular es una votación de toda la entidad territorial y la audiencia ambiental es un espacio de información, que no reemplaza la consulta.","t":{"comp":"conocimientos","dif":2},"c":"cc-c09"},{"i":"cc-021","q":"¿Cuál es la diferencia de fondo entre la empresa y los consejos comunitarios sobre lo que significa participar?","o":["La empresa busca beneficiar a las comunidades con empleo, y estas rechazan cualquier clase de desarrollo en su territorio.","La empresa defiende el cumplimiento de la ley, y las comunidades defienden sus costumbres, que no tienen protección legal.","La empresa considera que el empleo compensa cualquier impacto, y las comunidades creen que el empleo no es importante.","La empresa entiende participar como informar sobre un proyecto decidido; las comunidades, como poder incidir antes de decidir."],"a":3,"e":"La empresa trata la reunión como cumplimiento de un trámite de información; las comunidades reclaman un diálogo que pueda modificar o frenar el proyecto. Las otras opciones les atribuyen posiciones extremas que el texto no dice (rechazo a todo desarrollo, indiferencia ante el empleo) o niegan que sus derechos estén protegidos.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c09"},{"i":"cc-022","q":"Un juez debe decidir si la tutela es procedente. ¿Cuál es la conclusión más acertada según la Constitución?","o":["No procede, porque la tutela solo se dirige contra autoridades públicas y una EPS es una empresa privada sin función pública.","No procede, porque solo la Superintendencia de Salud tiene competencia para ordenar la entrega de medicamentos a los afiliados.","Procede siempre que un servicio esté fuera del plan de beneficios, aunque exista otro medio idóneo y no haya riesgo alguno.","Procede: están en riesgo derechos de un niño, que prevalecen, y la tutela cabe contra particulares que prestan servicios públicos."],"a":3,"e":"El artículo 86 permite la tutela contra particulares encargados de la prestación de un servicio público, y el artículo 44 establece la prevalencia de los derechos de los niños, incluida la salud. Esto no significa que toda negativa de un servicio habilite la tutela: debe haber afectación de derechos fundamentales y ausencia de un medio igualmente eficaz.","t":{"comp":"conocimientos","dif":3},"c":"cc-c10"},{"i":"cc-023","q":"¿Qué tensión plantean el analista y la organización de pacientes?","o":["La sostenibilidad financiera del sistema para atender a toda la población, frente al derecho a la salud de una persona concreta.","La eficiencia de las EPS en el manejo de sus recursos, frente a la ineficiencia de los médicos que ordenan los tratamientos.","El derecho de los padres a decidir sobre el tratamiento, frente a la autoridad de los jueces para negar medicamentos.","Los intereses de los pacientes con enfermedades comunes, que no tienen derecho a la salud, frente a los intereses de Mateo."],"a":0,"e":"El analista se preocupa por los recursos limitados de un sistema que atiende a millones de personas; la organización de pacientes defiende un derecho fundamental que no depende de la rentabilidad. Ninguna de las otras opciones refleja lo que dicen los dos actores: nadie afirma que los pacientes con enfermedades comunes carezcan de derecho.","t":{"comp":"multiperspectivismo","dif":2},"c":"cc-c10"},{"i":"cc-024","q":"¿Cuál de las siguientes medidas integra mejor las dimensiones jurídica, financiera y social del problema?","o":["Prohibir por ley que se pueda acudir a la tutela en temas de salud, para que el sistema no se desfinancie por las decisiones de los jueces y se pueda planear mejor el gasto.","Revisar los criterios del plan de beneficios y crear mecanismos de financiación y negociación de precios para enfermedades raras, sin dejar sin protección los casos individuales.","Dejar que cada juez resuelva caso por caso sin ningún ajuste en el funcionamiento del sistema, porque la salud es un derecho fundamental de todas las personas.","Retirar de la cobertura los tratamientos de alto costo, porque benefician a muy pocas personas en comparación con el gasto total del sistema de salud."],"a":1,"e":"La mejor respuesta atiende a la vez el derecho (protección individual), el financiamiento (mecanismos y negociación de precios) y la dimensión social (cobertura de enfermedades raras). Las demás resuelven una dimensión sacrificando otra: limitan un derecho, ignoran la sostenibilidad o excluyen a quienes más necesitan protección.","t":{"comp":"sistemico","dif":3},"c":"cc-c10"},{"i":"cc-025","q":"Una persona presentó una acción de tutela porque una entidad pública le negó un servicio que afecta uno de sus derechos fundamentales. Según el artículo 86 de la Constitución, ¿en qué plazo máximo debe resolverse la tutela desde su presentación?","o":["Tres días.","Treinta días.","Tres meses.","Diez días."],"a":3,"e":"El artículo 86 establece que la tutela es un mecanismo preferente y sumario, y que en ningún caso podrán transcurrir más de diez días entre la solicitud y su resolución. Los otros plazos no corresponden a lo dispuesto por la Constitución.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-026","q":"Una ciudadana radicó ante una secretaría de Movilidad un derecho de petición para que le informen cómo se adjudicó un contrato. Pasaron los plazos de ley y no recibió ninguna respuesta. ¿Qué derecho fundamental se vulneró y qué acción puede usar para protegerlo?","o":["El derecho de petición; puede interponer una acción popular, porque está en juego un contrato público.","El derecho de petición, que incluye una respuesta oportuna y de fondo; puede interponer una tutela.","El derecho al debido proceso; puede interponer una acción de grupo, junto con otros afectados.","La libertad de expresión; puede interponer un hábeas corpus, porque se le negó la información solicitada."],"a":1,"e":"El artículo 23 consagra el derecho de petición, y la jurisprudencia y la Ley 1755 de 2015 señalan que la entidad debe responder dentro de los plazos y resolviendo de fondo lo pedido. Cuando no lo hace, la acción adecuada es la tutela. La acción popular protege derechos colectivos, la de grupo busca indemnización y el hábeas corpus protege la libertad personal.","t":{"comp":"conocimientos","dif":2}},{"i":"cc-027","q":"Los habitantes de un municipio consideran que el alcalde incumplió el programa de gobierno que presentó al inscribirse como candidato, y quieren que termine su periodo antes de tiempo. ¿Qué mecanismo de participación pueden promover?","o":["El plebiscito.","El referendo derogatorio.","La revocatoria del mandato.","La iniciativa popular normativa."],"a":2,"e":"La revocatoria del mandato es el derecho de los ciudadanos a dar por terminado el mandato de un alcalde o gobernador por insatisfacción general o incumplimiento del programa de gobierno. El plebiscito se refiere a decisiones del Ejecutivo, el referendo derogatorio busca dejar sin efecto una norma y la iniciativa normativa propone normas, no termina mandatos.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-028","q":"Un grupo de ciudadanos propone modificar un artículo de la Constitución de 1991. ¿Cuál de las siguientes vías NO está prevista en la Constitución para reformarla?","o":["Un acto legislativo tramitado por el Congreso.","Un decreto del presidente de la República.","Una asamblea constituyente convocada por ley.","Un referendo aprobado por el pueblo."],"a":1,"e":"El artículo 374 señala que la Constitución puede ser reformada por el Congreso, por una asamblea constituyente o por el pueblo mediante referendo. El presidente no puede reformarla por decreto, pues ello rompería la separación de poderes y la supremacía constitucional.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-029","q":"Una fábrica vierte residuos en un río del que dependen cinco veredas para el consumo de agua y la pesca, y las autoridades ambientales no actúan. Los habitantes quieren que cese el vertimiento y se proteja el derecho colectivo a un ambiente sano. ¿Qué acción es la más adecuada?","o":["La acción popular.","La acción de cumplimiento.","La acción de grupo.","La acción de hábeas data."],"a":0,"e":"El artículo 88 establece las acciones populares para proteger derechos e intereses colectivos como el goce de un ambiente sano. La acción de grupo busca la indemnización de perjuicios sufridos por un número plural de personas, la de cumplimiento exige que se aplique una ley o acto administrativo concreto, y el hábeas data protege la información personal.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-030","q":"Se descubre que en el contrato de una obra de un municipio parte del dinero público pagado no llegó a la obra. ¿Qué órgano de control ejerce la vigilancia de la gestión fiscal de quienes manejan recursos públicos?","o":["Las contralorías.","La Procuraduría General de la Nación.","La Defensoría del Pueblo.","La Registraduría Nacional del Estado Civil."],"a":0,"e":"El control fiscal, que vigila cómo se administran y gastan los recursos públicos, lo ejercen las contralorías (la General de la República y las territoriales). La Procuraduría vigila la conducta oficial y adelanta investigaciones disciplinarias, la Defensoría promueve y protege los derechos humanos y la Registraduría organiza elecciones y registro civil.","t":{"comp":"conocimientos","dif":2}},{"i":"cc-031","q":"Una universidad pública reserva cupos adicionales para aspirantes de comunidades indígenas y para personas con discapacidad. Un aspirante que no pertenece a esos grupos dice que la medida viola el derecho a la igualdad. ¿Qué principio constitucional respalda la medida?","o":["La igualdad formal, según la cual la ley debe tratar de manera idéntica a todas las personas en cualquier circunstancia.","La autonomía universitaria, que permite a cada universidad escoger libremente a quién admite sin límite constitucional.","La igualdad real y efectiva, que obliga al Estado a favorecer a grupos discriminados o marginados.","El libre desarrollo de la personalidad, que obliga a la universidad a admitir a todo aspirante que lo desee."],"a":2,"e":"El artículo 13 prohíbe la discriminación y, en su inciso segundo, ordena al Estado promover las condiciones para que la igualdad sea real y efectiva, adoptando medidas en favor de grupos discriminados o marginados. Tratar igual a quienes están en situaciones desiguales perpetúa la desigualdad. La autonomía universitaria existe, pero se ejerce dentro de la Constitución y la ley.","t":{"comp":"conocimientos","dif":3}},{"i":"cc-032","q":"Una empresa quiere abrir un bar con licencia contiguo a un jardín infantil y alega su libertad económica. La alcaldía niega la licencia porque el bar afectaría a los niños del jardín. ¿Qué fundamento constitucional respalda a la alcaldía?","o":["La libertad económica es absoluta, pero la alcaldía puede limitarla cuando lo considere conveniente para sus planes.","Los derechos de los niños solo prevalecen sobre los de otros cuando sus padres lo solicitan formalmente por escrito.","El derecho de petición de los padres obliga a la alcaldía a negar toda licencia comercial que esté cerca del jardín.","Los derechos de los niños prevalecen sobre los de los demás, y la libertad económica tiene como límite el bien común."],"a":3,"e":"El artículo 44 establece que los derechos de los niños prevalecen sobre los de los demás, y el artículo 333 reconoce la libre empresa, pero con una función social y con límites por el bien común. Las otras opciones afirman que los derechos económicos son ilimitados, o inventan condiciones (petición escrita) que la Constitución no exige.","t":{"comp":"conocimientos","dif":2}},{"i":"cc-033","q":"Un vecino hace fiestas hasta las 4 a. m. dos veces por semana. Cuando le reclaman, responde que el libre desarrollo de la personalidad le permite hacer lo que quiera en su casa. ¿Qué responde la Constitución a este argumento?","o":["Se limita por los derechos de los demás y el orden jurídico, y no ampara afectar el descanso de los vecinos.","Se limita solo en los espacios públicos; en el domicilio es absoluto, porque este es inviolable según la Constitución.","Solo puede ser limitado por el presidente mediante un decreto, y no por los vecinos ni por la policía.","Se limita por la moral de la mayoría de la comunidad, que puede prohibir cualquier tipo de fiesta."],"a":0,"e":"El artículo 16 reconoce el libre desarrollo de la personalidad \"sin más limitaciones que las que imponen los derechos de los demás y el orden jurídico\". La inviolabilidad del domicilio protege frente a registros arbitrarios, pero no autoriza a perturbar a otros. Tampoco la moral de la mayoría es un límite constitucional.","t":{"comp":"conocimientos","dif":2}},{"i":"cc-034","q":"¿Qué entidad dirige y organiza las elecciones y está a cargo del registro civil y la identificación de los ciudadanos?","o":["El Consejo Nacional Electoral, órgano de la organización electoral.","La Procuraduría General de la Nación, órgano de control.","La Registraduría Nacional del Estado Civil.","La Corte Constitucional, máximo tribunal en asuntos constitucionales."],"a":2,"e":"Según el artículo 266, el Registrador Nacional del Estado Civil dirige la organización de las elecciones, el registro civil y la identificación de las personas. El Consejo Nacional Electoral es la otra cabeza de la organización electoral, pero se ocupa de la regulación, inspección, vigilancia y control del proceso, incluido el escrutinio general.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-035","q":"Un ciudadano considera que una ley recién aprobada por el Congreso contradice derechos consagrados en la Constitución. ¿Ante qué autoridad puede presentar una demanda para que se estudie la ley?","o":["El Consejo de Estado.","La Procuraduría General de la Nación.","El Consejo Superior de la Judicatura.","La Corte Constitucional."],"a":3,"e":"La Corte Constitucional tiene a su cargo la guarda de la integridad y supremacía de la Constitución y decide sobre las demandas de inconstitucionalidad que los ciudadanos presentan contra las leyes. El Consejo de Estado controla, en general, la legalidad de los actos administrativos.","t":{"comp":"conocimientos","dif":1}},{"i":"cc-036","q":"Una persona fue detenida por la policía y, tres días después, aún no ha sido puesta a disposición de un juez. Sus familiares preguntan qué mecanismo pueden usar. ¿Cuál es el adecuado?","o":["El hábeas corpus, para que un juez decida de inmediato si la privación de la libertad es ilegal.","La acción de cumplimiento, para exigir a la policía que aplique correctamente las normas de la ley penal.","La acción popular, para proteger el derecho colectivo a la seguridad ciudadana frente a la actuación policial.","El derecho de petición, que permite solicitar a la estación de policía que informe sobre la situación del detenido."],"a":0,"e":"Los artículos 28 y 30 establecen que la persona detenida debe ser puesta a disposición del juez en 36 horas y que quien se crea ilegalmente privado de la libertad puede invocar el hábeas corpus, que debe resolverse en 36 horas. Un derecho de petición no es el medio idóneo ante una privación ilegal de la libertad, que requiere una decisión judicial inmediata.","t":{"comp":"conocimientos","dif":2}},{"i":"cc-037","q":"Una investigadora presenta un estudio según el cual una política de transporte aumentó los tiempos de viaje en la ciudad. Un funcionario responde: \"No hay que creerle: ella ha criticado a todas las alcaldías y estudió en una universidad privada\". ¿Qué falla tiene la respuesta del funcionario?","o":["Ataca a la persona que presenta el estudio en lugar de examinar sus datos y conclusiones.","Generaliza a partir de un solo estudio para criticar toda la política de transporte de la ciudad.","Presenta solo dos alternativas posibles, creerle a la investigadora o apoyar a la alcaldía.","Confunde una correlación entre dos fenómenos con una relación de causa y efecto."],"a":0,"e":"El funcionario no discute la metodología ni los resultados del estudio; desacredita a quien lo presenta por sus antecedentes personales (argumento ad hominem). No hay generalización, falsa dicotomía ni confusión entre correlación y causa en su respuesta.","t":{"comp":"argumentacion","dif":1}},{"i":"cc-038","q":"En un debate sobre la explotación de carbón en una región, un dirigente afirma: \"O se mantiene la explotación tal como está, o la región se queda sin empleo y sin futuro\". ¿Qué limitación tiene este argumento?","o":["Descalifica a quienes proponen cambios, atribuyéndoles la intención de perjudicar a las familias de la región.","Se apoya en la experiencia de un solo municipio para afirmar algo sobre todos los municipios de la región.","Responde con la opinión de una autoridad que no es experta, en lugar de usar datos verificables sobre el empleo.","Presenta solo dos opciones e ignora alternativas intermedias, como regular más o diversificar la economía."],"a":3,"e":"Es una falsa dicotomía: reduce el problema a dos extremos y oculta posibilidades intermedias. El dirigente no ataca a nadie en particular, no generaliza a partir de un caso concreto ni cita una autoridad.","t":{"comp":"argumentacion","dif":2}},{"i":"cc-039","q":"¿Cuál de los siguientes enunciados contiene una generalización apresurada?","o":["\"De los cinco conciertos programados para este mes en la ciudad, dos fueron cancelados por razones de lluvia\".","\"La mayoría de los asistentes llegó en transporte público, según la encuesta de salida que hizo el festival\".","\"El año pasado hubo desórdenes en un festival, así que en todos los festivales de música urbana hay desórdenes\".","\"El festival tendrá ocho mil asistentes, según el cálculo que presentaron los organizadores del evento\"."],"a":2,"e":"Una generalización apresurada extiende a todos los casos lo que se observó en uno solo. Los demás enunciados describen cantidades o proporciones concretas apoyadas en una fuente, aunque puedan ser discutibles por otras razones.","t":{"comp":"argumentacion","dif":1}},{"i":"cc-040","q":"Un concejo evalúa crear un impuesto a las bebidas azucaradas. ¿Cuál de los siguientes es un argumento pertinente a favor de la medida?","o":["Las empresas fabricantes han obtenido grandes ganancias durante muchos años, así que merecen pagar más impuestos.","En otro país se aprobó un impuesto parecido, así que aquí también debe aprobarse sin más discusión.","Estudios asocian el alto consumo de estas bebidas con obesidad y diabetes, y el impuesto puede reducirlo.","Los concejales que no apoyan la medida no se preocupan por la salud de las personas de su ciudad."],"a":2,"e":"Un argumento pertinente relaciona la medida con su propósito (salud pública) usando evidencia. Las otras opciones apelan a las ganancias de las empresas (irrelevante para el objetivo), a imitar lo que hicieron otros o a una descalificación de quienes discrepan.","t":{"comp":"argumentacion","dif":2}},{"i":"cc-041","q":"En un programa de televisión, un presentador afirma: \"Los artistas de música urbana promueven la violencia entre los jóvenes con sus letras\". ¿Cuál podría ser una consecuencia de esa afirmación?","o":["Que se estigmatice a los artistas y a sus seguidores y se justifiquen medidas de censura sin revisar la evidencia.","Que la violencia juvenil disminuya, porque la afirmación señala cuál es la verdadera causa del problema.","Que se reconozca que las letras de las canciones son la única causa de la violencia entre los jóvenes.","Que los padres comprendan mejor los factores sociales que explican la violencia entre los jóvenes."],"a":0,"e":"La afirmación generaliza a todo un género y le atribuye una causa sin demostrarla; eso favorece el estigma y las respuestas simplistas. No hay razón para pensar que, por sí sola, reduzca la violencia o haga entender sus causas sociales, ni que se acepte que las letras sean la única causa.","t":{"comp":"argumentacion","dif":2}},{"i":"cc-042","q":"Una alcaldía renovó el alumbrado público en 20 barrios y un año después los hurtos en ellos bajaron 15 %. La alcaldía afirma: \"La baja se debe al nuevo alumbrado\". ¿Cuál información debilitaría más esa conclusión?","o":["Las obras de alumbrado costaron más de lo presupuestado, y varios contratos tuvieron retrasos de más de tres meses.","En dos de los 20 barrios intervenidos los hurtos aumentaron, mientras que en los demás bajaron.","Algunos residentes dicen sentirse más vigilados, y otros prefieren que se mantenga la iluminación anterior.","En 20 barrios similares que no recibieron alumbrado nuevo, los hurtos también bajaron cerca de 15 % en el mismo periodo."],"a":3,"e":"Para mostrar que el alumbrado causó la baja hay que compararlo con barrios sin la intervención; si en ellos la baja fue igual, la causa probable es otra. El aumento en dos barrios sugiere resultados desiguales pero no desmiente el efecto promedio; los costos y las opiniones son irrelevantes para la relación causal.","t":{"comp":"argumentacion","dif":3}},{"i":"cc-043","q":"En una junta de acción comunal se discute prohibir que un grupo de jóvenes use la cancha del barrio en las noches. Un líder dice: \"La mayoría de los vecinos está de acuerdo, así que la medida es justa y no necesita más discusión\". ¿Qué problema tiene este razonamiento?","o":["Supone que lo que apoya la mayoría es justo, sin examinar si afecta derechos de los jóvenes.","Desconoce que toda decisión comunitaria debe tomarse por unanimidad de los vecinos para ser válida.","Ataca a los jóvenes en lugar de discutir las razones que ellos tienen para usar la cancha.","Se apoya en un solo caso aislado para concluir algo sobre todos los barrios de la ciudad."],"a":0,"e":"Es una apelación a la mayoría: que muchos apoyen algo no prueba que sea justo, y la mayoría no puede desconocer derechos de las minorías. Las decisiones comunitarias no se toman por unanimidad, el líder no ataca a los jóvenes y tampoco generaliza desde un caso aislado.","t":{"comp":"argumentacion","dif":2}},{"i":"cc-044","q":"Una banda de jóvenes ensaya tres noches por semana en un garaje, y los vecinos se quejan del ruido. Los jóvenes dicen que es su única manera de practicar y de generar ingresos tocando en eventos. ¿Qué derechos están en tensión?","o":["El derecho de los jóvenes a la propiedad del garaje, y el derecho de los vecinos a la libre locomoción.","La libertad de prensa de los jóvenes, y el derecho de los vecinos a la seguridad social en salud.","El derecho de los jóvenes a la educación, y el derecho de los vecinos a la honra y al buen nombre.","El derecho al trabajo y a la expresión cultural de los jóvenes, y el derecho de los vecinos al descanso."],"a":3,"e":"Los jóvenes defienden su actividad cultural y sus ingresos; los vecinos, su descanso y su calidad de vida. Los demás pares de derechos no corresponden a los intereses que se enfrentan en el caso.","t":{"comp":"multiperspectivismo","dif":1}},{"i":"cc-045","q":"Ochenta familias campesinas viven desde hace treinta años en una zona que se declaró parque natural nacional hace diez. La autoridad ambiental les pide salir para proteger el bosque y las fuentes de agua de una ciudad; las familias dicen que no tienen otro lugar donde vivir ni cómo sostenerse, y que han cuidado el bosque durante años. ¿Cuál descripción reconoce mejor las perspectivas?","o":["La autoridad busca favorecer a la ciudad a costa de los campesinos, quienes son los únicos que realmente protegen el bosque.","La autoridad prioriza conservar un ecosistema de interés general; las familias, su vivienda y sustento; ambas son legítimas.","Las familias buscan explotar el parque en su propio beneficio, y la autoridad simplemente cumple la ley sin ningún interés propio.","Ambas partes buscan lo mismo y solo se diferencian en el método, por lo que el conflicto es puramente de comunicación."],"a":1,"e":"El caso enfrenta dos intereses legítimos: conservar un ecosistema que beneficia a muchos y garantizar condiciones de vida a quienes lo habitan. Las otras opciones asignan intenciones negativas a una de las partes, o niegan que haya conflicto de fondo.","t":{"comp":"multiperspectivismo","dif":2}},{"i":"cc-046","q":"Un concejo debate prohibir la venta de pólvora en diciembre. Los bomberos y los hospitales piden la prohibición por el número de menores quemados cada año. Los artesanos de pirotecnia se oponen. ¿Cuál sería un argumento que podrían usar los artesanos?","o":["Que los menores quemados son una consecuencia inevitable de cualquier celebración tradicional de fin de año.","Que los bomberos no tienen autoridad para opinar sobre actividades comerciales que se realizan en la ciudad.","Que los hospitales tienen un interés económico en que haya más personas lesionadas en diciembre.","Que la prohibición elimina su fuente de ingresos en la temporada, sin ofrecerles alternativas de trabajo."],"a":3,"e":"Los artesanos defenderían su actividad económica y proponen que se tengan en cuenta alternativas para sus ingresos. Las demás respuestas minimizan el daño a los menores o descalifican a quienes piden la medida, en lugar de presentar una razón propia.","t":{"comp":"multiperspectivismo","dif":1}},{"i":"cc-047","q":"Un colegio público incorpora un curso de educación para la sexualidad y la prevención del embarazo adolescente. Un grupo de padres se opone porque considera que esos temas corresponden a las familias. La secretaría de Educación responde que los adolescentes tienen derecho a información científica y que las cifras de embarazo adolescente en el municipio son altas. ¿Qué derechos o valores sustenta cada postura?","o":["Padres: el derecho de los adolescentes a la información y a la salud; secretaría: el derecho de las familias a educar en valores.","Padres: su derecho a intervenir en la educación en valores; secretaría: el derecho de los adolescentes a la información y la salud.","Padres: el principio de laicidad del Estado; secretaría: la libertad de cultos de los adolescentes y sus familias.","Padres: el derecho a la intimidad de los docentes; secretaría: el derecho a la seguridad social de los estudiantes."],"a":1,"e":"Los padres reclaman un rol en la educación de sus hijos; la secretaría invoca el derecho a información y a la salud de los adolescentes. Los distractores invierten la atribución de los derechos o introducen principios (laicidad, seguridad social) que ninguna de las partes menciona.","t":{"comp":"multiperspectivismo","dif":2}},{"i":"cc-048","q":"La alcaldía de una ciudad prohíbe la circulación de vehículos en el centro histórico de 7 a. m. a 9 p. m. ¿Cuál de las siguientes opciones describe mejor cómo se verían afectados distintos grupos?","o":["Todos los comerciantes saldrían beneficiados porque aumentaría el flujo de peatones, y ningún grupo resultaría perjudicado por la restricción.","Algunos comerciantes que dependen de la carga perderían ventas al inicio, peatones y turistas ganarían espacio y quienes tienen movilidad reducida necesitarían rutas alternas.","Los residentes serían los únicos afectados, porque no podrían usar sus vehículos durante la mayor parte del día y tendrían que ir caminando.","Solo los turistas se beneficiarían de la medida, que sería indiferente para quienes viven o trabajan en el centro histórico de la ciudad."],"a":1,"e":"Una misma medida puede beneficiar a unos y perjudicar a otros, y cada grupo tiene necesidades distintas. Las otras opciones generalizan efectos para todos o para un solo grupo y desconocen que el impacto varía según la actividad y condición de cada actor.","t":{"comp":"multiperspectivismo","dif":1}},{"i":"cc-049","q":"Una empresa lanza una herramienta de inteligencia artificial que genera canciones con la voz de artistas conocidos, entrenada con sus discos, sin pagarles ni pedirles permiso. Los artistas denuncian uso indebido de su voz y de sus obras. La empresa responde que la herramienta democratiza la creación. Algunos productores independientes la usan para hacer demos; otros temen perder encargos. ¿Qué tensión de fondo plantea el caso?","o":["El derecho de los artistas a controlar el uso de su voz y su obra, frente al acceso a nuevas herramientas de creación.","El derecho de los artistas a la libre expresión, frente al derecho de los consumidores a recibir publicidad veraz.","La libertad de empresa, frente al derecho al trabajo, que prohibiría toda automatización de la producción musical.","La propiedad del Estado sobre la música, frente a los derechos de autor que reclaman las empresas discográficas."],"a":0,"e":"Se enfrentan la protección de la voz y la creación de los artistas (derechos de autor y de imagen) y los beneficios de herramientas que amplían el acceso a la creación. Los otros pares de intereses no aparecen en el caso, y ningún derecho prohíbe toda automatización.","t":{"comp":"multiperspectivismo","dif":2}},{"i":"cc-050","q":"Un proyecto de ley obligaría a las emisoras comerciales a que al menos 30 % de su programación musical sea de artistas colombianos. ¿Cuál opción describe razones plausibles de los artistas nacionales y de las emisoras frente al proyecto?","o":["Los artistas buscarían mejorar la calidad de la música que suena en el país; las emisoras objetarían que se proteja la música extranjera.","Artistas: mayor acceso a audiencias e ingresos; emisoras: rechazo a una restricción de su libertad de programar.","Los artistas buscarían subir el precio de la publicidad en radio; las emisoras objetarían el respeto a los derechos de autor.","Los artistas buscarían libertad para programar según su gusto; las emisoras buscarían acceso a más audiencias y más anunciantes."],"a":1,"e":"La cuota amplía la oferta para los artistas nacionales, pero limita la autonomía de programación de las emisoras. Las demás opciones atribuyen razones sin sustento en el caso o invierten los papeles.","t":{"comp":"multiperspectivismo","dif":2}},{"i":"cc-051","q":"Pescadores artesanales de una bahía denuncian que barcos industriales de arrastre agotan los recursos cerca de la costa. Las empresas dicen que tienen permisos, generan empleo y abastecen ciudades. Biólogos recomiendan una veda de tres meses. ¿Cuál opción compara correctamente los intereses de los actores?","o":["Los pescadores y los biólogos buscan acabar para siempre con la pesca industrial, y las empresas buscan acabar con la pesca artesanal.","Pescadores: su sustento; empresas: mantener una actividad legal y el abastecimiento; biólogos: la sostenibilidad del recurso.","Los pescadores buscan conservar el ecosistema sin que les importe su ingreso, y los biólogos buscan beneficiar a las empresas.","Las empresas buscan proteger el ambiente porque tienen permisos, y los pescadores solo buscan su propio beneficio económico."],"a":1,"e":"Cada actor tiene intereses distintos pero legítimos: sustento, actividad legal con abastecimiento, y sostenibilidad. Las otras opciones les atribuyen propósitos extremos o contradictorios que el texto no sustenta.","t":{"comp":"multiperspectivismo","dif":2}},{"i":"cc-052","q":"Una empresa de postproducción de audio con clientes en varios husos horarios espera que su personal responda mensajes hasta las 10 p. m. Una trabajadora pide que se respete su derecho a desconectarse fuera del horario laboral; la empresa dice que sus clientes necesitan respuestas inmediatas y que de ello depende conservar los empleos. Una compañera dice que ella prefiere responder porque recibe pago extra. ¿Cuál afirmación identifica mejor lo que está en juego?","o":["El descanso y la vida personal de los trabajadores frente al interés de la empresa; la preferencia de una trabajadora no elimina la tensión.","El derecho al trabajo de la trabajadora frente al derecho de propiedad de la empresa; la preferencia de la compañera resuelve el conflicto.","Un simple problema de comunicación, porque ambas partes quieren lo mismo y basta con acordar entre ellas horarios más flexibles.","El derecho de los clientes a ser atendidos a cualquier hora, frente a la libertad de asociación sindical de los empleados de la empresa."],"a":0,"e":"El conflicto enfrenta un derecho de los trabajadores (descanso, desconexión) con un interés empresarial legítimo (competitividad y empleo). Que una persona prefiera responder no resuelve el conflicto, porque las condiciones de trabajo afectan al conjunto del personal. Las otras opciones reducen el caso a un malentendido o introducen derechos ajenos.","t":{"comp":"multiperspectivismo","dif":3}},{"i":"cc-053","q":"En un barrio residencial de una ciudad costera crecen los apartamentos que se alquilan por días a turistas. Los propietarios dicen que es su derecho usar su propiedad y complementar sus ingresos. Los vecinos denuncian ruido, rotación de desconocidos y alza de los arriendos. Los hoteleros reclaman competencia desleal porque no pagan los mismos impuestos. ¿Qué grupos coincidirían en pedir una regulación, aunque por razones distintas?","o":["Los vecinos, por la convivencia y el costo de la vivienda, y los hoteleros, por la igualdad tributaria.","Los propietarios y los hoteleros, porque ambos quieren proteger su derecho a la propiedad privada del barrio.","Los propietarios y los vecinos, porque ambos quieren que lleguen más turistas a las calles del barrio.","Los vecinos y los propietarios, porque ambos buscan los mismos ingresos que deja el turismo en la ciudad."],"a":0,"e":"Vecinos y hoteleros tienen intereses distintos (convivencia y vivienda vs. competencia justa), pero ambos ganarían con reglas claras. Los propietarios, en cambio, tienen interés en conservar la libertad de alquilar. Las otras opciones agrupan actores cuyos intereses no coinciden.","t":{"comp":"multiperspectivismo","dif":3}},{"i":"cc-054","q":"En un río de una región selvática, la minería ilegal de oro con dragas contamina el agua con mercurio. El Gobierno responde solo con operativos de la Fuerza Pública que destruyen las dragas, pero meses después reaparecen. ¿Qué aspecto NO consideró esa respuesta?","o":["El daño ambiental que causa el mercurio en el agua, los peces y las comunidades.","Las necesidades económicas de las comunidades que dependen de la actividad.","La ilegalidad de la actividad frente a las normas ambientales y mineras vigentes.","La necesidad de que el Estado haga presencia permanente en el territorio."],"a":1,"e":"La respuesta actúa sobre la dimensión de seguridad y control, pero no sobre las causas económicas y sociales que sostienen la actividad. Los demás aspectos sí se contemplan: el daño ambiental, la ilegalidad y la presencia estatal están implícitos en los operativos.","t":{"comp":"sistemico","dif":1}},{"i":"cc-055","q":"Una ciudad prohíbe la circulación de buses y camiones de más de veinte años para mejorar la calidad del aire. Muchos transportadores independientes dependen de esos vehículos. Si la medida se aplica sin ningún apoyo, ¿cuál es una consecuencia probable en las dimensiones económica y social?","o":["Una baja en el costo del transporte por la menor oferta de vehículos, lo que beneficiaría a todos los hogares de la ciudad.","La desaparición de la contaminación en toda la región, pues los vehículos viejos son la única fuente de contaminantes del aire.","Un aumento de la inversión extranjera, por el cambio inmediato en la imagen ambiental que tendría la ciudad ante el mundo.","Pérdida de ingresos de los transportadores pequeños y encarecimiento de pasajes y fletes, con más efecto en hogares de menores ingresos."],"a":3,"e":"Una medida ambiental sin acompañamiento afecta a quienes no pueden reemplazar sus vehículos y puede subir los costos de transporte, con efectos regresivos. Una menor oferta tiende a subir precios, no a bajarlos, y las otras consecuencias son exageradas o carecen de sustento.","t":{"comp":"sistemico","dif":2}},{"i":"cc-056","q":"Una gobernación decide erradicar manualmente los cultivos de coca de una vereda, sin ofrecer un programa de sustitución. Las familias campesinas dependían de ellos como su principal ingreso. ¿Cuál es el conjunto de efectos más probable a mediano plazo?","o":["Disminución definitiva de los cultivos de coca, porque nadie volverá a sembrar, y mejor relación de las familias con el Estado.","Aumento espontáneo de los ingresos de las familias por cultivos legales que surgirán por la falta de competencia en la zona.","Pérdida de ingresos, resiembra o desplazamiento a otras zonas con más presión sobre el bosque, y mayor desconfianza hacia el Estado.","Un efecto únicamente ambiental y positivo, sin consecuencias sociales ni económicas para las familias campesinas de la vereda."],"a":2,"e":"Quitar la fuente de ingreso sin una alternativa afecta lo económico (pérdida de ingresos), lo social (desplazamiento, desconfianza) y lo ambiental (nuevas zonas deforestadas). Las otras opciones suponen resultados favorables sin mostrar el mecanismo por el cual ocurrirían.","t":{"comp":"sistemico","dif":3}},{"i":"cc-057","q":"Durante una sequía, una ciudad racionó el agua por sectores. La medida redujo el consumo en 20 %, pero las familias de barrios populares sin tanques de almacenamiento sufrieron más cortes que las de barrios con tanques, y algunos pequeños negocios de alimentos cerraron temporalmente. ¿Qué relación entre dimensiones ilustra el caso?","o":["Una medida económica que resolvió el problema social, al lograr que bajara el consumo de agua en toda la ciudad.","Una medida de gestión del recurso natural tiene efectos sociales y económicos desiguales según la infraestructura de cada hogar.","Una medida cultural que cambió los hábitos de consumo, por lo que no tuvo ningún efecto social ni económico.","Una prueba de que el racionamiento fue innecesario, porque los costos sociales superan siempre los beneficios ambientales."],"a":1,"e":"El racionamiento reduce el consumo (dimensión ambiental), pero su efecto depende de la desigualdad previa en infraestructura (social) y afecta a los negocios (económica). Concluir que fue innecesario va más allá de lo que muestra el caso: los costos desiguales piden medidas complementarias, no necesariamente abandonar la medida.","t":{"comp":"sistemico","dif":3}},{"i":"cc-058","q":"La alcaldía autoriza un festival de música electrónica de tres días en un parque de la ciudad. Para decidirlo, solo consideró los ingresos esperados por turismo y los planes de seguridad con la Policía. ¿Qué aspecto NO se tuvo en cuenta?","o":["Los ingresos que dej
