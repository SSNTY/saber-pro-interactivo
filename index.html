arían los turistas en hoteles y restaurantes.","La seguridad de los asistentes y residentes durante el evento.","El número de visitantes que llegará a la ciudad esos días.","El efecto del ruido y las basuras sobre vecinos, fauna y parque."],"a":3,"e":"La decisión se basó en lo económico y en la seguridad. No se consideró la dimensión ambiental y comunitaria: ruido, residuos y daño al parque. Los demás aspectos ya fueron contemplados.","t":{"comp":"sistemico","dif":1}},{"i":"cc-059","q":"El Gobierno traslada todos los trámites de una entidad a una plataforma web, para reducir costos y filas. Un estudio encuentra que, en los municipios rurales, solo uno de cada cuatro hogares tiene conexión estable a internet. ¿Cuál es un efecto probable de la medida?","o":["Que el ahorro de costos produzca por sí solo una mayor cobertura de los servicios del Estado en las zonas rurales.","Que las filas desaparezcan para todas las personas por igual, sin importar dónde vivan ni cómo se conecten.","Que quienes carecen de conexión o habilidades digitales accedan con más dificultad a sus derechos, ampliando la brecha urbano-rural.","Que el problema se limite a lo tecnológico, sin ninguna implicación sobre el acceso de las personas a sus derechos."],"a":2,"e":"La digitalización mejora la eficiencia, pero cuando no hay conectividad se traslada la dificultad a quienes ya tienen menos acceso. Por eso afecta la igualdad de acceso a los servicios del Estado. Las otras opciones suponen que el ahorro o la tecnología resuelven la desigualdad.","t":{"comp":"sistemico","dif":2}},{"i":"cc-060","q":"En un municipio andino, empresarios compran fincas para sembrar aguacate de exportación y pagan jornales por encima del promedio local. Dos años después, el precio de la tierra se triplicó, muchos campesinos que producían alimentos para la plaza local vendieron sus fincas y la junta del acueducto reporta que los nacimientos de agua bajaron su caudal. ¿Cuál es la mejor interpretación del caso?","o":["Una decisión valorada por su efecto económico inmediato afectó en cadena el agua, la tierra y los alimentos locales.","Son problemas independientes entre sí: el precio de la tierra es un asunto económico y el caudal del agua es solo un fenómeno climático.","El problema es exclusivamente ambiental, y basta con regular el uso del agua para que los demás efectos se resuelvan por completo.","Los campesinos que vendieron actuaron en contra de su propio interés, así que el problema se explica por decisiones individuales mal tomadas."],"a":0,"e":"Un enfoque sistémico observa cómo la inversión agrícola altera varias dimensiones relacionadas: lo económico (precios y empleo), lo social (tenencia de la tierra y alimentos) y lo ambiental (agua). Tratar los efectos como independientes o reducirlos a una sola causa deja fuera relaciones clave que muestra el caso.","t":{"comp":"sistemico","dif":3}}]},{"id":"lectura","name":"Lectura crítica","desc":"Ensayos, columnas, crónicas, textos literarios y discontinuos","ctx":{"lc-c01":{"kind":"texto","title":"La tiranía del promedio","text":"Hay una pregunta que los estudiantes hacen con más frecuencia que cualquier otra: «¿esto va para nota?». Detrás de su aparente pereza hay una lección aprendida con rigor: en la escuela, lo que no se califica no existe. Los docentes lo sabemos y, por eso, tendemos a sentirnos incómodos con la pregunta, como quien oye su propia voz en una grabación.\n\nSería injusto, sin embargo, culpar a la calificación de todos los males. Un número cumple una función que ninguna rúbrica narrativa ha logrado reemplazar del todo: permite comparar sin conocer, es decir, permite que una universidad en Medellín interprete lo que hizo un joven en Quibdó sin haberlo visto trabajar jamás. Esa es su virtud y, a la vez, su pecado original: lo que gana en portabilidad lo pierde en matices.\n\nEl problema aparece cuando el instrumento de medida se convierte en el objetivo de la medición. Si el aprendizaje se mide con una nota, y la nota se premia, el estudiante racional aprenderá a producir notas, no a aprender. No es una degeneración moral de la juventud; es la respuesta previsible a un sistema de incentivos. Nadie culpa al río por seguir el cauce que le cavaron.\n\nQuizá la salida no sea abolir los números, sino quitarles el monopolio. Una escuela que reservara parte de su tiempo a trabajos que no se califican —pero sí se discuten, se corrigen y se muestran— no renunciaría a la evidencia; solo admitiría que no todo lo valioso cabe en una columna de la planilla."},"lc-c02":{"kind":"texto","title":"La memoria prestada","text":"Hace veinte años un taxista bogotano conocía la ciudad como se conoce un idioma: sin consultar el diccionario. Hoy el mismo conductor sigue, con docilidad, la voz de una aplicación que le anuncia giros que su cuerpo habría hecho de memoria. Es tentador celebrar la eficiencia —los viajes son más cortos, los errores menos frecuentes— y callar lo que se pierde por el camino.\n\nLo que se pierde no es solo un mapa mental. Los neurocientíficos que estudian la navegación, con la cautela propia de quien trabaja con muestras pequeñas, sugieren que quienes dependen de la guía automática activan menos las regiones asociadas con la orientación espacial. «Sugieren», no «demuestran»: conviene respetar el verbo. Pero aun si la evidencia fuera más débil, la intuición seguiría siendo incómoda: una facultad que no se ejerce tiende a atrofiarse, como cualquier músculo.\n\nSería ingenuo, con todo, concluir que debemos volver a los planos de papel. Nadie lamenta que ya no memoricemos números telefónicos, y la historia de la escritura es la historia de una larga delegación: Sócrates, según cuenta Platón, desconfiaba de ella porque prometía la apariencia de la sabiduría sin su sustancia. Lo que sabemos de Sócrates lo sabemos, precisamente, porque alguien escribió.\n\nLa pregunta pertinente, entonces, no es si delegar, sino qué delegar. Externalizar lo rutinario libera atención para lo que importa; externalizar lo que nos constituye —el criterio, la orientación, la capacidad de elegir un camino— nos deja cómodos y, a la vez, a merced del que escribió la ruta."},"lc-c03":{"kind":"texto","title":"Contra la pureza del idioma","text":"Cada cierto tiempo, alguien anuncia la muerte del español. Los culpables cambian: antes fueron los telegramas, luego la televisión, hoy los mensajes de voz y los anglicismos. Lo curioso es que el cadáver, a pesar de los diagnósticos, goza de excelente salud: casi quinientos millones de personas lo tienen como lengua materna.\n\nQuienes lamentan la corrupción del idioma suelen partir de una imagen: la lengua como un mármol, una obra terminada a la que cada hablante añade grafitis. Pero el español que hoy se defiende como patrimonio fue, en su momento, un latín mal hablado por soldados, comerciantes y esclavos. Si los puristas del siglo III hubieran ganado, hoy leeríamos a Cervantes en latín, y a él lo habrían leído menos.\n\nNada de esto equivale a decir que todo vale. Una lengua es también un acuerdo, y un acuerdo requiere reglas que permitan entenderse; quien escribe «haiga» en un contrato asume un riesgo que quien lo escribe en un chat no asume. La diferencia, sin embargo, no es de corrección sino de adecuación: se trata de saber en qué lugar se está parado.\n\nLa verdadera amenaza para un idioma no es que cambie, sino que deje de cambiar. Las lenguas que no se transforman suelen ser las que ya no tienen quién las hable."},"lc-c04":{"kind":"texto","title":"La vacuna invisible","text":"Los bomberos cuyo trabajo es perfecto nunca salen en las noticias: nadie fotografía el incendio que no ocurrió. Con la salud pública sucede algo parecido, y a ello se debe buena parte de su mala prensa. Cuando una campaña de vacunación funciona, la enfermedad desaparece de la conversación, y con ella desaparece la urgencia que justificaba la campaña.\n\nEsta paradoja tiene consecuencias prácticas. Una generación que nunca vio a un niño con poliomielitis tiende a percibir la vacuna como un trámite, y los riesgos —reales pero ínfimos— de una reacción adversa, como un precio sin contrapartida. El miedo, que en el pasado se dirigía a la enfermedad, se desplaza hacia el remedio, que es lo único visible. No se trata de estupidez colectiva: es el funcionamiento ordinario de la atención humana, que registra lo presente y olvida lo evitado.\n\nDe ahí que los argumentos puramente estadísticos fracasen con frecuencia. Decir que la vacuna evita miles de muertes es hablar de un fantasma; los datos no pueden competir con una anécdota vívida, aunque sea falsa. Quizá por eso las campañas más eficaces no recitan cifras, sino que devuelven a la memoria aquello que las cifras solo resumen: la sala de hospital, el pasillo, el nombre propio.\n\nEsto no significa renunciar a los números. Significa entender que los números son el soporte de una argumentación, no su punto de partida emocional."},"lc-c05":{"kind":"texto","title":"La ciudad que se oye","text":"Quien llega a una ciudad nueva la mira; quien vive en ella, la oye. Hay quienes distinguen su barrio por el pitido de un vendedor de helados, por el golpe de una pelota contra un muro o por la hora exacta en que se encienden los parlantes del vecino. El paisaje sonoro, sin que lo advirtamos, es una forma de pertenencia.\n\nPor eso resulta desconcertante que las políticas urbanas traten el sonido casi exclusivamente como un problema. Se miden decibeles, se fijan topes y se sancionan excesos; todo esto es necesario, pues el ruido sostenido afecta el sueño y la salud. Pero una normativa que solo sabe restar produce ciudades silenciosas en el peor sentido: asépticas, sin voz.\n\nSe dirá que es un lujo pensar en la poesía de un pregón cuando hay familias que no duermen por el bus de la madrugada. La objeción es válida y no pretendo desestimarla. Sin embargo, la disyuntiva es falsa: nada impide proteger el descanso y, al mismo tiempo, preservar los sonidos que dan identidad a un lugar. La dificultad es que lo primero se mide con un aparato y lo segundo requiere preguntarles a los vecinos.\n\nUna ciudad bien gobernada, en suma, no es la que apaga todos los ruidos, sino la que sabe distinguir cuáles quiere conservar."},"lc-c06":{"kind":"texto","title":"Esta reunión pudo ser un correo","text":"Confieso que he asistido, en los últimos doce meses, a ciento cuarenta reuniones, y que en ninguna descubrí algo que no hubiera podido leer en tres líneas. No lo digo con rencor: lo digo con el cansancio de quien ha visto a un equipo entero convocarse a las tres de la tarde para ratificar lo que el gerente decidió a las diez.\n\nLa reunión, nos dicen, es el lugar de la colaboración. Y lo sería si se usara para colaborar; lo que se usa, más bien, es para exhibirse. Quien pregunta lo que ya está en el acta demuestra atención; quien resume lo que otro acaba de decir demuestra liderazgo; quien guarda silencio demuestra, con perdón, que probablemente está contestando correos.\n\nLos defensores de la presencialidad responden que «lo humano se pierde» cuando se sustituye la sala por un documento. Algo de razón tienen: ciertas decisiones exigen mirar a los ojos de quien disiente. Pero conviene no confundir las pocas reuniones que requieren un encuentro con las muchas que solo requieren una firma.\n\nPropongo una regla sencilla: antes de convocar, redactar en una línea qué se decidirá. Si la línea no sale, no hay reunión; si sale, tal vez tampoco."},"lc-c07":{"kind":"texto","title":"Mi conciencia, en tres bolsas","text":"Separo mis residuos en tres bolsas con la disciplina de un monje y la satisfacción de un contribuyente puntual. Cada domingo bajo mis bolsas verdes, blancas y negras, y siento que he hecho mi parte. Luego pasa el camión y, con una indiferencia admirable, las vacía todas en el mismo compartimento.\n\nLa anécdota es real y no es rara. Pero la utilizo menos para quejarme del servicio de aseo que para señalar un mecanismo más profundo: durante décadas, la industria de los empaques ha promovido la idea de que la crisis de los residuos es una falla de conducta individual. Que el consumidor recicle tiene una gran ventaja para quien fabrica los envases: traslada la discusión del diseño del producto a la moral de quien lo compra.\n\nNada de lo anterior es argumento para dejar de separar. Reciclar es un gesto razonable, como lo es cerrar la llave mientras uno se cepilla los dientes. Lo que objeto es la proporción: una sociedad que dedica su energía a escrutar la bolsa del vecino y ninguna a preguntar por qué cada yogur necesita tres capas de envoltura ha confundido el síntoma con la causa.\n\nSeguiré separando mis bolsas. Pero preferiría que, además de la culpa que me corresponde, alguien me explicara cuál le corresponde a quien diseñó el empaque."},"lc-c08":{"kind":"texto","title":"La nostalgia no es un formato","text":"Cada vez que alguien me dice que «la música de antes sí tenía alma», me pregunto cuál de los dos tiene más años: la música o la persona. La frase, repetida de generación en generación con idéntica convicción, debería despertar sospechas: si cada época creyó que la anterior era superior, o el arte decae sin interrupción desde las cavernas, o el juicio está torcido por algo que no es el arte.\n\nEse algo, creo, es la memoria. Los psicólogos hablan de un «pico de reminiscencia»: tendemos a recordar con especial intensidad las canciones que escuchamos entre los quince y los veinticinco años. No es que esas canciones sean mejores; es que sonaron mientras nos enamorábamos por primera vez, mientras discutíamos con nuestros padres, mientras éramos otros. Atribuimos a la canción lo que pertenece a la época de nuestras vidas.\n\nCon esto no pretendo decir que todo da igual. Existen razones técnicas para discutir la compresión extrema de los discos recientes o la uniformidad de los estribillos pensados para durar quince segundos. Pero esas son críticas concretas, que se pueden verificar; «tenía alma» no lo es. Se parece más a una confesión que a un argumento.\n\nMe inquieta, sobre todo, lo que la nostalgia le hace al oyente: lo vuelve un guardián de museo y no un explorador. Y quien solo defiende lo que ya conoce, tarde o temprano, termina sin nada nuevo que defender."},"lc-c09":{"kind":"texto","title":"Todos somos emprendedores","text":"En Colombia ya casi no hay desempleados: hay emprendedores en transición. Quien pierde su puesto en una empresa y vende arepas desde la ventana de su casa recibe, de inmediato, un título de nobleza lingüística. Ya no es víctima de una crisis; es un «creador de oportunidades». La palabra es cálida, y justamente por eso conviene mirarla con desconfianza.\n\nNo quiero ser injusto con quienes de verdad montan un negocio. Hay en ese camino un coraje que merece respeto, y casos —no pocos— de personas que encontraron en su iniciativa una libertad que el empleo nunca les dio. Mi reparo es otro: cuando la palabra se convierte en consigna, desplaza la conversación sobre las condiciones en que se emprende. Si el que fracasa es un «emprendedor que no persistió», el problema queda en su carácter y no en el crédito inaccesible o en un mercado saturado de gente que vende lo mismo.\n\nLos discursos motivacionales padecen, además, el sesgo del sobreviviente: entrevistan a quienes llegaron a la cima y concluyen que basta con trepar, sin preguntar cuántos cayeron en el camino.\n\nQue cada quien busque su camino me parece admirable. Que se le llame libertad a lo que a veces es necesidad me parece un truco de lenguaje."},"lc-c10":{"kind":"texto","title":"Veinte ensayos iguales","text":"Un profesor amigo me contó que recibió, la misma semana, veinte ensayos sobre la Revolución Francesa con idéntica frase inicial: «La Revolución Francesa fue un acontecimiento de gran trascendencia histórica». No lo escandalizó la trampa; lo escandalizó la falta de imaginación de la trampa.\n\nLas reacciones han oscilado entre el pánico y la resignación. Hay quienes piden prohibir los asistentes de redacción; otros, más pragmáticos, proponen aceptarlos como aceptamos la calculadora. La comparación tiene su gracia, pero cojea: la calculadora ejecuta una operación cuyo resultado el estudiante puede verificar; un texto generado, en cambio, entrega algo que parece aprendizaje y no lo es, y que el estudiante a menudo no sabe evaluar.\n\nLo irónico es que el ensayo escolar nunca fue valioso por el texto final —a nadie le hacía falta el vigésimo ensayo sobre la Revolución Francesa— sino por el proceso: dudar, ordenar, equivocarse, reescribir. Si la tarea solo pedía el producto, el sistema se quedó sin defensa; si pedía el proceso, la solución consiste en evaluar el proceso.\n\nEso supone más trabajo para los docentes: pedir borradores, conversar, preguntar «¿por qué escribiste esto?». Pero quizá la llegada de los asistentes haga lo que décadas de pedagogía no lograron: obligar a la escuela a preguntarse para qué pide lo que pide."},"lc-c11":{"kind":"texto","title":"El afinador","text":"A las siete de la mañana, don Ernesto Palma ya tiene abiertas las tripas de un piano vertical en el salón de una academia de Barranquilla. No se apresura. Con una llave de cabeza cuadrada gira apenas un grado la clavija de una cuerda, golpea la tecla, escucha, vuelve a girar. «El piano se destempla como la gente», dice, «no por el uso, sino por el clima». Aquí, con el calor y la sal del aire, las cuerdas se oxidan y la madera se hincha; un piano que en Bogotá aguanta un año sin tocarse, en la costa pide visita cada cuatro meses.\n\nDon Ernesto tiene setenta y un años. Cuando empezó, cuenta, había nueve afinadores en la ciudad; hoy quedan dos, y el otro está pensando en jubilarse. No se queja de la falta de clientes —las iglesias, los colegios y algunas familias tradicionales siguen llamándolo— sino de la falta de oídos: «Los muchachos quieren aprender con una aplicación, y la aplicación les dice si la nota está alta o baja, pero no les dice por qué suena fea».\n\nLe pregunto si le molesta la tecnología. Se ríe sin dejar de escuchar. Usa un afinador electrónico, admite, para la nota de partida; el resto lo hace de oído, porque un piano bien afinado no lo está en un sentido matemático: las cuerdas más graves y las más agudas se estiran un poco, y es ese «error» deliberado el que hace que el instrumento suene correcto al oído humano. «La máquina busca la perfección», dice. «Yo busco que suene bien. No es lo mismo».\n\nAl mediodía cierra la tapa, guarda la llave en un estuche de cuero gastado y cobra lo acordado. La profesora de la academia toca un acorde para probar. Don Ernesto no la mira; mira el suelo, como quien revisa que algo haya quedado en su sitio."},"lc-c12":{"kind":"texto","title":"Los rieles","text":"Los obreros levantaron la capa de asfalto un martes por la mañana y, bajo ella, apareció una línea de hierro oscuro, oxidado, impecablemente recta. Se detuvieron. Alguien pidió que se apagara el taladro. Los rieles del viejo tranvía, que la ciudad había dado por desaparecido hacía más de setenta años, llevaban todo ese tiempo allí, bajo los buses, las motos y los semáforos, como una frase que nadie borró del todo en un manuscrito.\n\nDon Aurelio Vega, jubilado, llegó al lugar atraído por los curiosos. Dijo que su abuelo había sido conductor de esa ruta y que, según la familia, nunca se acostumbró a manejar otra cosa. «Decía que el tranvía era el único vehículo que no se queja de las curvas», contó. «Va por donde debe ir». Se agachó, tocó el riel con la punta de los dedos, y por un instante nadie en el grupo dijo nada, aunque tampoco había nada que decir: un trozo de hierro no es, en rigor, un monumento.\n\nLos ingenieros, por su parte, tenían otra urgencia. Los rieles estorbaban para la nueva canalización, y el contrato establecía plazos que no contemplaban hallazgos. El residente de obra, un hombre joven y cortés, explicó que «el pasado, con todo respeto, no puede detener un cronograma». Los vecinos del barrio, que llevaban meses soportando el polvo, no parecían en desacuerdo.\n\nAl final se llegó a un arreglo de los que dejan a todos un poco insatisfechos: se retiraron veinte metros de riel para un museo, y el resto volvió a quedar bajo una capa fresca de asfalto. La ironía, que casi nadie mencionó, es que la ciudad discute hace años cómo construir un sistema de transporte sobre rieles, y acaba de enterrar, con las mejores razones, el que ya tenía."},"lc-c13":{"kind":"texto","title":"Conteo al amanecer","text":"A las cinco y media, cuando todavía no hay luz suficiente para distinguir un color, Marta Lozano ya está parada en la orilla del humedal con unos binoculares colgados del cuello y una libreta de tapas plásticas. Somos siete: dos estudiantes de biología, un contador jubilado, una niña de doce años que fue la primera en ver la garza y tres personas que, como yo, llegaron por curiosidad. Marta nos reparte sectores y nos da una regla: «Anoten lo que ven, no lo que esperan ver».\n\nLa regla parece obvia y es la más difícil. Durante dos horas, el humedal se llena de sombras que el entusiasmo convierte en pájaros. El contador jubilado cuenta doce fochas y, cuando repite el conteo, son nueve; una de ellas, descubre, era un tronco. Marta no se burla. Dice que el error es parte del método y que por eso se hace el conteo varias veces, con varias personas, y se promedian los resultados.\n\nLo que sale de las libretas de siete aficionados no es un censo —me aclara— sino una estimación. No sabrá nunca cuántas aves viven realmente allí: algunas se esconden en el junco, otras se van antes de ser vistas. «Pero si usted cuenta de la misma forma cada año, durante veinte años, la cifra exacta deja de importar. Lo que importa es si sube o baja».\n\nAl terminar, la niña pregunta si el conteo sirve para algo. Marta tarda en responder. Dice que los datos de este humedal, sumados a los de otros cientos en el país, han servido para sustentar que ciertas especies migratorias llegan menos que antes, y que sin voluntarios que se levanten a las cinco no habría con qué demostrarlo. La niña asiente, satisfecha, y vuelve a mirar el agua: ha visto algo moverse entre el junco y, esta vez, asegura, no es un tronco."},"lc-c14":{"kind":"texto","title":"Cargar sin pelear con el peso","text":"La plaza empieza a las tres de la mañana, aunque el letrero de la entrada diga que abre a las cinco. A esa hora los camiones ya descargan en la penumbra, y Yesid Mena, treinta y cuatro años, quince de ellos como cargador, se acomoda un costal de papa sobre el hombro con un movimiento de bailarín. «Todo está en no pelear con el peso», me explica. «Uno lo recibe y se va con él».\n\nGana, según el día, entre cuarenta y noventa mil pesos. No tiene contrato, ni seguridad social, ni uniforme; tiene, en cambio, una clientela que lo reconoce por el nombre y un código de honor que nadie ha escrito: el turno de descarga se respeta, el cliente de otro no se roba, y al compañero que se lesiona se le recoge una colecta antes de que termine la semana. «Esto es informal en los papeles», dice, «pero tiene más normas que un banco».\n\nHace dos años intentaron organizarlos. Una fundación les ofreció carné, chalecos y una aplicación para recibir pedidos. Yesid lo recuerda sin amargura: «Los chalecos eran bonitos». La aplicación asignaba los trabajos por cercanía, no por turno, y en tres semanas dos compañeros se pelearon por un pedido; el código se había roto. Volvieron al sistema de antes, que no era mejor ni peor, sino suyo.\n\nNo es una historia sobre la nostalgia de lo precario. Yesid sueña con aportar a una pensión, con que su hija estudie algo que no se haga con la espalda. Pero reconoce que quienes quieren ayudarlo suelen llegar con soluciones que ya tienen forma antes de preguntarle cómo funciona la plaza. A las seis, cuando la luz por fin rebasa el techo de zinc, vuelve a cargar: la papa no espera a que los diagnósticos se completen."},"lc-c15":{"kind":"texto","title":"Los relojes del taller","text":"Después del entierro, Camilo se quedó con las llaves del taller. Eran once, atadas con un alambre, y ninguna tenía etiqueta: su padre sostenía que quien necesita etiquetas no conoce su propia casa. Camilo, que había pasado veinte años en otra ciudad aprendiendo a necesitarlas, probó una tras otra en la puerta metálica hasta que cedió con un quejido que reconoció, absurdamente, como un saludo.\n\nAdentro olía a aceite y a café frío. Sobre el mesón seguían los relojes sin reparar, cada uno con su papelito amarillo: apellido, fecha, falla. Camilo los leyó uno a uno y fue entendiendo, con una mezcla de ternura y fastidio, que su padre había dejado de cobrar desde hacía años. «Ya vendrá a recogerlo», anotaba al margen, con su letra apretada. No iban a venir. Algunos clientes habían muerto antes que los relojes.\n\nSe sentó en el taburete de su padre, que le quedaba incómodo, y abrió el cajón central buscando alguna factura, algo que le permitiera cerrar el negocio con la eficiencia que se esperaba de un hombre como él. Encontró, en cambio, una libreta con una sola columna de fechas y, al lado de cada una, una hora: las 3:10, las 7:45, las 11:20. No entendió nada hasta que levantó la vista. En la pared, doce relojes marcaban doce horas distintas. Su padre no los había dejado atrasados; los había detenido, uno por cada visita de Camilo, a la hora exacta en que este se había marchado.\n\nCamilo cerró el cajón con cuidado. Después sacó el celular, canceló la cita con el corredor inmobiliario y se quedó un rato más, sin poner ninguno en hora."},"lc-c16":{"kind":"texto","title":"La lata de galletas","text":"La tía Adelaida escribía todas las tardes, de tres a cinco, en la mesa del comedor, y guardaba lo escrito en una lata de galletas danesas que nadie tenía permiso de abrir. En el pueblo se daba por cierto que eran cartas para un ingeniero de ferrocarriles que la había dejado esperando en 1958, y mi madre, que no creía en casi nada, creía en eso con una devoción casi religiosa: le convenía que su hermana fuera una enamorada trágica y no otra cosa.\n\nYo, a los once años, sospechaba lo contrario, pero no tenía las palabras. Veía a la tía levantar la vista cada vez que pasaba un vecino por la ventana, con la expresión de quien ensaya una frase. Más de una vez la vi mover los labios.\n\nCuando murió, mi madre me pidió que abriera la lata «para quemar lo que sea que haya ahí, sin leer». Obedecí a medias: quemé las cartas, pero antes leí una. Estaba dirigida a doña Ligia, la panadera, y decía, con la letra redonda de la tía: «Quería decirle que el pan de los jueves es el mejor, y que nunca se lo dije porque no supe cómo empezar». La siguiente era para el cartero. La siguiente, para mi madre, y no la leí.\n\nNo era una enamorada. Era alguien que había pasado cincuenta años con cosas importantes en la boca y sin saber cómo llevarlas de la boca a la calle. Ahora, cuando me toca dar las gracias a alguien, me acuerdo de la lata y me apresuro, aunque a veces lo único que me sale es una frase torpe, que es, supongo, lo que ella nunca se permitió."},"lc-c17":{"kind":"texto","title":"Ventanilla","text":"(Oficina de pensiones. Una ventanilla con vidrio y una rejilla. De un lado, el FUNCIONARIO, que teclea. Del otro, LUCÍA, de setenta años, con un bolso apretado contra el pecho.)\n\nFUNCIONARIO: (sin levantar la vista) Número.\n\nLUCÍA: El treinta y cuatro.\n\nFUNCIONARIO: Están en el veintidós. Siéntese.\n\nLUCÍA: Es que vine a reclamar. Mi pensión no ha llegado.\n\nFUNCIONARIO: (levanta la vista, por fin) ¿Nombre?\n\nLUCÍA: Lucía Arboleda.\n\n(Teclea. Hace una pausa larga.)\n\nFUNCIONARIO: Aquí figura que usted falleció.\n\nLUCÍA: (tras un silencio) Pues parece que no.\n\nFUNCIONARIO: El sistema es muy claro. Falleció el once de marzo.\n\nLUCÍA: Yo estoy hablando con usted.\n\nFUNCIONARIO: Y yo se lo agradezco. Pero debo atender lo que consta. (Saca un formulario.) Para corregirlo necesito un certificado de supervivencia.\n\nLUCÍA: ¿Y quién lo firma?\n\nFUNCIONARIO: Un funcionario. No yo: yo solo puedo recibirlo. Lo firma uno de la oficina de enfrente, que está cerrada hasta el lunes.\n\nLUCÍA: Hoy es martes.\n\nFUNCIONARIO: Entonces tiene tiempo de sobra. (Sonríe, apenado.) No se ofenda, señora. A mí también me da pena hablar con una difunta.\n\nLUCÍA: (se sienta en el suelo, con tranquilidad) Entonces esperaré aquí. A los muertos no nos importa la fila.\n\n(El FUNCIONARIO duda. Baja la cortina de la ventanilla. Se oye el ruido de una silla que se arrastra. Al rato, la cortina sube.)\n\nFUNCIONARIO: Treinta y cuatro.\n\nLUCÍA: Pero si apenas van por el veintidós.\n\nFUNCIONARIO: Los casos especiales pasan primero. (Pausa.) Y usted, hay que reconocerlo, es muy especial."},"lc-c18":{"kind":"texto","title":"Inventario de una mudanza","text":"Anoto lo que se va en la caja:\ndos tazas con el mismo borde roto,\nun mapa que no concuerda con ninguna calle,\nel abrigo que usé para no pedir nada.\n\nAnoto lo que se queda:\nla mancha de humedad con forma de país,\nla marca del cuadro, más clara que la pared,\nun clavo sin oficio, sosteniendo\nel aire donde estuvo la fotografía.\n\nNadie dice que las casas escuchan.\nEsta, sin embargo, guardó mis pasos\ncon una paciencia de piedra,\ny ahora los devuelve uno a uno,\ncomo quien entrega, sin reproche,\nlas llaves de lo que no fue.\n\nCierro. En la puerta, por un segundo,\nse me olvida cuál de los dos se va."},"lc-c19":{"kind":"otro","title":"Los libros de la abuela","text":"Historieta de cuatro viñetas.\n\nViñeta 1: Un niño de unos diez años, con un celular en la mano, señala una gran biblioteca en la sala de su abuela. Globo del niño: «Abuela, ¿para qué tantos libros si todo está en internet?».\n\nViñeta 2: La abuela, sentada en una mecedora, saca un libro viejo del estante y lo abre. Globo de la abuela: «Búscame en internet lo que tu abuelo escribió aquí el día que nos conocimos».\n\nViñeta 3: El niño, con el libro en las manos, lee una nota manuscrita en la primera página. El celular, olvidado, cuelga de su otra mano. Globo de pensamiento del niño: «...».\n\nViñeta 4: El niño mira a la abuela y dice: «¿Y si me prestas uno?». La abuela sonríe. Junto a la mecedora hay ahora una pequeña pila de libros."},"lc-c20":{"kind":"aviso","title":"Reglamento de las salas de ensayo","text":"CENTRO CULTURAL LA CEIBA — SALAS DE ENSAYO\nReglamento de uso (vigente desde enero de 2026)\n\n1. Reservas. Las salas se reservan con un mínimo de 48 horas de anticipación, en turnos de dos horas. Cada grupo puede tener como máximo dos reservas activas.\n\n2. Cancelaciones. Una reserva cancelada con menos de 24 horas de anticipación se contará como utilizada. Si el grupo no se presenta en los primeros 15 minutos del turno, la sala se libera.\n\n3. Tarifas. Los grupos residentes en el barrio (con comprobante) pagan tarifa reducida; los demás pagan tarifa plena. Los menores de 18 años ensayan gratis los sábados en la mañana, acompañados de un adulto responsable.\n\n4. Volumen. Entre las 8:00 p. m. y las 10:00 p. m., el nivel sonoro de las salas no podrá exceder el acordado con la junta de vecinos. A partir de las 10:00 p. m. no se permiten ensayos con batería acústica ni con amplificación.\n\n5. Equipos. El centro presta amplificadores y micrófonos; los instrumentos personales son responsabilidad de cada grupo. El daño a los equipos del centro será asumido por quien hizo la reserva.\n\n6. Sanciones. Dos incumplimientos de las normas en un mismo trimestre suspenden al grupo por 30 días."}},"qs":[{"i":"lc-001","q":"En el primer párrafo, la comparación «como quien oye su propia voz en una grabación» sugiere que a los docentes la pregunta «¿esto va para nota?»","o":["les parece ofensiva porque revela una falta de respeto de los estudiantes hacia la autoridad docente","les incomoda porque reconocen en ella una lógica que la escuela ha fomentado","les resulta extraña porque casi nunca la escuchan en sus aulas y no saben cómo responderla","les genera orgullo porque muestra que los estudiantes valoran de verdad el trabajo que hacen"],"a":1,"e":"La grabación de la propia voz suena familiar y a la vez molesta: uno se reconoce sin haberse elegido así. Por eso la comparación indica que los docentes ven en la pregunta el reflejo de una lógica que ellos y el sistema han promovido. No se habla de irrespeto ni de rareza; el texto dice que la lección fue «aprendida con rigor» en la escuela.","t":{"afirm":1,"tipo":"ensayo","dif":1},"c":"lc-c01"},{"i":"lc-002","q":"Dentro del ensayo, el segundo párrafo cumple la función de","o":["refutar por completo la idea de que la nota ha deformado el aprendizaje en la escuela","ejemplificar con un caso concreto el daño que las notas causan a los estudiantes de regiones apartadas","proponer una alternativa que reemplace la calificación numérica por rúbricas narrativas detalladas","conceder una ventaja real de la calificación que matiza la crítica posterior"],"a":3,"e":"El párrafo comienza con «Sería injusto» y reconoce que el número permite comparar sin conocer: es una concesión que prepara la crítica del tercer párrafo. No refuta la crítica (la deja intacta), el caso de Medellín y Quibdó ejemplifica una virtud, no un daño, y las rúbricas narrativas se mencionan solo para decir que no han podido reemplazar al número.","t":{"afirm":2,"tipo":"ensayo","dif":2},"c":"lc-c01"},{"i":"lc-003","q":"Al afirmar «Nadie culpa al río por seguir el cauce que le cavaron», el autor emplea una analogía para","o":["defender que los estudiantes deben ser sancionados cuando persiguen únicamente la nota","mostrar que los cambios en la educación son tan naturales e inevitables como el curso de un río","plantear que el estudiante actúa según el sistema que lo induce, no por un defecto propio","advertir que el aprendizaje, igual que el agua, no puede ser contenido por la institución escolar"],"a":2,"e":"El río es la conducta del estudiante y el cauce, el sistema de incentivos; así como sería absurdo culpar al río, lo es culpar al estudiante. La oración anterior lo adelanta: no es una «degeneración moral», sino una respuesta previsible. Las otras opciones sacan la imagen de su función argumentativa.","t":{"afirm":3,"tipo":"ensayo","dif":2},"c":"lc-c01"},{"i":"lc-004","q":"En el segundo párrafo, el autor aclara que los neurocientíficos «sugieren» y no «demuestran» para indicar que sus resultados","o":["han sido desmentidos por investigaciones posteriores","son indicios que todavía no permiten una conclusión firme","carecen de relevancia para discutir el uso de la tecnología","coinciden por completo con lo que ya se sabía sobre el cerebro"],"a":1,"e":"El verbo «sugerir» marca un grado de certeza menor que «demostrar»; el autor mismo lo vincula con las «muestras pequeñas». Por eso los hallazgos son indicios provisionales. El texto no dice que hayan sido desmentidos ni que sean irrelevantes, pues los usa como parte de su argumento.","t":{"afirm":1,"tipo":"ensayo","dif":1},"c":"lc-c02"},{"i":"lc-005","q":"La alusión a Sócrates en el tercer párrafo resulta irónica porque","o":["Sócrates defendía la escritura mientras Platón la rechazaba en sus diálogos","Platón corrigió por escrito las críticas de Sócrates contra la memoria humana","la crítica de Sócrates a la escritura solo se conoce gracias a un texto escrito","Sócrates desconfiaba de la escritura pero la empleaba para enseñar a sus discípulos"],"a":2,"e":"La ironía está en la paradoja: conocemos la crítica a la escritura porque Platón la puso por escrito. Eso muestra que la delegación que Sócrates temía fue también la que preservó su pensamiento. Las otras opciones atribuyen a Sócrates o a Platón posturas que el texto no menciona.","t":{"afirm":3,"tipo":"ensayo","dif":3},"c":"lc-c02"},{"i":"lc-006","q":"¿Cuál de los siguientes enunciados sintetiza mejor la tesis del texto?","o":["Las herramientas de navegación debilitan la memoria y por eso conviene abandonarlas por completo","Lo decisivo no es si delegamos en la tecnología, sino qué capacidades delegamos","Delegar en herramientas externas es inofensivo, pues la humanidad siempre lo ha hecho","La escritura y el GPS tienen efectos idénticos sobre las facultades humanas de orientación"],"a":1,"e":"El cuarto párrafo formula la tesis: «no es si delegar, sino qué delegar». La primera opción es una lectura parcial (el autor rechaza volver a los planos de papel); la segunda sobregeneraliza el argumento histórico del tercer párrafo; la tercera afirma una identidad que el texto no establece.","t":{"afirm":2,"tipo":"ensayo","dif":2},"c":"lc-c02"},{"i":"lc-007","q":"Según el segundo párrafo, el español actual se originó en","o":["la corrección que los gramáticos hicieron del latín de soldados y comerciantes","la obra de Cervantes, que fijó las reglas de la lengua","las transformaciones que hablantes populares introdujeron en el latín","la victoria de los puristas sobre los hablantes del latín vulgar"],"a":2,"e":"El texto dice que el español fue «un latín mal hablado por soldados, comerciantes y esclavos», es decir, el resultado de cambios hechos por hablantes comunes. Los puristas, de hecho, aparecen como quienes habrían detenido ese proceso, y Cervantes se menciona como beneficiario, no como fundador.","t":{"afirm":1,"tipo":"ensayo","dif":1},"c":"lc-c03"},{"i":"lc-008","q":"El tercer párrafo comienza con «Nada de esto equivale a decir que todo vale». Esa frase cumple la función de","o":["retractarse de lo afirmado sobre los puristas en el párrafo anterior","resumir las conclusiones de los dos primeros párrafos","advertir que la tesis no implica negar toda norma lingüística","introducir un ejemplo de errores que deben ser sancionados"],"a":2,"e":"La frase delimita el alcance de la tesis para evitar una lectura relativista extrema; luego el párrafo explica que hay reglas, pero que lo clave es la adecuación. No es una retractación, pues el autor mantiene su postura, ni un resumen, y el ejemplo de «haiga» viene después y sirve para otro propósito.","t":{"afirm":2,"tipo":"ensayo","dif":2},"c":"lc-c03"},{"i":"lc-009","q":"La afirmación final del texto («La verdadera amenaza para un idioma no es que cambie, sino que deje de cambiar») se vería debilitada por el caso de una lengua que","o":["casi no ha cambiado en siglos y hoy cuenta con millones de hablantes activos","ha incorporado muchos préstamos extranjeros y aun así sigue usándose a diario en la calle","dejó de hablarse justo cuando sus hablantes dejaron de transformarla y adaptarla","tiene pocos hablantes, pero registra términos nuevos cada año"],"a":0,"e":"La tesis supone que la falta de cambio acompaña la pérdida de hablantes; un contraejemplo de inmovilidad con vitalidad la debilita directamente. Los otros casos son compatibles con ella: los préstamos y los neologismos muestran cambio con uso, y la lengua que muere sin transformarse la confirma.","t":{"afirm":3,"tipo":"ensayo","dif":3},"c":"lc-c03"},{"i":"lc-010","q":"La comparación con los bomberos del primer párrafo sirve para","o":["criticar el desempeño de los bomberos y también el de las autoridades de salud pública","sugerir que las campañas de vacunación deben organizarse como un servicio de emergencias","explicar que la salud pública tiene mala prensa porque sus programas no logran resultados visibles","ilustrar con una analogía que el éxito de la prevención suele pasar inadvertido"],"a":3,"e":"El incendio que no ocurrió equivale a la enfermedad que no apareció: en ambos casos el trabajo bien hecho no deja huella visible. La última opción invierte la relación causal, pues el texto atribuye la mala prensa al éxito de las campañas, no a su fracaso.","t":{"afirm":2,"tipo":"ensayo","dif":2},"c":"lc-c04"},{"i":"lc-011","q":"A partir del tercer párrafo, es una implicación válida que","o":["las cifras sobre mortalidad evitada deben eliminarse de las campañas de salud pública","quienes dudan de las vacunas desconocen por completo los datos estadísticos disponibles","las campañas con relatos de casos concretos podrían persuadir más que las de solo cifras","las anécdotas falsas son más confiables que los datos bien presentados y explicados"],"a":2,"e":"El párrafo afirma que los datos «no pueden competir» con una anécdota vívida y que las campañas eficaces recuperan lo concreto. Las demás opciones exageran: el cuarto párrafo rechaza abandonar los números, el texto no dice que los escépticos ignoren las cifras y habla del poder de las anécdotas, no de su confiabilidad.","t":{"afirm":3,"tipo":"ensayo","dif":2},"c":"lc-c04"},{"i":"lc-012","q":"En el segundo párrafo, la expresión «un precio sin contrapartida» describe la manera en que algunas personas perciben el riesgo de una reacción adversa, es decir, como","o":["una tarifa que las familias deben pagar sin recibir protección","un perjuicio mayor que el beneficio que la vacuna produce","un trámite económico que ninguna institución compensa","un costo cuyo beneficio asociado no alcanzan a ver"],"a":3,"e":"El «precio» es el riesgo; la «contrapartida», el beneficio de haber evitado la enfermedad, que como no se ve, no se percibe. El texto no habla de costos monetarios ni afirma que el riesgo supere al beneficio; describe una percepción, no un hecho.","t":{"afirm":1,"tipo":"ensayo","dif":2},"c":"lc-c04"},{"i":"lc-013","q":"En el tercer párrafo, la frase «Se dirá que es un lujo pensar en la poesía de un pregón...» corresponde a","o":["una objeción anticipada por el autor, a la que responde enseguida","la opinión de un vecino a quien el autor entrevistó para escribir el ensayo","una tesis que el autor defiende en este punto del texto con total convicción","una cita de autoridad que respalda las normas vigentes sobre el ruido urbano"],"a":0,"e":"«Se dirá» introduce una voz hipotética, la de un posible contradictor. El autor la reconoce («es válida») y luego la desmonta al llamar falsa la disyuntiva. No es una tesis propia, pues la contradice, ni una cita real: no hay entrevistado ni fuente.","t":{"afirm":2,"tipo":"ensayo","dif":3},"c":"lc-c05"},{"i":"lc-014","q":"En el segundo párrafo, una normativa que «solo sabe restar» es aquella que","o":["ignora por completo los efectos del ruido sobre el sueño y la salud de las personas","disminuye las sanciones impuestas a quienes producen ruido excesivo en la noche","calcula los decibeles mediante operaciones matemáticas sencillas y poco precisas","se limita a reducir sonidos sin considerar cuáles convendría conservar"],"a":3,"e":"«Restar» alude a quitar sonido; el texto contrasta esto con la posibilidad de «preservar» sonidos que dan identidad. El autor aclara que medir y sancionar es necesario, así que no dice que la norma ignore la salud.","t":{"afirm":1,"tipo":"ensayo","dif":1},"c":"lc-c05"},{"i":"lc-015","q":"Para que la propuesta final del autor sea viable, es necesario suponer que","o":["el ruido del tráfico no tiene efectos sobre la salud de las personas que viven cerca","los vecinos pueden identificar y acordar cuáles sonidos dan identidad a su lugar","los sonidos tradicionales deben quedar exentos de cualquier medición o control","las ciudades silenciosas son más seguras y ordenadas que las ciudades ruidosas"],"a":1,"e":"El autor propone «distinguir cuáles quiere conservar» y dice que eso exige preguntar a los vecinos; la propuesta funciona si ellos pueden reconocer y concertar esos sonidos. Las otras opciones contradicen sus afirmaciones (reconoce los efectos del ruido) o añaden ideas que el texto no plantea.","t":{"afirm":3,"tipo":"ensayo","dif":2},"c":"lc-c05"},{"i":"lc-016","q":"En el primer párrafo, «ratificar» lo que el gerente decidió significa","o":["discutir de nuevo la decisión y eventualmente modificarla","informar a los empleados sobre una decisión que se tomará después","confirmar formalmente una decisión ya tomada","cuestionar abiertamente la autoridad del gerente"],"a":2,"e":"Ratificar es confirmar algo ya decidido. El contraste entre las diez de la mañana (cuando se decidió) y las tres de la tarde (cuando se reúne el equipo) muestra que la reunión no abre discusión alguna.","t":{"afirm":1,"tipo":"columna","dif":1},"c":"lc-c06"},{"i":"lc-017","q":"En el tercer párrafo, la frase «lo humano se pierde» corresponde a","o":["la conclusión que el autor extrae sobre las ventajas de las reuniones virtuales","la postura de quienes defienden la presencialidad, que el autor acepta solo en parte","la opinión del autor sobre el uso de correos y documentos en las empresas","una cita que el autor refuta por completo en el párrafo siguiente"],"a":1,"e":"La expresión está entre comillas y atribuida a «los defensores de la presencialidad». El autor concede que «algo de razón tienen» y enseguida la acota, así que no la acepta ni la rechaza del todo.","t":{"afirm":2,"tipo":"columna","dif":2},"c":"lc-c06"},{"i":"lc-018","q":"La frase final («Si la línea no sale, no hay reunión; si sale, tal vez tampoco») permite inferir que el autor considera que","o":["toda reunión es innecesaria, incluso cuando hay desacuerdos importantes por resolver","los gerentes deberían decidir solos para evitar las convocatorias a reuniones","muchas decisiones que caben en una línea podrían comunicarse sin convocar a nadie","las decisiones difíciles de resumir deben tomarse únicamente por escrito y sin discusión"],"a":2,"e":"El «tal vez» matiza: una decisión resumible en una línea quizá no necesite reunión. La primera opción sobregeneraliza y contradice el tercer párrafo, donde se admite que algunas decisiones exigen encuentro. Las otras dos atribuyen propuestas que el texto no hace.","t":{"afirm":3,"tipo":"columna","dif":3},"c":"lc-c06"},{"i":"lc-019","q":"Dentro de la columna, el primer párrafo cumple la función de","o":["ilustrar con una experiencia propia la brecha entre el esfuerzo individual y la gestión real","demostrar que el servicio de aseo es la causa principal de la crisis de residuos urbanos","presentar al autor como un ciudadano ejemplar cuya conducta todos deberían imitar","mostrar que separar los residuos en el hogar es un gesto inútil y sin sentido"],"a":0,"e":"La anécdota sirve de punto de partida; el segundo párrafo aclara que se usa «menos para quejarme del servicio de aseo» que para señalar un mecanismo más profundo. Tampoco concluye que separar sea inútil: el tercer párrafo lo califica de gesto razonable.","t":{"afirm":2,"tipo":"columna","dif":2},"c":"lc-c07"},{"i":"lc-020","q":"¿Cuál de los siguientes hallazgos debilitaría más la postura del autor?","o":["Una encuesta que revela que la mayoría de los ciudadanos de varias ciudades sí separa sus residuos en casa","Un informe que señala que los camiones de varias ciudades mezclan los residuos que los hogares ya separaron","Un estudio según el cual los residuos dependen sobre todo de cómo separan los hogares y poco del envase","Una investigación que indica que la industria de empaques financia campañas de reciclaje domiciliario"],"a":2,"e":"El autor sostiene que el problema de fondo está en el diseño de los envases; un estudio que lo declare casi irrelevante socava esa tesis. Las otras opciones son compatibles con ella: refuerzan la anécdota inicial o la idea de que la industria promueve el reciclaje individual.","t":{"afirm":3,"tipo":"columna","dif":3},"c":"lc-c07"},{"i":"lc-021","q":"Cuando el autor dice que una sociedad «ha confundido el síntoma con la causa», quiere decir que esa sociedad","o":["ha exagerado la gravedad de la crisis de los residuos que enfrenta el país","ha culpado a los hogares por lo que en realidad es una falla del servicio de aseo","ha atribuido a la industria un problema que es solo de los consumidores finales","atiende lo visible, la conducta de los hogares, y no el origen, el diseño de los empaques"],"a":3,"e":"El síntoma es lo que se ve (la bolsa del vecino); la causa, lo que se pregunta poco (por qué tanto empaque). La última opción invierte la relación: el autor critica justamente que se cargue la responsabilidad al consumidor y no a la industria.","t":{"afirm":1,"tipo":"columna","dif":2},"c":"lc-c07"},{"i":"lc-022","q":"El razonamiento del primer párrafo sostiene que","o":["el arte ha decaído desde la antigüedad, tal como lo han creído todas las generaciones sucesivas","las generaciones mayores poseen un criterio musical más seguro que el de las jóvenes","la música antigua se apoyaba en el «alma» y la actual solo en la técnica y el mercado","una creencia repetida en toda época no se explica por una decadencia continua del arte"],"a":3,"e":"El autor plantea una disyuntiva: o el arte decae sin pausa, lo cual sería absurdo, o el juicio está torcido por otro factor, que identifica enseguida con la memoria. La primera opción toma como cierta la hipótesis que el autor descarta, y las otras dos atribuyen afirmaciones que el texto no hace.","t":{"afirm":2,"tipo":"columna","dif":2},"c":"lc-c08"},{"i":"lc-023","q":"En el tercer párrafo, decir que «tenía alma» se parece más a una confesión que a un argumento significa que esa expresión","o":["revela un sentimiento personal, pero no ofrece razones comprobables","admite un error de quien desea corregir su opinión sobre la música de otras épocas","expone razones técnicas que cualquier oyente atento puede verificar por su cuenta","reconoce que la música reciente es mejor que la música de antes"],"a":0,"e":"Una confesión expresa lo que uno siente; un argumento presenta razones. El autor contrasta «tenía alma» con las críticas «concretas, que se pueden verificar», así que la expresión no ofrece razones comprobables. No hay admisión de error ni reconocimiento de superioridad actual.","t":{"afirm":1,"tipo":"columna","dif":1},"c":"lc-c08"},{"i":"lc-024","q":"Si la explicación del segundo párrafo es correcta, es una implicación válida que un joven de dieciocho años en la actualidad","o":["preferirá en su adultez la música que escuchaban sus padres cuando eran jóvenes","recordará con especial cariño la música actual y la juzgará superior dentro de décadas","tendrá un juicio más objetivo sobre la música por haber crecido con mayor variedad","no desarrollará un vínculo especial con la música de su juventud ni con ninguna otra"],"a":1,"e":"Según el «pico de reminiscencia», la música que se escucha entre los quince y los veinticinco años queda asociada a vivencias intensas, de modo que cada generación tenderá a idealizar la suya. Las otras opciones contradicen ese mecanismo o suponen cosas que el texto no sostiene.","t":{"afirm":3,"tipo":"columna","dif":2},"c":"lc-c08"},{"i":"lc-025","q":"La expresión «título de nobleza lingüística» tiene en el primer párrafo un efecto irónico, pues sugiere que","o":["la sociedad reconoce con justicia el prestigio de quienes venden alimentos en la calle","las personas desempleadas pertenecen a una élite que goza de privilegios sociales","vender arepas es una actividad menos valiosa que un empleo formal en una empresa","el nuevo nombre dignifica la situación sin cambiar las condiciones reales"],"a":3,"e":"Un «título de nobleza» se otorga sin cambiar quién es uno; aquí lo que cambia es la palabra («emprendedor»), no la situación. El autor no desprecia la venta de arepas ni habla de privilegios: critica el efecto de un lenguaje que embellece la precariedad.","t":{"afirm":3,"tipo":"columna","dif":2},"c":"lc-c09"},{"i":"lc-026","q":"El segundo párrafo se relaciona con el primero porque","o":["contradice la crítica inicial al afirmar que emprender siempre otorga mayor libertad personal","reconoce el mérito de los emprendedores y aclara que objeta el uso de la palabra como consigna","explica por qué los desempleados prefieren llamarse emprendedores en vez de desempleados","muestra que el crédito inaccesible es la única causa de todos los fracasos empresariales"],"a":1,"e":"El párrafo abre con una concesión («No quiero ser injusto») y luego define el verdadero reparo: la palabra convertida en consigna oculta las condiciones. No contradice la crítica inicial ni afirma que el crédito sea la única causa; menciona también el mercado saturado.","t":{"afirm":2,"tipo":"columna","dif":2},"c":"lc-c09"},{"i":"lc-027","q":"Según el tercer párrafo, el «sesgo del sobreviviente» consiste en","o":["premiar únicamente a quienes persisten en sus negocios a pesar de las dificultades","creer que los fracasos se deben siempre al carácter de las personas que emprenden","generalizar a partir de los casos exitosos e ignorar a quienes fracasaron","entrevistar solo a quienes han sufrido pérdidas económicas importantes en sus negocios"],"a":2,"e":"El texto lo define con la imagen de quienes «llegaron a la cima» y se concluye que «basta con trepar», sin preguntar por los que cayeron. La segunda opción describe un problema distinto, mencionado en el párrafo anterior, que no es el sesgo señalado.","t":{"afirm":1,"tipo":"columna","dif":1},"c":"lc-c09"},{"i":"lc-028","q":"Según el primer párrafo, lo que más escandalizó al profesor fue","o":["la gravedad ética del plagio en el entorno escolar","la uniformidad de los textos, que delata un recurso poco original","el desconocimiento de la historia de Francia por parte de los estudiantes","la decisión de la institución de permitir los asistentes de redacción"],"a":1,"e":"El texto dice que no lo escandalizó la trampa, sino «la falta de imaginación de la trampa»: veinte ensayos con la misma frase inicial. Por eso la gravedad ética no es el centro, y nada indica que el profesor cuestionara a su institución.","t":{"afirm":1,"tipo":"columna","dif":1},"c":"lc-c10"},{"i":"lc-029","q":"Según el segundo párrafo, la analogía entre los asistentes de redacción y la calculadora es débil porque","o":["el resultado de la calculadora se puede verificar, y el de un texto generado muchas veces no","la calculadora no se utiliza en las aulas con la misma frecuencia que los asistentes de redacción","los asistentes de redacción cometen muchos más errores de cálculo que una calculadora","la calculadora reemplaza el aprendizaje de las operaciones, y los asistentes no lo hacen"],"a":0,"e":"El autor señala dos diferencias: la verificabilidad del resultado y la apariencia de aprendizaje que produce el texto generado. Las otras opciones introducen comparaciones de frecuencia, de exactitud o de reemplazo del aprendizaje que el texto no plantea.","t":{"afirm":3,"tipo":"columna","dif":2},"c":"lc-c10"},{"i":"lc-030","q":"De acuerdo con el tercer párrafo, la aparición de los asistentes de redacción revela que","o":["evaluar solo el producto no medía lo que de verdad importaba del ensayo","el ensayo escolar perdió su utilidad como ejercicio de aprendizaje para los estudiantes","el proceso de escritura es irrelevante cuando el texto final tiene buena calidad","los asistentes mejoran el proceso de escritura y por eso deben aceptarse en el aula"],"a":0,"e":"El autor sostiene que el valor del ensayo estaba en el proceso (dudar, reescribir); si solo se evaluaba el producto, ese diseño quedó expuesto. No afirma que el ensayo sea inútil, y tampoco defiende los asistentes: propone evaluar el proceso.","t":{"afirm":2,"tipo":"columna","dif":3},"c":"lc-c10"},{"i":"lc-031","q":"Según don Ernesto, el principal factor que desafina los pianos en Barranquilla es","o":["el uso intensivo que se les da en las academias y los colegios de la ciudad","la escasez de afinadores calificados que puedan atenderlos con regularidad","el clima de la costa, con su calor y la sal en el aire","la mala calidad de la madera con que se fabrican los instrumentos antiguos"],"a":2,"e":"El afinador lo dice de forma explícita: el piano se destempla «no por el uso, sino por el clima», y el texto detalla que el calor y la sal oxidan las cuerdas e hinchan la madera. La falta de afinadores es una preocupación suya, pero no la causa del destemple.","t":{"afirm":1,"tipo":"cronica","dif":1},"c":"lc-c11"},{"i":"lc-032","q":"El tercer párrafo se relaciona con el anterior porque","o":["contradice su queja sobre los jóvenes al reconocer que las aplicaciones funcionan bien","anuncia que la tecnología terminará reemplazando al afinador de oficio en pocos años","cambia de tema para explicar las propiedades acústicas de las cuerdas del piano","aclara que don Ernesto acepta la tecnología para una tarea y deja el resto al oído"],"a":3,"e":"En el párrafo anterior don Ernesto critica a quienes aprenden solo con una aplicación; en este aclara que él usa un afinador electrónico para la nota de partida, pero decide el resto de oído. No hay contradicción, y la explicación acústica sirve para sostener su postura, no para cambiar de tema.","t":{"afirm":2,"tipo":"cronica","dif":2},"c":"lc-c11"},{"i":"lc-033","q":"Del pasaje sobre las cuerdas graves y agudas que «se estiran un poco» se puede inferir que, para don Ernesto,","o":["una buena afinación depende de cómo se percibe el sonido, no solo de valores exactos","la afinación exacta es imposible de conseguir en un piano, sin importar el clima","las aplicaciones de afinación producen resultados erróneos en todos los casos","el oído humano es más preciso que cualquier instrumento de medición disponible"],"a":0,"e":"Si el «error» deliberado hace que el piano suene correcto, entonces el criterio último es perceptivo. Decir que las aplicaciones fallan siempre o que el oído supera a toda medición sobregeneraliza; y el texto no afirma que la afinación exacta sea imposible, sino que no es lo que se busca.","t":{"afirm":3,"tipo":"cronica","dif":3},"c":"lc-c11"},{"i":"lc-034","q":"La comparación de los rieles con «una frase que nadie borró del todo en un manuscrito» sugiere que los rieles","o":["habían sido escritos por los obreros para dejar un mensaje","eran un error que debía corregirse antes de terminar la obra","conservaban, bajo lo nuevo, un vestigio del pasado de la ciudad","contenían un texto histórico que los obreros leyeron al desenterrarlos"],"a":2,"e":"El manuscrito es la ciudad, la frase borrada a medias son los rieles: quedan como rastro de lo que existió debajo del asfalto. La imagen es metafórica; no habla de textos reales ni de un error por corregir.","t":{"afirm":1,"tipo":"cronica","dif":2},"c":"lc-c12"},{"i":"lc-035","q":"La frase «el pasado, con todo respeto, no puede detener un cronograma» es sostenida por","o":["el narrador, que critica la conservación de los rieles y de otros vestigios históricos","don Aurelio, que defiende el valor sentimental del tranvía para su familia","los vecinos, que reclaman por el polvo que genera la obra desde hace meses","el residente de obra, que prioriza los plazos del contrato sobre el hallazgo"],"a":3,"e":"La cita se atribuye explícitamente al residente de obra, quien representa la urgencia de los ingenieros. Los vecinos «no parecían en desacuerdo», pero no son quienes la pronuncian, y don Aurelio asume una posición contraria.","t":{"afirm":2,"tipo":"cronica","dif":1},"c":"lc-c12"},{"i":"lc-036","q":"El último párrafo cierra la crónica con una ironía que consiste en señalar que la ciudad","o":["entierra, con buenas razones, lo que ya tenía mientras discute cómo construirlo","incumple los plazos del contrato porque prefiere conservar sus rieles históricos","debería haber usado los rieles hallados como base para el nuevo sistema de transporte","quedó satisfecha con el arreglo del museo porque preservó su pasado"],"a":0,"e":"La ironía nace del contraste entre «acaba de enterrar» los rieles y «discute hace años» cómo construir un sistema sobre rieles, todo «con las mejores razones». El texto no propone reutilizarlos ni dice que haya incumplimiento; además, el arreglo deja «a todos un poco insatisfechos».","t":{"afirm":3,"tipo":"cronica","dif":3},"c":"lc-c12"},{"i":"lc-037","q":"En el segundo párrafo, el episodio de las fochas y el tronco ilustra que","o":["la expectativa del observador puede llevarlo a registrar aves que no existen","los binoculares usados por los voluntarios eran demasiado imprecisos para el conteo","el contador jubilado carecía de experiencia en trabajo de campo con aves","las aves se esconden en el junco y por eso no pueden contarse"],"a":0,"e":"El texto enlaza el episodio con la regla de Marta: el entusiasmo convierte sombras en pájaros. No se atribuye el error a los binoculares ni a la inexperiencia del contador; y el ocultamiento en el junco se menciona en otro contexto, para explicar por qué el conteo es una estimación.","t":{"afirm":1,"tipo":"cronica","dif":1},"c":"lc-c13"},{"i":"lc-038","q":"En el tercer párrafo, la distinción entre censo y estimación se usa para sostener que","o":["los datos de los aficionados son menos confiables que los de científicos profesionales","resulta imposible saber algo útil sobre las poblaciones de aves de un humedal","los conteos deberían reemplazarse por censos exhaustivos realizados cada año","una cifra imprecisa sirve si se obtiene siempre del mismo modo para ver tendencias"],"a":3,"e":"Marta admite que no sabrá cuántas aves hay, pero afirma que, si se cuenta de la misma forma cada año, «lo que importa es si sube o baja». Esto descarta tanto la desconfianza hacia los voluntarios como la idea de que no se puede saber nada.","t":{"afirm":2,"tipo":"cronica","dif":2},"c":"lc-c13"},{"i":"lc-039","q":"La frase final de la niña («esta vez no es un tronco») funciona en el conjunto de la crónica como","o":["una señal de que la niña desconfía de los resultados que se obtienen con el conteo","una prueba de que los voluntarios dejan de cometer errores cuando adquieren práctica","un cierre con humor que muestra que la niña aprendió a distinguir lo visto de lo esperado","la confirmación de que las aves migratorias están llegando en menor número este año"],"a":2,"e":"La frase retoma el episodio del tronco y la regla de Marta; la niña ahora se asegura antes de afirmar, lo que muestra aprendizaje. El texto no sugiere que los errores desaparezcan del todo, y la disminución de especies migratorias se menciona a propósito de datos de largo plazo, no de este hallazgo.","t":{"afirm":3,"tipo":"cronica","dif":2},"c":"lc-c13"},{"i":"lc-040","q":"Según el tercer párrafo, el intento de organizar a los cargadores fracasó porque la aplicación","o":["exigía un carné que los cargadores no estaban dispuestos a portar durante la jornada","fue retirada por la fundación después de tres semanas de uso en la plaza","asignaba por cercanía y rompió el orden de turnos que regulaba la convivencia","reducía los ingresos de los cargadores frente al sistema que usaban antes"],"a":2,"e":"El texto explica que la aplicación asignaba por cercanía y no por turno, lo que provocó una pelea y «rompió el código». No se dice que los ingresos bajaran ni que la fundación la retirara: fueron los cargadores quienes volvieron a su sistema.","t":{"afirm":1,"tipo":"cronica","dif":1},"c":"lc-c14"},{"i":"lc-041","q":"El cuarto párrafo comienza con «No es una historia sobre la nostalgia de lo precario». Esa frase tiene como función","o":["aclarar que el relato no defiende la informalidad, pues Yesid aspira a mejores condiciones","contradecir lo dicho por Yesid en el párrafo anterior sobre su código de honor","introducir otra voz que critica con dureza el trabajo de la fundación","concluir que las organizaciones externas no deben ayudar a los cargadores"],"a":0,"e":"La frase precisa cómo debe leerse el relato: a Yesid le importa su código, pero también quiere una pensión y un futuro distinto para su hija. No contradice al protagonista ni condena toda ayuda; critica las soluciones que llegan sin preguntar.","t":{"afirm":2,"tipo":"cronica","dif":2},"c":"lc-c14"},{"i":"lc-042","q":"La frase final («la papa no espera a que los diagnósticos se completen») sugiere que","o":["Yesid considera falsos todos los diagnósticos sobre la plaza y prefiere ignorarlos siempre","los cargadores rechazan toda intervención externa por considerarla dañina para su oficio","la papa es un producto perecedero y por eso la plaza no puede cerrar en ningún momento","el trabajo no se detiene mientras otros estudian el problema, a diferencia de las ayudas externas"],"a":3,"e":"La imagen combina lo literal (hay que descargar) con un sentido figurado: la urgencia de ganarse la vida frente a intervenciones que diagnostican sin la gente. La lectura literal es parcial, y decir que rechazan toda ayuda sobregeneraliza: Yesid sueña con una pensión.","t":{"afirm":3,"tipo":"cronica","dif":3},"c":"lc-c14"},{"i":"lc-043","q":"Según el segundo párrafo, los relojes sin reparar seguían en el taller porque","o":["sus dueños no habían ido a recogerlos, y algunos ya habían muerto","el padre de Camilo se negaba a devolverlos mientras no se pagara la reparación","los relojes carecían de arreglo y el padre no quería reconocerlo","Camilo había pedido que no se entregara ninguno antes de su regreso"],"a":0,"e":"El narrador cuenta que el padre había dejado de cobrar y anotaba «Ya vendrá a recogerlo»; luego aclara que «Algunos clientes habían muerto antes que los relojes». Nada indica que el padre retuviera los relojes por dinero ni que estuvieran sin arreglo posible.","t":{"afirm":1,"tipo":"cuento","dif":1},"c":"lc-c15"},{"i":"lc-044","q":"El hallazgo del tercer párrafo modifica el sentido de lo narrado antes porque muestra que","o":["el padre era negligente con su negocio y descuidaba los relojes de sus clientes","los clientes nunca regresaron por las demoras del padre en las reparaciones","Camilo ya conocía el significado de cada una de las llaves del taller","lo que parecía descuido era un registro deliberado de las partidas del hijo"],"a":3,"e":"La libreta con horas y los relojes detenidos en esas horas revelan que el padre registraba cada despedida de Camilo; así, lo que parecía desorden o abandono resulta una forma de memoria. Las otras opciones mantienen la lectura inicial que el cuento corrige.","t":{"afirm":2,"tipo":"cuento","dif":2},"c":"lc-c15"},{"i":"lc-045","q":"La decisión final de Camilo, tomada después de comprender la libreta, permite interpretar que","o":["se arrepiente de haber estudiado fuera y regresará a vivir a la ciudad de su padre","ya no ve el taller como un bien por vender sino como una muestra de afecto de su padre","piensa reparar los relojes del taller para devolverlos a sus dueños o herederos","decidió conservar el taller porque resulta rentable como negocio familiar"],"a":1,"e":"Camilo cancela la cita con el corredor inmobiliario y deja los relojes tal como estaban: el acto indica que atribuye al lugar un valor afectivo, no solo comercial. La primera opción exagera lo que el texto sugiere, y las otras dos proponen acciones que el final no menciona.","t":{"afirm":3,"tipo":"cuento","dif":3},"c":"lc-c15"},{"i":"lc-046","q":"En el texto, la idea de que la tía era una enamorada trágica es","o":["una convicción de la narradora desde su infancia, confirmada luego al leer las cartas","una conclusión que la propia tía confesó en una de sus cartas a la panadera","una interpretación que el ingeniero de ferrocarriles confirmó años después de la espera","una creencia del pueblo, sostenida por conveniencia por la madre y desmentida por la narradora"],"a":3,"e":"El primer párrafo atribuye la idea al pueblo y a la madre («le convenía»), y el cuarto la niega con «No era una enamorada». La narradora, de niña, «sospechaba lo contrario», así que no la compartía. El ingeniero ni siquiera aparece más allá del rumor.","t":{"afirm":2,"tipo":"novela","dif":2},"c":"lc-c16"},{"i":"lc-047","q":"En el último párrafo, decir que la tía pasó cincuenta años «con cosas importantes en la boca» significa que ella","o":["hablaba demasiado sobre asuntos que no le interesaban a nadie en el pueblo","tenía mucho que decir a otros, pero no encontraba cómo expresarlo","guardaba secretos graves que podían afectar el buen nombre de su familia","se negaba a comer y por eso enfermó gravemente durante años"],"a":1,"e":"La expresión figurada contrasta «la boca» con «la calle»: lo importante estaba dentro y no lograba salir. La carta a la panadera lo ejemplifica: un agradecimiento no dicho «porque no supe cómo empezar».","t":{"afirm":1,"tipo":"novela","dif":1},"c":"lc-c16"},{"i":"lc-048","q":"La última frase del texto («una frase torpe, que es, supongo, lo que ella nunca se permitió») permite interpretar que la narradora","o":["imita a su tía y guarda por escrito lo que no se atreve a decir en voz alta","acepta una gratitud imperfecta, algo que su tía nunca se permitió","se avergüenza de sus propias palabras cuando intenta agradecer a otras personas","considera que las cartas de su tía eran torpes y por eso decidió quemarlas"],"a":1,"e":"La narradora se apresura a dar las gracias aunque le salga algo torpe; en contraste, la tía callaba por no saber empezar. La «frase torpe» es el precio que ella sí se permite pagar. No hay vergüenza ni imitación: ella actúa al revés que su tía.","t":{"afirm":3,"tipo":"novela","dif":3},"c":"lc-c16"},{"i":"lc-049","q":"En el diálogo, la frase del funcionario «Debo atender lo que consta» expresa la postura de quien","o":["da más peso al registro oficial que a la evidencia que tiene ante sus ojos","duda de la identidad de Lucía por su aspecto físico y por su edad","desea ayudarla, pero carece de los formularios que se necesitan","cree que Lucía miente para obtener una pensión que no le corresponde"],"a":0,"e":"«Lo que consta» es lo que figura en el sistema; el funcionario lo antepone a que Lucía esté frente a él. No sospecha de su apariencia ni la acusa de mentir: acepta, de hecho, que ella está hablando con él. El formulario sí existe; lo que falta es quien lo firme.","t":{"afirm":2,"tipo":"dramaturgia","dif":1},"c":"lc-c17"},{"i":"lc-050","q":"Las acotaciones del texto (por ejemplo, «Sonríe, apenado» o «con tranquilidad») cumplen la función de","o":["describir la escenografía necesaria para montar la obra en un teatro pequeño","indicar actitudes que matizan a los personajes: él, algo apenado; ella, serena ante el absurdo","anunciar los cambios de espacio y de tiempo entre una escena y la siguiente del texto","reemplazar con descripciones las partes del diálogo que el autor no quiso escribir"],"a":1,"e":"En dramaturgia, las acotaciones orientan la actuación y el tono. Aquí revelan que el funcionario no es cruel sino rígido, y que Lucía, ante el absurdo, opta por la calma y la ironía. No describen espacios nuevos ni suplen diálogos.","t":{"afirm":2,"tipo":"dramaturgia","dif":2},"c":"lc-c17"},{"i":"lc-051","q":"La escena ilustra, con humor, principalmente","o":["la corrupción de los funcionarios que cobran dinero por agilizar los trámites","el absurdo de exigir que se pruebe lo evidente a quien solo atiende lo registrado","la dificultad de las personas mayores para comprender los trámites actuales","la ausencia de tecnología en las oficinas públicas del país"],"a":1,"e":"El conflicto surge de que un registro erróneo pesa más que la persona viva: Lucía debe probar que existe. El funcionario no pide dinero ni se queja de que ella no entienda, y de hecho usa un sistema electrónico; el problema es la rigidez del procedimiento.","t":{"afirm":3,"tipo":"dramaturgia","dif":2},"c":"lc-c17"},{"i":"lc-052","q":"Los versos «Anoto lo que se va en la caja» y «Anoto lo que se queda» organizan el poema en dos movimientos. Estos son","o":["el de lo que el hablante lleva consigo y el de las huellas que quedan en la casa","el de los recuerdos felices de la casa y el de sus recuerdos más dolorosos","el de los objetos valiosos del hablante y el de los objetos que carecen de valor","el de lo que el hablante deja a otras personas y el de lo que ellas le dejan"],"a":0,"e":"La caja contiene objetos (tazas, mapa, abrigo); lo que se queda son marcas y vacíos (mancha, huella del cuadro, clavo). La oposición no es entre recuerdos felices y dolorosos, ni se plantea una escala de valor material.","t":{"afirm":2,"tipo":"poema","dif":1},"c":"lc-c18"},{"i":"lc-053","q":"El último verso («se me olvida cuál de los dos se va») sugiere que","o":["hablante y casa quedaron tan unidos que la despedida parece una separación mutua","el hablante olvida cerrar bien la puerta antes de dejar la casa para siempre","la casa decide marcharse antes de que el hablante termine de empacar sus cosas","el hablante duda de si realmente le conviene mudarse a otro lugar"],"a":0,"e":"Los «dos» son el hablante y la casa, y el olvido de quién se va expresa una identificación entre ambos, preparada por la personificación de la tercera estrofa. La duda no es práctica (cerrar la puerta) ni sobre la conveniencia de la mudanza.","t":{"afirm":3,"tipo":"poema","dif":3},"c":"lc-c18"},{"i":"lc-054","q":"Los versos «Nadie dice que las casas escuchan. / Esta, sin embargo, guardó mis pasos...» cumplen la función de","o":["demostrar con argumentos lógicos que las casas son capaces de escuchar a quienes las habitan","mostrar que la casa conserva y devuelve la vida del hablante, lo que carga de emoción la despedida","describir los ruidos concretos que el hablante escuchaba mientras vivió en la casa","reprochar a la casa por no haber protegido a quien la habitó durante tanto tiempo"],"a":1,"e":"Se trata de una personificación: la casa, con «paciencia de piedra», devuelve los pasos «sin reproche». El poema no argumenta de manera lógica ni describe ruidos reales; además, el reproche aparece negado («sin reproche»).","t":{"afirm":2,"tipo":"poema","dif":2},"c":"lc-c18"},{"i":"lc-055","q":"En la viñeta 3, el globo de pensamiento con puntos suspensivos indica que el niño","o":["no logra descifrar la letra de la nota manuscrita","reprocha a su abuela por la respuesta que le dio","intenta encontrar la nota en su celular","queda sin palabras, sorprendido por lo que lee"],"a":3,"e":"Los puntos suspensivos en un pensamiento representan silencio ante algo que conmueve o sorprende, y la imagen del celular «olvidado» refuerza que la atención del niño está en la nota. No hay indicio de dificultad para leer ni de reproche.","t":{"afirm":1,"tipo":"historieta","dif":1},"c":"lc-c19"},{"i":"lc-056","q":"La viñeta 4 se relaciona con la viñeta 1 porque","o":["repite la pregunta inicial del niño con un tono más cordial y menos desafiante","demuestra que el niño ya conocía la historia de sus abuelos antes de abrir el libro","invierte la actitud del niño, que pasa de dudar del valor de los libros a pedir uno","confirma que la abuela considera inútil buscar cualquier información en internet"],"a":2,"e":"En la viñeta 1 el niño duda del valor de los libros; en la 4 pide prestado uno. Ese cambio es el giro de la historieta. Nada sugiere que conociera la historia de antemano, y la abuela no descalifica internet: lo que hace es proponer una búsqueda que no puede resolverse allí.","t":{"afirm":2,"tipo":"historieta","dif":2},"c":"lc-c19"},{"i":"lc-057","q":"¿Qué idea transmite la historieta de manera implícita?","o":["Internet carece de información útil y confiable para los niños de hoy","Un libro puede guardar un valor afectivo que ninguna búsqueda en internet ofrece","Los niños deberían leer más libros y usar menos el celular durante el día","Los libros antiguos son más veraces que los contenidos que circulan en internet"],"a":1,"e":"El reto de la abuela («Búscame en internet lo que tu abuelo escribió aquí») muestra que la dedicatoria manuscrita es algo que solo existe en ese libro. La historieta no condena a internet ni da un mandato a los niños, y la veracidad de las fuentes no se discute.","t":{"afirm":3,"tipo":"historieta","dif":2},"c":"lc-c19"},{"i":"lc-058","q":"Un grupo reservó el turno del viernes de 6:00 a 8:00 p. m. y cancela la reserva el viernes a las 3:00 p. m. Según el reglamento,","o":["la sala queda libre para otros grupos y la reserva no se cuenta como usada","el grupo queda suspendido por 30 días por incumplir la norma de cancelaciones","la reserva se pierde, pero el grupo puede hacer otra nueva sin ninguna restricción","se contará como utilizada, pues la cancelación tuvo menos de 24 horas de anticipación"],"a":3,"e":"La norma 2 establece que cancelar con menos de 24 horas implica que la reserva «se contará como utilizada»; aquí faltan solo tres horas. La suspensión exige dos incumplimientos en un trimestre (norma 6), y nada habla de reservas nuevas sin restricción: la norma 1 limita a dos las reservas activas.","t":{"afirm":2,"tipo":"reglamento","dif":2},"c":"lc-c20"},{"i":"lc-059","q":"Un grupo con batería acústica quiere reservar con suficiente anticipación el turno de 9:00 a 11:00 p. m. Según el reglamento,","o":["podría hacerlo si usa amplificación para compensar el volumen y no molestar a los vecinos","no podría hacerlo, pues entre las 8:00 y las 10:00 p. m. el reglamento prohíbe todo ensayo","no podría usar la batería acústica toda la sesión, porque desde las 10:00 p. m. está prohibida","podría hacerlo, pues el turno de dos horas debe respetarse completo sin excepciones horarias"],"a":2,"e":"La norma 4 prohíbe la batería acústica a partir de las 10:00 p. m., de modo que la segunda mitad del turno no es posible con ese instrumento. La amplificación también está prohibida desde esa hora. Entre las 8:00 y las 10:00 p. m. el ensayo sí se permite, sujeto a un límite de volumen.","t":{"afirm":2,"tipo":"reglamento","dif":3},"c":"lc-c20"},{"i":"lc-060","q":"La norma según la cual una reserva cancelada con poca anticipación «se contará como utilizada» busca principalmente","o":["desincentivar reservas que no se usan y que dejan a otros grupos sin turno","aumentar los ingresos que el centro recibe de los grupos residentes en el barrio","evitar conflictos con los vecinos por el volumen de los ensayos en la noche","garantizar que los menores de edad puedan ensayar gratis los sábados en la mañana"],"a":0,"e":"Si cancelar tarde no tiene consecuencias, los grupos podrían ocupar turnos sin usarlos y bloquear a otros; por eso la reserva tardía se cuenta como usada. Las otras opciones corresponden a normas distintas (volumen, tarifas) y no a la de cancelaciones.","t":{"afirm":3,"tipo":"reglamento","dif":1},"c":"lc-c20"}]},{"id":"cuanti","name":"Razonamiento cuantitativo","desc":"Tablas, gráficas, geometría, álgebra, estadística y cálculo básico","ctx":{"cu-c01":{"kind":"tabla","title":"Planes de datos móviles","text":"Una operadora ofrece dos planes de datos para celular. El cargo fijo se paga siempre; si el consumo supera los GB incluidos, cada GB adicional se cobra al valor indicado. Los consumos se miden en GB enteros.","fig":{"type":"table","title":"Tarifas mensuales","head":["Característica","Plan A","Plan B"],"rows":[["Cargo fijo mensual","$30.000","$45.000"],["GB incluidos","5","12"],["Valor de cada GB adicional","$4.000","$3.000"]]}},"cu-c02":{"kind":"grafico","title":"Reproducciones de un sencillo","text":"Un productor registra las reproducciones (en miles) de un sencillo durante sus primeros cuatro meses en dos plataformas de streaming.","fig":{"type":"bar","title":"Reproducciones mensuales (miles)","x":["Enero","Febrero","Marzo","Abril"],"series":[{"name":"Plataforma X","y":[100,150,200,250]},{"name":"Plataforma Y","y":[60,80,70,90]}],"xlabel":"Mes","ylabel":"Reproducciones (miles)"}},"cu-c03":{"kind":"grafico","title":"Dos tanques de agua","text":"Dos tanques se llenan o se vacían con caudal constante a partir del mismo instante (t = 0). El tanque A se está llenando y el tanque B se está vaciando.","fig":{"type":"line","title":"Volumen de agua en cada tanque","x":["0","2","4","6","8","10"],"series":[{"name":"Tanque A","y":[100,160,220,280,340,400]},{"name":"Tanque B","y":[500,460,420,380,340,300]}],"xlabel":"Tiempo (min)","ylabel":"Volumen (L)"}},"cu-c04":{"kind":"grafico","title":"Presupuesto familiar","text":"La familia Ortega recibió ingresos mensuales por $3.600.000. El gráfico muestra cómo distribuyó ese dinero el mes pasado.","fig":{"type":"pie","title":"Distribución del ingreso mensual (%)","slices":[{"label":"Vivienda","v":35},{"label":"Alimentación","v":25},{"label":"Transporte","v":15},{"label":"Educación","v":10},{"label":"Ahorro","v":5},{"label":"Otros","v":10}]}},"cu-c05":{"kind":"otro","title":"Escalera de bomberos","text":"Un camión de bomberos tiene una escalera extensible que, completamente extendida, mide 25 m. Se apoya en una pared vertical c
