const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryCode(code){
  const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(code.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  for(const k of P.keys){
    try{
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(k.s),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const master=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(k.i)},key,b64(k.w));
      const mk=await crypto.subtle.importKey('raw',master,'AES-GCM',false,['decrypt']);
      const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},mk,b64(P.ct));
      return new TextDecoder().decode(html);
    }catch(e){}
  }
  return null;
}
function open_(h){document.open();document.write(h);document.close()}
const f=document.getElementById('f'),e=document.getElementById('e'),btn=document.getElementById('b');
f.addEventListener('submit',async ev=>{
  ev.preventDefault();const v=document.getElementById('k').value;if(!v.trim())return;
  if(!window.crypto||!crypto.subtle){e.textContent='Tu navegador no permite abrir esto aquí. Usa Chrome, Safari o Edge actualizados.';return}
  btn.disabled=true;btn.textContent='Verificando…';e.textContent='';
  const h=await tryCode(v);
  if(h){try{localStorage.setItem('spi.code',v.trim().toLowerCase())}catch(x){}open_(h)}
  else{btn.disabled=false;btn.textContent='Entrar';e.textContent='Código incorrecto. Revisa que esté bien escrito.'}
});
(async()=>{try{const s=localStorage.getItem('spi.code');if(s&&window.crypto&&crypto.subtle){const h=await tryCode(s);if(h)open_(h);else localStorage.removeItem('spi.code')}}catch(x){}})();
