on su base en el piso a 7 m de la pared, como muestra la figura.","fig":{"type":"svg","title":"Esquema (sin escala exacta)","svg":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"3\"/><line x1=\"30\" y1=\"220\" x2=\"380\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"3\"/><line x1=\"60\" y1=\"40\" x2=\"112\" y2=\"220\" stroke=\"var(--c1)\" stroke-width=\"4\"/><polyline points=\"60,205 75,205 75,220\" fill=\"none\" stroke=\"var(--mut)\" stroke-width=\"1.5\"/><text x=\"104\" y=\"115\" font-size=\"14\" fill=\"var(--ink)\">25 m<\/text><line x1=\"60\" y1=\"238\" x2=\"112\" y2=\"238\" stroke=\"var(--c2)\" stroke-width=\"2\"/><text x=\"76\" y=\"254\" font-size=\"14\" fill=\"var(--ink)\">7 m<\/text><text x=\"22\" y=\"135\" font-size=\"14\" fill=\"var(--ink)\">h<\/text><text x=\"200\" y=\"120\" font-size=\"13\" fill=\"var(--mut)\">Pared vertical y piso horizontal<\/text><\/svg>"}},"cu-c06":{"kind":"tabla","title":"Salarios en una empresa","text":"Los salarios mensuales de los siete empleados de una pequeña empresa de mantenimiento aparecen en la tabla.","fig":{"type":"table","title":"Salario mensual por empleado","head":["Empleado","Salario (millones de $)"],"rows":[["E1","1,4"],["E2","1,4"],["E3","1,5"],["E4","1,6"],["E5","1,8"],["E6","2,0"],["E7 (gerente)","11,3"]]}},"cu-c07":{"kind":"tabla","title":"Encuesta sobre podcasts","text":"En una ciudad se encuestó a 200 personas sobre si escuchan podcasts con regularidad. Los resultados se muestran en la tabla.","fig":{"type":"table","title":"Personas según edad y hábito de escucha","head":["Grupo de edad","Sí escucha","No escucha","Total"],"rows":[["Menores de 30 años","70","30","100"],["30 años o más","40","60","100"],["Total","110","90","200"]]}},"cu-c08":{"kind":"grafico","title":"Dos ciclistas","text":"Dos ciclistas recorren la misma ruta recta, partiendo del mismo punto y a la misma hora. La gráfica muestra la distancia recorrida por cada uno desde la salida.","fig":{"type":"line","title":"Distancia recorrida","x":["0","1","2","3","4"],"series":[{"name":"Ciclista A","y":[0,12,24,36,48]},{"name":"Ciclista B","y":[0,18,30,38,42]}],"xlabel":"Tiempo (h)","ylabel":"Distancia (km)"}},"cu-c09":{"kind":"tabla","title":"Producción en una imprenta","text":"En una imprenta todas las máquinas son idénticas y trabajan a un mismo ritmo constante. La tabla muestra la producción de afiches en dos turnos.","fig":{"type":"table","title":"Producción por turno","head":["Turno","Máquinas","Horas","Afiches impresos"],"rows":[["Mañana","3","5","4.500"],["Tarde","5","6","por calcular"]]}},"cu-c10":{"kind":"grafico","title":"Satisfacción en clínicas","text":"Una cadena de clínicas mide cada año el porcentaje de usuarios satisfechos en tres de sus sedes.","fig":{"type":"bar","title":"Usuarios satisfechos (%)","x":["Norte","Centro","Sur"],"series":[{"name":"2024","y":[60,40,20]},{"name":"2025","y":[66,50,28]}],"xlabel":"Sede","ylabel":"Usuarios satisfechos (%)"}},"cu-c11":{"kind":"otro","title":"Tanque cilíndrico","text":"Un tanque de agua tiene forma de cilindro recto con las medidas de la figura. Use π ≈ 3,14 y recuerde que 1 m³ equivale a 1.000 litros.","fig":{"type":"svg","title":"Tanque (sin escala exacta)","svg":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"150\" cy=\"60\" rx=\"60\" ry=\"18\" fill=\"var(--acc-soft)\" stroke=\"var(--ink)\" stroke-width=\"2\"/><line x1=\"90\" y1=\"60\" x2=\"90\" y2=\"200\" stroke=\"var(--ink)\" stroke-width=\"2\"/><line x1=\"210\" y1=\"60\" x2=\"210\" y2=\"200\" stroke=\"var(--ink)\" stroke-width=\"2\"/><path d=\"M90 200 A60 18 0 0 0 210 200\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/><line x1=\"90\" y1=\"60\" x2=\"210\" y2=\"60\" stroke=\"var(--c1)\" stroke-width=\"2\"/><text x=\"120\" y=\"52\" font-size=\"13\" fill=\"var(--ink)\">d = 2 m<\/text><line x1=\"250\" y1=\"60\" x2=\"250\" y2=\"200\" stroke=\"var(--c2)\" stroke-width=\"2\"/><text x=\"262\" y=\"135\" font-size=\"13\" fill=\"var(--ink)\">h = 3 m<\/text><\/svg>"}},"cu-c12":{"kind":"tabla","title":"Notas ponderadas","text":"En un curso universitario la nota final es el promedio ponderado de cuatro componentes. La tabla muestra el peso de cada una y las notas de Ana (escala de 0,0 a 5,0).","fig":{"type":"table","title":"Notas de Ana","head":["Componente","Peso","Nota"],"rows":[["Parcial 1","20 %","3,0"],["Parcial 2","20 %","4,0"],["Proyecto","40 %","4,5"],["Quiz","20 %","3,5"]]}},"cu-c13":{"kind":"grafico","title":"Precio de la boleta y utilidad","text":"Los organizadores de un concierto estudiaron cómo cambia la utilidad según el precio de la boleta. Con los datos de pruebas anteriores observaron que la utilidad sigue un comportamiento cuadrático (parábola) en función del precio.","fig":{"type":"line","title":"Utilidad del concierto","x":["10","20","30","40","50","60"],"series":[{"name":"Utilidad (millones de $)","y":[20,100,140,140,100,20]}],"xlabel":"Precio de la boleta (miles de $)","ylabel":"Utilidad (millones de $)"}},"cu-c14":{"kind":"tabla","title":"Accidentes de tránsito","text":"Una secretaría de movilidad reunió los datos de accidentes de tránsito registrados durante un año en tres ciudades.","fig":{"type":"table","title":"Accidentes y población","head":["Ciudad","Población","Accidentes en el año"],"rows":[["A","800.000","1.200"],["B","250.000","450"],["C","1.500.000","2.100"]]}},"cu-c15":{"kind":"grafico","title":"Edades en un taller","text":"Una universidad registró la edad de las 70 personas que asistieron a un taller abierto de producción de contenidos.","fig":{"type":"bar","title":"Asistentes según rango de edad","x":["18–24","25–34","35–44","45–54","55 o más"],"series":[{"name":"Asistentes","y":[12,30,18,8,2]}],"xlabel":"Edad (años)","ylabel":"Número de asistentes"}},"cu-c16":{"kind":"otro","title":"Piso de un salón de ensayo","text":"El piso de un salón de ensayo tiene la forma de la figura: un rectángulo de 10 m × 6 m al que se le añadió un semicírculo cuyo diámetro es uno de los lados de 6 m. Use π ≈ 3,14.","fig":{"type":"svg","title":"Forma del piso (sin escala exacta)","svg":"<svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M60 50 L260 50 A60 60 0 0 1 260 170 L60 170 Z\" fill=\"var(--acc-soft)\" stroke=\"var(--ink)\" stroke-width=\"2\"/><line x1=\"260\" y1=\"50\" x2=\"260\" y2=\"170\" stroke=\"var(--mut)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"60\" y1=\"190\" x2=\"260\" y2=\"190\" stroke=\"var(--c1)\" stroke-width=\"2\"/><text x=\"140\" y=\"210\" font-size=\"13\" fill=\"var(--ink)\">10 m<\/text><line x1=\"40\" y1=\"50\" x2=\"40\" y2=\"170\" stroke=\"var(--c2)\" stroke-width=\"2\"/><text x=\"8\" y=\"115\" font-size=\"13\" fill=\"var(--ink)\">6 m<\/text><\/svg>"}},"cu-c17":{"kind":"tabla","title":"Control de calidad","text":"Una fábrica de carcasas plásticas produce con tres máquinas. La tabla muestra la producción diaria de cada una y el porcentaje de piezas defectuosas. Al final del día todas las piezas se mezclan en un solo lote.","fig":{"type":"table","title":"Producción diaria por máquina","head":["Máquina","Piezas producidas por día","Piezas defectuosas"],"rows":[["M1","500","2 %"],["M2","300","4 %"],["M3","200","5 %"]]}},"cu-c18":{"kind":"grafico","title":"Población de dos municipios","text":"Dos municipios, X y Y, registraron su población (en miles de habitantes) durante cinco años consecutivos.","fig":{"type":"line","title":"Población (miles de habitantes)","x":["2020","2021","2022","2023","2024"],"series":[{"name":"Municipio X","y":[100,110,120,130,140]},{"name":"Municipio Y","y":[100,110,121,133,146]}],"xlabel":"Año","ylabel":"Población (miles)"}},"cu-c19":{"kind":"grafico","title":"Género musical favorito","text":"En una encuesta a 400 jóvenes se preguntó por su género musical favorito (una sola respuesta por persona).","fig":{"type":"pie","title":"Género favorito (%)","slices":[{"label":"Reggaetón","v":30},{"label":"Pop","v":20},{"label":"Rock","v":15},{"label":"Salsa","v":15},{"label":"Electrónica","v":10},{"label":"Otros","v":10}]}},"cu-c20":{"kind":"tabla","title":"Tarifa de taxi","text":"Una empresa de taxis cobra un valor fijo por abordar el vehículo más un valor constante por cada kilómetro recorrido. La tabla muestra tres servicios de ejemplo.","fig":{"type":"table","title":"Valor de los servicios","head":["Distancia recorrida (km)","Valor del servicio"],"rows":[["2","$9.000"],["6","$15.000"],["10","$21.000"]]}},"cu-c21":{"kind":"otro","title":"Lote triangular","text":"Un lote triangular ABC se divide con una cerca DE paralela al lado BC, como muestra la figura (D está sobre AB y E sobre AC).","fig":{"type":"svg","title":"Lote ABC (sin escala exacta)","svg":"<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"200,30 60,220 340,220\" fill=\"var(--acc-soft)\" stroke=\"var(--ink)\" stroke-width=\"2\"/><line x1=\"116\" y1=\"144\" x2=\"284\" y2=\"144\" stroke=\"var(--c1)\" stroke-width=\"3\"/><text x=\"194\" y=\"20\" font-size=\"14\" fill=\"var(--ink)\">A<\/text><text x=\"40\" y=\"238\" font-size=\"14\" fill=\"var(--ink)\">B<\/text><text x=\"346\" y=\"238\" font-size=\"14\" fill=\"var(--ink)\">C<\/text><text x=\"92\" y=\"146\" font-size=\"14\" fill=\"var(--ink)\">D<\/text><text x=\"290\" y=\"146\" font-size=\"14\" fill=\"var(--ink)\">E<\/text><text x=\"100\" y=\"86\" font-size=\"13\" fill=\"var(--ink)\">6 m<\/text><text x=\"52\" y=\"188\" font-size=\"13\" fill=\"var(--ink)\">4 m<\/text><text x=\"168\" y=\"168\" font-size=\"13\" fill=\"var(--ink)\">DE = 9 m<\/text><\/svg>"}}},"qs":[{"i":"cu-001","q":"Una persona consume cada mes una cantidad entera de GB (entre 5 y 12). ¿A partir de cuántos GB consumidos el plan B resulta más económico que el plan A?","o":["7 GB","8 GB","9 GB","10 GB"],"a":2,"e":"El costo del plan A con g GB (g ≥ 5) es 30.000 + 4.000(g − 5). Con 8 GB paga $42.000, menos que los $45.000 del plan B; con 9 GB paga $46.000, ya más que el plan B. Por eso el plan B es más barato desde 9 GB.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c01"},{"i":"cu-002","q":"Camila afirma: «El plan B siempre es más barato, porque incluye más GB». Su afirmación es","o":["correcta, porque el plan B cobra menos por cada GB adicional ($3.000 frente a $4.000) y eso lo hace más barato en cualquier consumo.","correcta, porque 12 GB incluidos son más que 5 GB incluidos y, por tanto, cada GB cuesta menos en el plan B.","incorrecta, porque el plan B cuesta más que el plan A para cualquier consumo superior a 12 GB.","incorrecta, porque con un consumo de 6 GB el plan A cuesta $34.000 y el plan B $45.000."],"a":3,"e":"Para consumos bajos el cargo fijo del plan B pesa más: con 6 GB el plan A cuesta 30.000 + 4.000 = $34.000, menos que los $45.000 del plan B. Por eso «siempre» es falso. El primer distractor ignora el cargo fijo y el tercero invierte la situación, pues para consumos altos el plan B sí es más barato.","t":{"comp":"argumentacion","cont":"algebra","dif":2},"c":"cu-c01"},{"i":"cu-003","q":"¿Qué porcentaje del total de reproducciones de los cuatro meses corresponde a la plataforma X?","o":["30 %","40 %","70 %","233 %"],"a":2,"e":"X suma 100 + 150 + 200 + 250 = 700 mil y Y suma 300 mil, para un total de 1.000 mil; 700/1.000 = 70 %. El 30 % es la parte de Y y el 233 % es la razón X/Y, no la participación en el total.","t":{"comp":"interpretacion","cont":"estadistica","dif":1},"c":"cu-c02"},{"i":"cu-004","q":"El productor afirma: «En mayo la plataforma X tendrá exactamente 300 mil reproducciones, porque ha crecido 50 mil cada mes». Esta afirmación es","o":["correcta, porque el crecimiento observado es constante y, por tanto, el valor de mayo queda determinado.","una estimación razonable si el patrón continúa, pero no es segura, pues el comportamiento futuro puede cambiar.","incorrecta, porque con solo cuatro datos no es posible hacer ninguna estimación de meses posteriores.","incorrecta, porque la plataforma Y no creció de forma constante y eso impide que X lo haga."],"a":1,"e":"Extrapolar el aumento de 50 mil mensuales da 300 mil en mayo, pero es una proyección apoyada en una tendencia pasada, no una certeza. Afirmar «exactamente» desconoce la incertidumbre; negar toda estimación o ligar X con el comportamiento de Y no tiene sustento en los datos.","t":{"comp":"argumentacion","cont":"estadistica","dif":2},"c":"cu-c02"},{"i":"cu-005","q":"¿Cuál es la razón de cambio del volumen del tanque A?","o":["20 L/min","30 L/min","60 L/min","340 L/min"],"a":1,"e":"El volumen pasa de 100 L a 400 L en 10 min: (400 − 100)/10 = 30 L/min. El 20 L/min corresponde a la rapidez con que se vacía el tanque B y el 60 resulta de leer el aumento en un intervalo de 2 min sin dividir.","t":{"comp":"interpretacion","cont":"calculo","dif":1},"c":"cu-c03"},{"i":"cu-006","q":"¿Cuál ecuación permite hallar el instante t, en minutos, en que ambos tanques tienen el mismo volumen?","o":["100 + 30t = 500 − 20t","100 + 30t = 500 + 20t","30t = 20t","100t + 30 = 500t − 20"],"a":0,"e":"El volumen de A es 100 + 30t (parte de 100 L y gana 30 L/min) y el de B es 500 − 20t (parte de 500 L y pierde 20 L/min); la igualdad de volúmenes es la primera ecuación. Las demás cambian el signo de la pérdida de B o intercambian condición inicial y razón de cambio.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c03"},{"i":"cu-007","q":"Si el tanque B continúa vaciándose al mismo ritmo, ¿en cuántos minutos, contados desde t = 0, quedará vacío?","o":["10 min","15 min","20 min","25 min"],"a":3,"e":"El tanque B parte de 500 L y pierde 20 L cada minuto: 500/20 = 25 min. Los otros valores salen de dividir volúmenes leídos en puntos intermedios de la gráfica por el ritmo de vaciado.","t":{"comp":"formulacion","cont":"calculo","dif":1},"c":"cu-c03"},{"i":"cu-008","q":"¿Cuánto dinero destinó la familia, en total, a alimentación y transporte?","o":["$540.000","$900.000","$1.080.000","$1.440.000"],"a":3,"e":"Alimentación y transporte suman 25 % + 15 % = 40 % y el 40 % de $3.600.000 es $1.440.000. El valor $900.000 corresponde solo a alimentación y $540.000 solo a transporte.","t":{"comp":"interpretacion","cont":"estadistica","dif":1},"c":"cu-c04"},{"i":"cu-009","q":"La familia quiere duplicar su ahorro sin reducir vivienda ni alimentación y propone lograrlo reduciendo a la mitad el rubro «Otros». Esta propuesta es","o":["insuficiente, porque reducir «Otros» a la mitad libera solo 2,5 % del ingreso, que no alcanza para duplicar el ahorro.","inviable, porque el ahorro actual es 5 % y «Otros» es 10 %, y son rubros distintos que no se pueden combinar entre sí.","suficiente, porque reducir «Otros» a la mitad libera 5 puntos del ingreso, justo lo que falta para duplicar el ahorro.","excesiva, porque reducir «Otros» a la mitad libera 10 % del ingreso y el ahorro quedaría entonces en 15 %."],"a":2,"e":"Duplicar el ahorro exige pasar de 5 % a 10 %, o sea 5 puntos más. La mitad de 10 % es 5 %, así que se liberan exactamente esos 5 puntos. Quien calcula 2,5 % divide dos veces entre 2, y quien dice 10 % confunde la mitad con el total del rubro.","t":{"comp":"argumentacion","cont":"algebra","dif":2},"c":"cu-c04"},{"i":"cu-010","q":"¿A qué altura de la pared llega el extremo superior de la escalera?","o":["18 m","24 m","26 m","32 m"],"a":1,"e":"La escalera, la pared y el piso forman un triángulo rectángulo con hipotenusa 25 m y un cateto de 7 m: h = √(25² − 7²) = √576 = 24 m. Restar (25 − 7 = 18) o sumar (25 + 7 = 32) no respeta el teorema de Pitágoras.","t":{"comp":"formulacion","cont":"geometria","dif":1},"c":"cu-c05"},{"i":"cu-011","q":"La base de la escalera se desplaza hasta quedar a 15 m de la pared, con la escalera completamente extendida. ¿Cuántos metros desciende el extremo superior?","o":["4 m","8 m","20 m","24 m"],"a":0,"e":"A 15 m de la pared la altura es √(25² − 15²) = √400 = 20 m. Como antes era 24 m, el extremo desciende 4 m. El valor 8 m es lo que se desplaza la base, no el descenso del extremo.","t":{"comp":"formulacion","cont":"geometria","dif":2},"c":"cu-c05"},{"i":"cu-012","q":"En una reunión, el gerente dice: «El salario promedio de la empresa es de $3 millones». Un empleado responde: «Ese promedio no representa lo que gana la mayoría». La respuesta del empleado es","o":["correcta, porque seis de los siete ganan menos que el promedio, elevado por un salario muy alto.","incorrecta, porque el promedio siempre es la mejor medida para representar a la mayoría de los datos de un conjunto.","correcta, porque el promedio debería ser $1,6 millones, que es el valor que más se repite en la tabla.","incorrecta, porque la mitad de los empleados gana más que el promedio de la empresa."],"a":0,"e":"La media es (1,4 + 1,4 + 1,5 + 1,6 + 1,8 + 2,0 + 11,3)/7 = 3,0 millones, pero seis salarios están por debajo de ese valor; el dato atípico de 11,3 la arrastra hacia arriba. Además, $1,6 millones es la mediana, no la moda (que es 1,4).","t":{"comp":"argumentacion","cont":"estadistica","dif":2},"c":"cu-c06"},{"i":"cu-013","q":"Si el salario del gerente aumenta de $11,3 a $15,3 millones y los demás no cambian, ¿qué sucede con la media y con la mediana de los salarios?","o":["La media aumenta $4 millones y la mediana no cambia.","La media aumenta aproximadamente $0,57 millones y la mediana no cambia.","La media y la mediana aumentan aproximadamente $0,57 millones.","La media no cambia y la mediana aumenta $4 millones."],"a":1,"e":"El total de salarios sube $4 millones y se reparte entre 7 empleados: la media aumenta 4/7 ≈ 0,57 millones. La mediana es el valor central (1,6) y no depende de qué tan grande sea el mayor salario, así que no cambia.","t":{"comp":"formulacion","cont":"estadistica","dif":2},"c":"cu-c06"},{"i":"cu-014","q":"Se elige al azar una persona del grupo de 30 años o más. ¿Cuál es la probabilidad de que escuche podcasts?","o":["0,20","0,40","0,55","0,70"],"a":1,"e":"En ese grupo hay 100 personas y 40 escuchan podcasts: 40/100 = 0,40. El 0,20 resulta de dividir entre las 200 personas del total y el 0,70 corresponde al otro grupo de edad.","t":{"comp":"interpretacion","cont":"estadistica","dif":1},"c":"cu-c07"},{"i":"cu-015","q":"Se elige al azar una persona que sí escucha podcasts. ¿Cuál es la probabilidad de que tenga menos de 30 años?","o":["7/20","11/20","7/11","7/10"],"a":2,"e":"Se restringe el espacio a las 110 personas que sí escuchan; de ellas 70 son menores de 30, así que la probabilidad es 70/110 = 7/11. El valor 7/10 es la probabilidad inversa (escuchar, dado que es menor de 30).","t":{"comp":"formulacion","cont":"estadistica","dif":2},"c":"cu-c07"},{"i":"cu-016","q":"Lucas afirma: «Entre los encuestados, escuchar podcasts es más frecuente en los menores de 30 años que en quienes tienen 30 años o más». Su afirmación es","o":["correcta, porque en total 110 personas escuchan podcasts y solo 90 personas no lo hacen.","incorrecta, porque ambos grupos tienen 100 personas y, por eso, la frecuencia de oyentes es igual.","incorrecta, porque la mayoría de quienes no escuchan podcasts tiene 30 años o más y eso desmiente la afirmación.","correcta, porque escucha el 70 % de los menores de 30 años y el 40 % de los de 30 o más."],"a":3,"e":"Lo que se compara es la proporción de oyentes dentro de cada grupo: 70/100 frente a 40/100. Los totales generales (110 contra 90) no comparan grupos, y que ambos grupos tengan 100 personas permite comparar conteos, pero no implica que la frecuencia sea igual.","t":{"comp":"argumentacion","cont":"estadistica","dif":2},"c":"cu-c07"},{"i":"cu-017","q":"Un amplificador cuesta $800.000. La tienda aplica un descuento de 20 % y, sobre el precio ya rebajado, otro descuento de 10 %. ¿Cuál es el precio final?","o":["$560.000","$576.000","$600.000","$640.000"],"a":1,"e":"Tras el primer descuento el precio es 800.000 × 0,8 = 640.000; con el segundo, 640.000 × 0,9 = $576.000. Sumar los descuentos (30 %) daría $560.000, pero el segundo se aplica sobre un precio menor.","t":{"comp":"formulacion","cont":"algebra","dif":1}},{"i":"cu-018","q":"Dos ciudades distan 150 km en línea recta. En un mapa a escala 1:2.500.000, ¿a qué distancia aparecen?","o":["6 cm","60 cm","375 cm","600 cm"],"a":0,"e":"150 km = 15.000.000 cm y 15.000.000/2.500.000 = 6 cm. Los demás valores salen de errores al convertir kilómetros a centímetros o de multiplicar 150 por 2,5.","t":{"comp":"interpretacion","cont":"geometria","dif":1}},{"i":"cu-019","q":"Una colonia de bacterias duplica su población cada 3 horas, es decir, N(t) = N₀ · 2^(t/3), con t en horas. ¿Cuál de las siguientes afirmaciones es incorrecta?","o":["En 6 horas la población se cuadruplica.","En 9 horas la población es 8 veces la inicial.","Entre las 3 y las 6 horas la población aumenta lo mismo que entre las 0 y las 3 horas.","Cada 3 horas la población aumenta 100 % respecto a su valor al inicio de ese intervalo."],"a":2,"e":"En el crecimiento exponencial el aumento absoluto crece con la población: entre 0 y 3 h aumenta N₀, pero entre 3 y 6 h aumenta 2N₀. Las demás afirmaciones son ciertas: 2² = 4, 2³ = 8 y duplicar equivale a un aumento de 100 %.","t":{"comp":"argumentacion","cont":"algebra","dif":2}},{"i":"cu-020","q":"Dos técnicos de sonido miden cinco veces el nivel de un parlante (en dB). Técnico 1: 78, 80, 80, 80, 82. Técnico 2: 70, 75, 80, 85, 90. Ambos obtienen media 80 dB. ¿Cuál afirmación es correcta?","o":["Las mediciones del técnico 1 están más dispersas, porque el valor 80 se repite varias veces.","Las dos series tienen igual desviación estándar, porque tienen igual media.","El técnico 2 tiene menor desviación estándar, porque sus datos abarcan un rango mucho mayor.","Las mediciones del técnico 2 están más dispersas y su desviación estándar es mayor."],"a":3,"e":"La desviación estándar mide cuánto se alejan los datos de la media. Los del técnico 1 se alejan a lo sumo 2 dB y los del técnico 2 hasta 10 dB, de modo que su desviación (≈ 7,1 dB frente a ≈ 1,3 dB) es mayor. Tener la misma media no implica la misma dispersión.","t":{"comp":"interpretacion","cont":"estadistica","dif":2}},{"i":"cu-021","q":"¿Cuál fue la velocidad promedio del ciclista B durante las dos primeras horas?","o":["12 km/h","15 km/h","18 km/h","30 km/h"],"a":1,"e":"En 2 horas B recorrió 30 km, así que su velocidad promedio fue 30/2 = 15 km/h. El valor 18 km/h es solo su velocidad en la primera hora y 30 km/h es la distancia, no la velocidad.","t":{"comp":"interpretacion","cont":"calculo","dif":1},"c":"cu-c08"},{"i":"cu-022","q":"¿Cuál de las siguientes afirmaciones se puede sustentar con la información de la gráfica?","o":["El ciclista B siempre fue más rápido que A, porque estuvo adelante durante las primeras tres horas de recorrido.","La velocidad de B se mantuvo constante, porque su distancia aumentó en cada hora.","Al terminar la cuarta hora los dos ciclistas habían recorrido la misma distancia.","A alcanzó a B entre la hora 3 y la 4: en ese tramo A avanza a 12 km/h y B a 4 km/h."],"a":3,"e":"Entre las horas 3 y 4, A pasa de 36 a 48 km (12 km/h) y B de 38 a 42 km (4 km/h); por eso A, que estaba atrás, termina adelante (48 km frente a 42 km). Estar adelante varias horas no implica ser siempre más rápido, y que la distancia aumente no significa que la velocidad sea constante: la pendiente de B va disminuyendo.","t":{"comp":"argumentacion","cont":"calculo","dif":2},"c":"cu-c08"},{"i":"cu-023","q":"¿Cuántos afiches se imprimen en el turno de la tarde?","o":["5.400","7.500","9.000","45.000"],"a":2,"e":"Cada máquina imprime 4.500/(3 × 5) = 300 afiches por hora. En la tarde: 5 máquinas × 6 horas × 300 = 9.000. Los valores 7.500 y 5.400 tienen en cuenta solo el cambio de máquinas o solo el de horas.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c09"},{"i":"cu-024","q":"La imprenta recibe un pedido de 7.200 afiches que debe entregar en 4 horas. ¿Cuántas máquinas debe poner a trabajar?","o":["6","8","9","12"],"a":0,"e":"En 4 horas cada máquina imprime 300 × 4 = 1.200 afiches, así que se requieren 7.200/1.200 = 6 máquinas. Quien trata las horas como inversamente proporcionales sin usar la tasa por máquina llega a valores como 8 o 9.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c09"},{"i":"cu-025","q":"¿En cuál sede fue mayor el aumento porcentual (relativo) del número de usuarios satisfechos entre 2024 y 2025?","o":["Sede Norte","Sede Centro","En las tres sedes fue igual","Sede Sur"],"a":3,"e":"Los aumentos relativos son: Norte, 6/60 = 10 %; Centro, 10/40 = 25 %; Sur, 8/20 = 40 %. La sede Centro tiene el mayor aumento en puntos (10), pero no en proporción respecto a su valor inicial.","t":{"comp":"interpretacion","cont":"estadistica","dif":2},"c":"cu-c10"},{"i":"cu-026","q":"El director afirma: «La sede Centro mejoró más que la sede Sur, porque subió 10 puntos y la Sur solo 8». Esta afirmación es","o":["correcta solo en puntos porcentuales; en términos relativos la sede Sur mejoró más (40 % frente a 25 %).","correcta en cualquier sentido, porque 10 es mayor que 8.","incorrecta, porque la sede Sur parte de un valor menor y, por eso, no puede haber mejorado más.","incorrecta, porque la sede Norte tiene el mayor porcentaje de satisfacción y, por eso, es la sede que más mejoró."],"a":0,"e":"La comparación depende del criterio: en puntos porcentuales Centro (10) supera a Sur (8), pero en términos relativos Sur pasó de 20 % a 28 %, un aumento de 40 %, mayor que el 25 % de Centro. Decir «correcta en cualquier sentido» ignora que el punto de partida importa.","t":{"comp":"argumentacion","cont":"estadistica","dif":3},"c":"cu-c10"},{"i":"cu-027","q":"¿Cuál es, aproximadamente, la capacidad del tanque en litros?","o":["3.140","9.420","18.840","37.680"],"a":1,"e":"El radio es 1 m, así que V = π r² h = 3,14 × 1² × 3 = 9,42 m³, que son 9.420 L. El valor 37.680 resulta de usar el diámetro como si fuera el radio, y 18.840 corresponde al área lateral (2π r h), no al volumen.","t":{"comp":"formulacion","cont":"geometria","dif":2},"c":"cu-c11"},{"i":"cu-028","q":"Se quiere construir otro tanque con la misma altura, pero con el doble de capacidad. ¿Cómo debe cambiar el radio?","o":["Debe duplicarse.","Debe aumentarse en 50 %.","Debe multiplicarse por 4.","Debe multiplicarse por √2 (≈ 1,41)."],"a":3,"e":"El volumen depende del cuadrado del radio (V = π r² h). Para duplicar V con h constante, r² debe duplicarse, es decir, r se multiplica por √2 ≈ 1,41. Duplicar el radio cuadruplicaría el volumen.","t":{"comp":"argumentacion","cont":"geometria","dif":3},"c":"cu-c11"},{"i":"cu-029","q":"¿Cuál es la nota final de Ana en el curso?","o":["3,50","3,75","3,90","4,00"],"a":2,"e":"Nota final = 0,20 × 3,0 + 0,20 × 4,0 + 0,40 × 4,5 + 0,20 × 3,5 = 0,6 + 0,8 + 1,8 + 0,7 = 3,9. El promedio simple de las cuatro notas (3,75) ignora que el proyecto pesa más.","t":{"comp":"interpretacion","cont":"estadistica","dif":1},"c":"cu-c12"},{"i":"cu-030","q":"Ana necesitaba al menos 3,8 de nota final. Con las demás notas de la tabla, ¿cuál es la nota mínima que podía sacar en el quiz para lograrlo?","o":["2,5","3,0","3,5","3,8"],"a":1,"e":"Sin el quiz, Ana acumula 0,6 + 0,8 + 1,8 = 3,2 puntos. Faltan 3,8 − 3,2 = 0,6 puntos, que deben provenir del 20 % del quiz: 0,6/0,20 = 3,0. El valor 3,8 sale de confundir la nota final deseada con la nota del quiz.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c12"},{"i":"cu-031","q":"De acuerdo con el comportamiento cuadrático de la gráfica, ¿qué precio de boleta maximiza la utilidad?","o":["$25.000","$30.000","$35.000","$40.000"],"a":2,"e":"Una parábola es simétrica respecto a su vértice. Como la utilidad es 140 con $30.000 y también con $40.000, el máximo está en el punto medio, $35.000. Escoger $30.000 o $40.000 supone que el máximo es uno de los datos medidos.","t":{"comp":"interpretacion","cont":"calculo","dif":2},"c":"cu-c13"},{"i":"cu-032","q":"Un asesor propone subir el precio a $50.000, pues «cada boleta dejaría más dinero y la utilidad aumentaría». Con base en la gráfica, la propuesta es","o":["adecuada, porque a mayor precio cada boleta deja más ganancia y esto eleva siempre la utilidad total.","adecuada, porque con $50.000 la utilidad es igual a la que se obtiene con $20.000.","inadecuada, porque con $50.000 la utilidad sería negativa.","inadecuada, porque con $50.000 la utilidad es de 100 millones y con $40.000 es de 140."],"a":3,"e":"La gráfica muestra que, pasada la zona del máximo, subir el precio reduce la utilidad: de 140 millones con $40.000 a 100 millones con $50.000. El argumento del asesor mira solo la ganancia por boleta e ignora que el modelo incluye la reacción de la demanda; además la utilidad con $50.000 no es negativa.","t":{"comp":"argumentacion","cont":"calculo","dif":2},"c":"cu-c13"},{"i":"cu-033","q":"Para comparar la seguridad vial entre ciudades de distinto tamaño se usa el número de accidentes por cada 100.000 habitantes. ¿Cuál ciudad presenta la mayor tasa?","o":["Ciudad B","Ciudad A","Ciudad C","No es posible compararlas con estos datos."],"a":0,"e":"Las tasas son: A, 1.200/8 = 150; B, 450/2,5 = 180; C, 2.100/15 = 140 accidentes por cada 100.000 habitantes. La ciudad C tiene más accidentes en total, pero también mucha más población.","t":{"comp":"interpretacion","cont":"estadistica","dif":2},"c":"cu-c14"},{"i":"cu-034","q":"La ciudad A se propone reducir su tasa a 120 accidentes por cada 100.000 habitantes, con la misma población. ¿Cuántos accidentes anuales menos tendría que registrar?","o":["30","240","480","960"],"a":1,"e":"Con 800.000 habitantes, una tasa de 120 por 100.000 equivale a 8 × 120 = 960 accidentes. Hoy son 1.200, así que debe haber 240 menos. El valor 960 es el número de accidentes meta, no la reducción.","t":{"comp":"formulacion","cont":"algebra","dif":2},"c":"cu-c14"},{"i":"cu-035","q":"Una persona invierte $4.000.000 en un producto que paga 5 % de interés anual compuesto. Si no retira nada, ¿cuánto dinero tendrá al cabo de 2 años?","o":["$4.200.000","$4.400.000","$4.410.000","$8.400.000"],"a":2,"e":"Con interés compuesto, el segundo año el 5 % se calcula sobre $4.200.000: 4.000.000 × 1,05² = $4.410.000. El valor $4.400.000 corresponde a interés simple y $4.200.000 a un solo año.","t":{"comp":"formulacion","cont":"algebra","dif":2}},{"i":"cu-036","q":"Un archivo de audio estéreo (2 canales) se graba a 48.000 muestras por segundo en cada canal y 24 bits por muestra. Si 1 MB = 1.000.000 de bytes y 1 byte = 8 bits, ¿cuántos MB ocupa, aproximadamente, un minuto de audio sin comprimir?","o":["8,64 MB","17,28 MB","138,24 MB","276,48 MB"],"a":1,"e":"Cada segundo: 48.000 × 2 × 24 = 2.304.000 bits = 288.000 bytes. En 60 s son 17.280.000 bytes ≈ 17,28 MB. El valor 138,24 aparece al olvidar dividir entre 8 los bits, y 8,64 al contar un solo canal.","t":{"comp":"formulacion","cont":"algebra","dif":2}},{"i":"cu-037","q":"Una persona de 1,8 m de estatura proyecta una sombra de 2,4 m. En ese mismo momento, un poste proyecta una sombra de 8 m. ¿Cuál es la altura del poste?","o":["4,3 m","6 m","10,7 m","14,4 m"],"a":1,"e":"Los triángulos formados por cada objeto y su sombra son semejantes: altura/sombra = 1,8/2,4 = 0,75, luego el poste mide 0,75 × 8 = 6 m. El valor 10,7 resulta de invertir la razón y 14,4 de multiplicar 1,8 por 8.","t":{"comp":"interpretacion","cont":"geometria","dif":1}},{"i":"cu-038","q":"Una rampa de 8 m de longitud forma un ángulo de 30° con el piso horizontal. ¿A qué altura sobre el piso se encuentra su extremo superior? (sen 30° = 0,5; cos 30° ≈ 0,87)","o":["4 m","6,9 m","8 m","13,9 m"],"a":0,"e":"La altura es el cateto opuesto al ángulo: h = 8 × sen 30° = 4 m. El valor 6,9 m es 8 × cos 30°, es decir, el desplazamiento horizontal, no la altura.","t":{"comp":"formulacion","cont":"geometria","dif":1}},{"i":"cu-039","q":"Un parque rectangular mide 60 m × 40 m. Por el interior del borde se construye un sendero de 2 m de ancho que lo rodea completamente. Para hallar el área del sendero se proponen tres procedimientos:\nI. Restar al área del parque el área del rectángulo interior de 56 m × 36 m.\nII. Sumar dos franjas de 60 m × 2 m y dos franjas de 36 m × 2 m.\nIII. Sumar dos franjas de 60 m × 2 m y dos franjas de 40 m × 2 m.\n¿Cuáles procedimientos permiten hallar el área del sendero?","o":["Solo I","II y III solamente","I y II solamente","I, II y III"],"a":2,"e":"El rectángulo interior mide (60 − 4) × (40 − 4) = 56 × 36, así que I da 2.400 − 2.016 = 384 m². En II, las franjas laterales deben medir 36 m para no repetir las esquinas: 240 + 144 = 384 m². El procedimiento III cuenta dos veces las esquinas y da 400 m².","t":{"comp":"argumentacion","cont":"geometria","dif":3}},{"i":"cu-040","q":"Un lote de 50 micrófonos contiene 5 defectuosos. Se escogen al azar 2 micrófonos, uno después del otro y sin devolver el primero. ¿Cuál es la probabilidad de que ambos sean defectuosos?","o":["2/245","1/100","1/10","1/5"],"a":0,"e":"Es (5/50) × (4/49) = 20/2.450 = 2/245 ≈ 0,008. Como no hay reemplazo, la segunda probabilidad cambia a 4/49; si se devolviera el primero sería (1/10) × (1/10) = 1/100.","t":{"comp":"formulacion","cont":"estadistica","dif":3}},{"i":"cu-041","q":"¿En cuál rango de edad se encuentra la mediana de las edades de los asistentes?","o":["18–24 años","25–34 años","35–44 años","45–54 años"],"a":1,"e":"Con 70 datos, la mediana está entre los puestos 35 y 36. Acumulando, hay 12 personas hasta los 24 años y 12 + 30 = 42 hasta los 34 años; por eso los puestos 35 y 36 están en el rango de 25 a 34 años. Aunque 35–44 está más cerca del «centro» del gráfico, la mediana depende de las frecuencias acumuladas.","t":{"comp":"interpretacion","cont":"estadistica","dif":2},"c":"cu-c15"},{"i":"cu-042","q":"¿Cuál de las siguientes afirmaciones sobre los asistentes es incorrecta?","o":["El promedio de edad es 29,5 años, el punto medio del rango más numeroso.","Más de la mitad de los asistentes tiene menos de 35 años de edad.","Cerca del 14 % de los asistentes tiene 45 años de edad o más.","El rango con más asistentes es el de 25 a 34 años de edad."],"a":0,"e":"El promedio no es el punto medio del rango más frecuente, sino que depende de todos los datos; usando los puntos medios de cada rango da aproximadamente 33,8 años. Las otras son ciertas: 42 de 70 (60 %) tienen menos de 35 años, 10 de 70 (≈ 14 %) tienen 45 o más, y el mayor número de asistentes (30) está en el rango 25–34.","t":{"comp":"argumentacion","cont":"estadistica","dif":2},"c":"cu-c15"},{"i":"cu-043","q":"¿Cuál es, aproximadamente, el área del piso del salón?","o":["74,13 m²","78,84 m²","88,26 m²","116,52 m²"],"a":0,"e":"Rectángulo: 10 × 6 = 60 m². Semicírculo de radio 3 m: 3,14 × 3² / 2 = 14,13 m². Total: 74,13 m². El valor 88,26 m² se obtiene sumando el círculo completo y 78,84 m² se obtiene al usar la longitud de la circunferencia en lugar del área.","t":{"comp":"formulacion","cont":"geometria","dif":1},"c":"cu-c16"},{"i":"cu-044","q":"Para calcular el perímetro (contorno) del piso, Laura propone 10 + 10 + 6 + 3,14 × 3, y Mateo propone 10 + 10 + 6 + 6 + 3,14 × 3. ¿Quién tiene razón?","o":["Mateo, porque el contorno debe incluir los cuatro lados del rectángulo además de la parte curva del semicírculo.","Los dos, porque ambas expresiones son equivalentes.","Laura, porque el lado de 6 m que coincide con el diámetro queda en el interior del piso y no es parte del contorno.","Ninguno, porque la longitud de la parte curva del piso es 3,14 × 6 y no 3,14 × 3, como ambos plantean."],"a":2,"e":"En la figura el lado de 6 m donde se une el semicírculo desaparece del contorno, que queda formado por tres lados del rectángulo y la semicircunferencia, de longitud π × r = 3,14 × 3 = 9,42 m. Las expresiones de Laura y Mateo difieren en 6 m, así que no son equivalentes; y 3,14 × 6 sería la circunferencia completa.","t":{"comp":"argumentacion","cont":"geometria","dif":2},"c":"cu-c16"},{"i":"cu-045","q":"Se escoge al azar una pieza del lote del día. ¿Cuál es la probabilidad de que sea defectuosa?","o":["2,0 %","3,2 %","3,7 %","11,0 %"],"a":1,"e":"Piezas defectuosas: 10 + 12 + 10 = 32 de 1.000, es decir, 3,2 %. El 3,7 % resulta de promediar los porcentajes (2, 4 y 5) sin tener en cuenta que las máquinas producen cantidades distintas, y el 11 % de sumarlos.","t":{"comp":"interpretacion","cont":"estadistica","dif":2},"c":"cu-c17"},{"i":"cu-046","q":"Se escoge al azar una pieza del lote y resulta defectuosa. ¿Cuál es la probabilidad de que haya sido producida por la máquina M2?","o":["4 %","12 %","30 %","37,5 %"],"a":3,"e":"Entre las 32 piezas defectuosas, 12 vienen de M2: 12/32 = 37,5 %. El 30 % es la proporción de piezas del lote que produce M2 (300 de 1.000), y el 4 % es la tasa de defectos de M2: ninguno responde a la probabilidad condicionada a que la pieza sea defectuosa.","t":{"comp":"formulacion","cont":"estadistica","dif":3},"c":"cu-c17"},{"i":"cu-047","q":"¿Cuál de las siguientes descripciones compara correctamente el crecimiento de los dos municipios?","o":["Ambos crecen igual, porque los dos pasaron de 100 a 110 mil habitantes en el primer año.","El municipio X crece más rápido que Y, porque su gráfica es una línea recta y la de Y no lo es.","X suma 10 mil habitantes cada año; Y crece 10 % cada año, así que suma más habitantes cada vez.","El municipio Y crece menos que X, porque aumentó 46 mil habitantes y X aumentó 40 mil."],"a":2,"e":"X tiene crecimiento lineal (+10 mil por año). En Y, el aumento es de 10 % cada año: 100, 110, 121, 133, 146; por eso el número de habitantes que se suman crece cada año. En el total, Y creció más (46 mil frente a 40 mil), y una gráfica recta no indica mayor rapidez.","t":{"comp":"interpretacion","cont":"calculo","dif":2},"c":"cu-c18"},{"i":"cu-048","q":"Una funcionaria proyecta la población de ambos municipios para 2030. ¿Cuál de las siguientes proyecciones es coherente con el comportamiento de cada uno?","o":["En 2030 ambos tendrán 200 mil habitantes, porque los dos aumentaron 10 mil en el primer año.","En 2030 Y tendrá 200 mil habitantes, porque crece 10 % cada año, es decir, 10 mil por año.","Si mantienen su patrón, en 2030 Y tendría cerca de 259 mil habitantes y X, 200 mil.","En 2030 X superará a Y, porque su crecimiento constante es más estable."],"a":2,"e":"De 2020 a 2030 pasan 10 años. X suma 10 mil por año: 100 + 10 × 10 = 200 mil. Y se multiplica por 1,1 cada año: 100 × 1,1¹⁰ ≈ 259 mil. Igualar ambos desconoce que el crecimiento de Y es porcentual, y que sea «más estable» no lo hace crecer más.","t":{"comp":"argumentacion","cont":"calculo","dif":3},"c":"cu-c18"},{"i":"cu-049","q":"Si el gráfico se dibujara como un círculo de 360°, ¿qué ángulo tendría el sector del pop?","o":["72°","108°","144°","180°"],"a":0,"e":"El pop representa 20 % del total: 0,20 × 360° = 72°. El valor 108° corresponde al reggaetón (30 %).","t":{"comp":"interpretacion","cont":"estadistica","dif":1},"c":"cu-c19"},{"i":"cu-050","q":"Una emisora afirma: «Más de la mitad de los jóvenes encuestados prefiere el reggaetón, pues tiene el sector más grande del gráfico». Esta afirmación es","o":["correcta, porque su sector es el más grande, lo que implica que supera a todos los demás géneros juntos.","correcta, porque 120 de los 400 jóvenes lo prefieren y ningún otro género llega a esa cantidad.","incorrecta, porque su sector, aunque es el más grande, representa solo 30 %, menos de la mitad de los encuestados.","incorrecta, porque los jóvenes que prefieren otros géneros suman 70 % y eso impide que el reggaetón sea el favorito."],"a":2,"e":"Ser el género más frecuente (30 %, o sea 120 jóvenes) no equivale a ser preferido por más de la mitad (más de 200 jóvenes). El último distractor llega a la conclusión «incorrecta» con un argumento erróneo: el reggaetón sí es el favorito más frecuente, pero no el de la mayoría.","t":{"comp":"argumentacion","cont":"estadistica","dif":2},"c":"cu-c19"},{"i":"cu-051","q":"¿Cuánto cobra la empresa por abordar el vehículo, sin recorrer ningún kilómetro?","o":["$1.500","$3.000","$4.500","$6.000"],"a":3,"e":"De 2 km a 6 km el valor sube $6.000 en 4 km, es decir, $1.500 por km. Entonces los 2 km cuestan $3.000 y el resto de los $9.000, $6.000, es el valor fijo de abordaje. El valor $4.500 resulta de dividir $9.000 entre 2.","t":{"comp":"interpretacion","cont":"algebra","dif":1},"c":"cu-c20"},{"i":"cu-052","q":"Un pasajero afirma que un servicio de 10 km cuesta el doble que uno de 5 km, porque 10 km es el doble de 5 km. Esta afirmación es","o":["incorrecta, porque el abordaje ($6.000) se paga una vez: 5 km cuestan $13.500 y 10 km, $21.000, menos del doble.","correcta, porque cada kilómetro cuesta lo mismo y, por tanto, al duplicar los kilómetros se duplica el valor total.","correcta, porque el valor del servicio es directamente proporcional a la distancia recorrida.","incorrecta, porque 10 km cuestan $21.000 y 5 km cuestan $9.000, es decir, más del doble."],"a":0,"e":"El valor es P = 6.000 + 1.500·d, una función lineal con intercepto distinto de cero, y no una proporcionalidad directa. Para 5 km: 6.000 + 7.500 = $13.500; para 10 km, $21.000, que es menos que 2 × 13.500 = $27.000. El último distractor toma $9.000, que es el valor de 2 km y no de 5 km.","t":{"comp":"argumentacion","cont":"algebra","dif":3},"c":"cu-c20"},{"i":"cu-053","q":"¿Cuántos metros mide el lado BC del lote?","o":["10 m","13,5 m","15 m","22,5 m"],"a":2,"e":"Como DE es paralela a BC, los triángulos ADE y ABC son semejantes: AD/AB = DE/BC, con AB = 6 + 4 = 10, entonces 6/10 = 9/BC y BC = 15 m. El valor 13,5 m resulta de usar la razón AD/DB (6/4) en lugar de AD/AB.","t":{"comp":"formulacion","cont":"geometria","dif":2},"c":"cu-c21"},{"i":"cu-054","q":"Un topógrafo afirma que el triángulo ADE ocupa el 60 % del área del lote ABC, porque la razón entre AD y AB es 6/10. Esta afirmación es","o":["correcta, porque en triángulos semejantes el área guarda la misma razón que tienen los lados.","incorrecta, porque las áreas guardan la razón al cuadrado: ADE ocupa el 36 % del lote.","incorrecta, porque ADE ocupa el 40 % del lote, que es la razón DB/AB entre los lados.","correcta, porque el lado DE (9 m) es el 60 % del lado BC (15 m)."],"a":1,"e":"Si la razón de semejanza es 6/10 = 0,6, la razón entre las áreas es 0,6² = 0,36, es decir, 36 %. El último distractor tiene una premisa cierta (9 es el 60 % de 15), pero de ella no se concluye que el área sea el 60 %.","t":{"comp":"argumentacion","cont":"geometria","dif":3},"c":"cu-c21"},{"i":"cu-055","q":"Un estudio con 300 estudiantes encontró que quienes escuchan música mientras estudian tienen, en promedio, mejores notas que quienes no lo hacen. Un periodista concluye: «Escuchar música mientras se estudia mejora las notas». ¿Por qué esa conclusión no está plenamente justificada?","o":["Porque 300 estudiantes son muy pocos para calcular un promedio confiable de notas.","Porque los promedios de dos grupos de estudiantes distintos no se pueden comparar entre sí.","Porque muestra una asociación, pero no descarta otros factores (como las horas de estudio) que expliquen la diferencia.","Porque el grupo con mejor promedio debería ser el que estudia en completo silencio."],"a":2,"e":"Que dos variables estén asociadas no prueba que una cause la otra: los estudiantes que escuchan música podrían diferir en otros aspectos (horas de estudio, disciplina, entorno). Comparar promedios es válido, y 300 datos son suficientes para calcularlos; el problema es la inferencia causal.","t":{"comp":"argumentacion","cont":"estadistica","dif":2}},{"i":"cu-056","q":"El valor de un pasaje de bus pasó de $2.800 a $3.150. ¿Cuál fue el aumento porcentual?","o":["9,0 %","10,0 %","11,1 %","12,5 %"],"a":3,"e":"El aumento fue de $350 y el porcentaje se calcula respecto al valor inicial: 350/2.800 = 12,5 %. El 11,1 % resulta de dividir entre el valor final ($3.150).","t":{"comp":"interpretacion","cont":"algebra","dif":1}},{"i":"cu-057","q":"En un coro, la razón entre hombres y mujeres es 3 : 5. Si se retiran 4 mujeres, la razón pasa a ser 3 : 4. Sean 3k y 5k los números de hombres y de mujeres. Para hallar el total de integrantes originales (8k) se proponen estos procedimientos:\nI. Resolver 3k/(5k − 4) = 3/4 y calcular 8k.\nII. Resolver 3k + 5k − 4 = 3 + 4 y calcular 8k.\nIII. Probar k = 1, 2, 3, … hasta que 3k : (5k − 4) sea equivalente a 3 : 4 y calcular 8k.\n¿Cuáles procedimientos permiten hallar el total?","o":["Solo I","Solo II","II y III solamente","I y III solamente"],"a":3,"e":"La razón 3 : 4 se cumple entre hombres y mujeres restantes: 3k/(5k − 4) = 3/4, lo que da k = 4, es decir, 12 hombres, 20 mujeres y 32 integrantes. El procedimiento III llega al mismo resultado por ensayo. El II iguala el total de integrantes con 3 + 4, lo que no tiene sentido (la razón no fija las cantidades).","t":{"comp":"argumentacion","cont":"algebra","dif":3}},{"i":"cu-058","q":"La velocidad de un carro de pruebas aumenta de forma constante de 0 a 20 m/s durante los primeros 10 s, se mantiene en 20 m/s durante los siguientes 20 s y luego disminuye de forma constante hasta 0 en 5 s. ¿Qué distancia recorre en total?","o":["400 m","450 m","500 m","550 m"],"a":3,"e":"La distancia es el área bajo la gráfica velocidad-tiempo: triángulo inicial (10 × 20/2 = 100 m) + rectángulo (20 × 20 = 400 m) + triángulo final (5 × 20/2 = 50 m) = 550 m. Los otros valores omiten uno de los tramos.","t":{"comp":"interpretacion","cont":"calculo","dif":3}},{"i":"cu-059","q":"Un ingeniero de mezcla revisa 3 pistas cada 45 minutos. Con ese ritmo constante, ¿cuántas pistas revisa en una jornada de 6 horas?","o":["8","12","18","24"],"a":3,"e":"6 horas son 360 minutos, es decir, 360/45 = 8 bloques de 45 minutos; en cada uno revisa 3 pistas: 8 × 3 = 24. El valor 8 es solo el número de bloques.","t":{"comp":"interpretacion","cont":"algebra","dif":1}},{"i":"cu-060","q":"Un gráfico de barras compara las entradas vendidas para dos conciertos: 92 y 96. El eje vertical comienza en 90, de modo que la barra del segundo concierto aparece con el triple de altura que la del primero (6 unidades de escala frente a 2). ¿Cuál afirmación es correcta?","o":["El gráfico exagera la diferencia: las ventas del segundo concierto fueron cerca de 4,3 % mayores, no el triple.","El gráfico es adecuado, porque todo gráfico de barras debe comenzar en el valor mínimo de los datos.","Las ventas del segundo concierto fueron el triple de las del primero, porque así lo muestra la altura de las barras.","La diferencia real es de 4 entradas, por lo que el gráfico subestima el cambio."],"a":0,"e":"Al recortar el eje en 90, la altura de las barras deja de ser proporcional a las ventas. La razón real es 96/92 ≈ 1,043, un aumento de unos 4,3 %. Conviene que el eje de un gráfico de barras inicie en cero para que las alturas sean comparables.","t":{"comp":"argumentacion","cont":"estadistica","dif":2}}]},{"id":"ingles","name":"Inglés","desc":"Siete partes alineadas al MCER, de A1 a B2","ctx":{"en-c01":{"kind":"texto","title":"Kitchen","text":"Category: Kitchen\nWords: bowl, fridge, kettle, knife, oven, plate, sink, spoon"},"en-c02":{"kind":"texto","title":"Jobs","text":"Category: Jobs\nWords: chef, dentist, doctor, driver, farmer, pilot, singer, teacher"},"en-c03":{"kind":"aviso","text":"NO FOOD OR DRINKS BEYOND THIS POINT"},"en-c04":{"kind":"aviso","text":"Gate change:\nFlight 214 now boards at 12B"},"en-c05":{"kind":"aviso","text":"Back in 10 minutes"},"en-c06":{"kind":"aviso","text":"CAUTION\nWet floor. Please walk slowly."},"en-c07":{"kind":"aviso","text":"Please keep your phone on silent during the concert."},"en-c08":{"kind":"aviso","text":"SALE!\nEverything 30% off until Sunday"},"en-c09":{"kind":"aviso","text":"Please return books to the desk before you leave."},"en-c10":{"kind":"aviso","text":"Take 1 tablet every 8 hours with water. Do not take more than 3 a day."},"en-c11":{"kind":"aviso","text":"Mia, I'm at the supermarket. Do you need anything? Call me. – Dad"},"en-c12":{"kind":"aviso","text":"Front seats are for elderly people and pregnant women."},"en-c13":{"kind":"texto","title":"A Weekend in Cartagena","text":"Last month my sister and I decided to spend a weekend (1) ______ Cartagena. We left Barranquilla (2) ______ Friday morning and arrived after only two hours. The hotel was small, (3) ______ it was very clean, and the owner was friendly. On Saturday we walked around the old city and visited (4) ______ famous castle. It was hot, so we drank (5) ______ water. In the afternoon we (6) ______ lunch in a little restaurant when it started to rain suddenly. Luckily, the food was (7) ______ than we expected, so we didn't mind. I think this was the best trip I (8) ______ had this year, and I really want to go back soon."},"en-c14":{"kind":"texto","title":"Why Do We Sleep?","text":"Many people think sleep is just a time (1) ______ the body rests, but scientists say the brain is very active at night. While we sleep, it (2) ______ the information we learned during the day. (3) ______ you sleep well, it is easier to remember new things. Experts recommend that adults sleep (4) ______ seven hours a night. However, using a phone in bed can make it harder to fall asleep (5) ______ the screen's light tells the brain that it is still daytime. If you want to sleep well, you (6) ______ turn off your devices an hour before bed. Also, avoid drinking coffee in the evening, because it stays in your body (7) ______ many hours. People (8) ______ don't get enough sleep often feel tired and find it difficult to concentrate."},"en-d01":{"kind":"texto","title":"THE LITTLE TRAIN OF SANTA ELENA","text":"For almost a century, a small green train has climbed the mountains above the town of Santa Elena, carrying coffee, fruit and passengers to the markets of the valley below. When the railway was built in 1926, farmers had to walk for two days to sell their crops. The train reduced the journey to just three hours, and many families moved closer to the track to take advantage of it.\n\nBy the 1980s, however, new roads had been opened and trucks had become faster and cheaper. The railway lost most of its customers, and in 1989 the company decided to close it. For nearly ten years the station stayed empty, and the wooden carriages slowly rusted in a field.\n\nThen a group of retired railway workers began to repair the old locomotive in their free time. They had no money, so neighbours donated tools, paint and even lunch. In 1999 the train made its first journey with tourists on board, and it has run every weekend since.\n\nToday the ride lasts four hours instead of three because the train goes slowly on purpose, so that passengers can enjoy the views. A ticket costs less than a cinema seat, and children under six travel for free. Visitors may carry a small bag but not large suitcases, and a family from the village sells homemade bread and cheese at the middle station. “The train was built to move products,” says Marta Quiroga, one of the volunteers. “Now it moves memories.”"},"en-d02":{"kind":"texto","title":"HIVES ON THE ROOFTOPS OF ALMAR","text":"When Clara Mendes put four beehives on the roof of her apartment building in the port city of Almar, her neighbours thought she was joking. “People asked me if the bees would sting everyone in the street,” she remembers. That was eight years ago. Today more than two hundred hives can be found on the roofs of schools, offices and even the city hospital.\n\nAlmar might seem a strange home for bees, but experts say that cities can be better for them than the countryside. Farms often use chemicals that harm insects, whereas parks and balconies in the city offer a wide variety of flowers from early spring until late autumn. As a result, city bees usually produce honey for more months of the year.\n\nThe project has also brought some surprises. Each neighbourhood produces honey with a different flavour: the hives near the botanical garden give a light, flowery honey, while those close to the harbour produce a darker one with a slightly salty taste. A local chef now uses both in her restaurant, and a small shop sells jars with the name of the street where each batch was made.\n\nNot everything has been easy. Beekeepers must register their hives with the city council, and they need to attend a two-day course before they receive any bees. Clara says the course is important because “the bees are not the real problem; careless people are.” Last year, volunteers visited twenty schools to teach children how to behave near hives. The next goal is to have a hive in every district of the city by 2030."},"en-d03":{"kind":"otro","title":"Subject: Your news","text":"Dear Priya,\n\nThank you for your long message, and congratulations on the offer from the Singapore office. I read it twice on the train, and then once more at home, because I wanted to be sure I was not simply reacting to the excitement in your words.\n\nYou asked me whether I would consider joining you there. I have to admit that two years ago I would have packed my bags that same evening. Back then, my flat was small, my salary was smaller, and the idea of starting over somewhere new felt like an adventure rather than a risk. Things are different now. My mother's health is not what it was, and my brother, who has always been the practical one in the family, has just started a new job in another city. Somebody has to be here, and it seems that this time that somebody is me.\n\nPlease do not take this as a rejection of your friendship, or of the plan itself. It is a good plan, and I suspect you will make a great success of it. But if I said yes just to avoid disappointing you, I would end up resenting both of us, and I value our friendship too much for that.\n\nWhat I can offer is a place to stay whenever you pass through, and a promise that I will be the loudest person at the airport when you leave. Send me photographs of whatever you eat in the first week. I am already jealous.\n\nWarmly,\nDaniel"},"en-d04":{"kind":"texto","title":"The Tyranny of the Playlist","text":"There was a time when walking into a café meant hearing whatever the owner happened to love. Sometimes it was a scratchy jazz record, sometimes a local band's demo and, now and then, it must be said, something unbearable. Either way, you knew that a person had made a choice. Today, most places have handed that choice over to an algorithm that promises “the perfect mood” for every hour of the day.\n\nI understand the appeal. A well-designed playlist is cheap, safe and unlikely to offend anyone. Nobody has ever left a restaurant because the music was too inoffensive. Yet that is exactly the problem. Music designed not to be noticed soon stops being music at all; it becomes a kind of acoustic wallpaper, pleasant enough but impossible to remember.\n\nLast month I visited a small bookshop whose owner plays whatever she is listening to that week. On Tuesday it was a guitarist from Mali, on Thursday a Bach cello suite and, I suspect, one rainy afternoon, her teenage son's very loud rock. Customers complained about the rock, naturally. But they also asked the guitarist's name, and three of them bought his album at the counter. I cannot imagine anyone asking an algorithm for its name.\n\nI am not suggesting that every business should become a radio station. Still, a little risk might be good for us. If we only ever hear what is guaranteed to please, we lose the chance to be surprised, and surprise, after all, is what made most of us fall in love with music in the first place."},"en-d05":{"kind":"texto","title":"THE RISE OF THE HOME STUDIO","text":"Not long ago, recording an album (1) ______ expensive equipment and weeks of booking time in a professional studio. Studio time was charged by the hour, so every mistake had a price. Today, (2) ______ only a laptop and a decent microphone, a teenager can produce a song that sounds (3) ______ professional that most listeners cannot tell the difference. In fact, many of the biggest hits of recent years (4) ______ in bedrooms and garages.\n\nThis change has (5) ______ musicians much more freedom, but it has also created new challenges. If you (6) ______ a studio at home, nobody will be there to tell you when a take is good enough. Some artists spend months (7) ______ the same song again and again, and they never feel completely satisfied with the result.\n\n(8) ______ it is easier than ever to make music, it is harder than ever to be heard. Thousands of new tracks (9) ______ to streaming platforms every day, so listeners have an almost endless choice. Experienced producers often give new artists the same advice: finish the project and release it, (10) ______ waiting for a perfection that never arrives. A finished song, even an imperfect one, teaches more than ten unfinished ones."},"en-d06":{"kind":"texto","title":"A STATION FULL OF STORIES","text":"The Museum of Local History in the town of Brenton is housed in a building (1) ______ iron roof was made in a factory just a few kilometres away. The station (2) ______ in 1892 and served the town for nearly a century, (3) ______ the last train left in 1988. For years the building stood empty, and in 1995 the council almost (4) ______ it down.\n\nFortunately, a group of residents who (5) ______ near the tracks campaigned against the plan. They collected thousands of signatures and wrote to newspapers across the region. Since then, volunteers (6) ______ the museum's collection, which now includes more than four thousand objects. (7) ______ of them were donated by local families: old photographs, tickets, uniforms and even a collection of lanterns used by the station staff.\n\n“If the station (8) ______ demolished, we would have lost a large part of our identity,” says the director, Lucía Ferrer. The old railway line is now a footpath through the valley, popular with cyclists. Today the museum is not only a place to look at the past. Children can take (9) ______ in workshops where they learn how to repair an old signal, and (10) ______ free admission on Sundays, the museum attracts families from all over the region."}},"qs":[{"i":"en-p1-01","q":"We use this to cut bread or vegetables.","o":["bowl","fridge","kettle","knife","oven","plate","sink","spoon"],"a":3,"e":"Se necesita una herramienta para cortar: \"cut\" apunta a knife. Spoon y plate no cortan, y las demás palabras son aparatos o recipientes.","t":{"part":1,"set":"p1-s1","cefr":"A1","dif":2},"c":"en-c01"},{"i":"en-p1-02","q":"You put milk and other cold food in this to keep it fresh.","o":["bowl","fridge","kettle","knife","oven","plate","sink","spoon"],"a":1,"e":"\"Cold food\" y \"keep it fresh\" describen el refrigerador (fridge). El oven calienta, justo lo contrario.","t":{"part":1,"set":"p1-s1","cefr":"A1","dif":2},"c":"en-c01"},{"i":"en-p1-03","q":"People heat water in this electric machine to make tea.","o":["bowl","fridge","kettle","knife","oven","plate","sink","spoon"],"a":2,"e":"Se calienta agua para el té en una kettle (hervidor). Aunque el oven también calienta, no se usa para agua de té ni es \"electric machine\" para eso.","t":{"part":1,"set":"p1-s1","cefr":"A2","dif":2},"c":"en-c01"},{"i":"en-p1-04","q":"You wash dishes and vegetables in this.","o":["bowl","fridge","kettle","knife","oven","plate","sink","spoon"],"a":6,"e":"Sink es el lavaplatos/lavamanos de la cocina donde se lava. Bowl también puede contener agua, pero no es donde se lava normalmente.","t":{"part":1,"set":"p1-s1","cefr":"A2","dif":2},"c":"en-c01"},{"i":"en-p1-05","q":"You bake a cake or cook a pizza in this hot machine.","o":["bowl","fridge","kettle","knife","oven","plate","sink","spoon"],"a":4,"e":"Bake (hornear) se hace en el oven. Es la única palabra de la lista asociada a hornear.","t":{"part":1,"set":"p1-s1","cefr":"A1","dif":1},"c":"en-c01"},{"i":"en-p1-06","q":"This person grows vegetables and takes care of animals.","o":["chef","dentist","doctor","driver","farmer","pilot","singer","teacher"],"a":4,"e":"Quien cultiva vegetales y cuida animales es el farmer (agricultor).","t":{"part":1,"set":"p1-s2","cefr":"A1","dif":1},"c":"en-c02"},{"i":"en-p1-07","q":"This person checks sick people and gives them medicine.","o":["chef","dentist","doctor","driver","farmer","pilot","singer","teacher"],"a":2,"e":"Revisar enfermos y dar medicina es la labor del doctor. El dentist solo trata los dientes.","t":{"part":1,"set":"p1-s2","cefr":"A1","dif":1},"c":"en-c02"},{"i":"en-p1-08","q":"This person works in a school and helps students learn.","o":["chef","dentist","doctor","driver","farmer","pilot","singer","teacher"],"a":7,"e":"Trabajar en un colegio ayudando a aprender corresponde a teacher.","t":{"part":1,"set":"p1-s2","cefr":"A1","dif":2},"c":"en-c02"},{"i":"en-p1-09","q":"This person looks at your teeth and cleans them.","o":["chef","dentist","doctor","driver","farmer","pilot","singer","teacher"],"a":1,"e":"\"Teeth\" indica dentist; doctor es tentador, pero el doctor no se especializa en los dientes.","t":{"part":1,"set":"p1-s2","cefr":"A2","dif":2},"c":"en-c02"},{"i":"en-p1-10","q":"This person flies a plane and talks to the passengers.","o":["chef","dentist","doctor","driver","farmer","pilot","singer","teacher"],"a":5,"e":"Quien vuela un avión es el pilot. Driver conduce vehículos terrestres, no aviones.","t":{"part":1,"set":"p1-s2","cefr":"A2","dif":3},"c":"en-c02"},{"i":"en-p2-01","q":"Where can you see this sign?","o":["In an art gallery","In a restaurant","At a bakery"],"a":0,"e":"El aviso prohíbe comida y bebida más allá de cierto punto, típico de museos o galerías para proteger las obras. En un restaurante o una panadería ocurre lo contrario.","t":{"part":2,"set":"p2-s1","cefr":"A2","dif":1},"c":"en-c03"},{"i":"en-p2-02","q":"Where can you see this message?","o":["At a train ticket office","At a bus stop","At an airport"],"a":2,"e":"\"Gate\", \"Flight\" y \"boards\" son vocabulario de aeropuerto. Las estaciones de tren o bus no usan puertas de embarque ni números de vuelo.","t":{"part":2,"set":"p2-s1","cefr":"A2","dif":2},"c":"en-c04"},{"i":"en-p2-03","q":"What does this sign mean?","o":["The shop will close in ten minutes.","The owner will return soon.","The shop opens at ten o'clock."],"a":1,"e":"\"Back in 10 minutes\" significa que la persona volverá en diez minutos. Quien cierra o abre no usa esa expresión; el cartel dice \"back\" (regresa).","t":{"part":2,"set":"p2-s1","cefr":"A1","dif":1},"c":"en-c05"},{"i":"en-p2-04","q":"What should you do when you see this sign?","o":["Clean the floor","Walk carefully","Run to the stairs"],"a":1,"e":"El aviso advierte que el piso está mojado y pide caminar despacio. No pide limpiar: eso es labor del personal que puso el cartel.","t":{"part":2,"set":"p2-s1","cefr":"A1","dif":2},"c":"en-c06"},{"i":"en-p2-05","q":"Where can you see this notice?","o":["At a concert hall","At a phone shop","At a gym"],"a":0,"e":"\"During the concert\" ubica el aviso en una sala de conciertos. Una tienda de celulares es tentadora por la palabra \"phone\", pero allí no habría concierto.","t":{"part":2,"set":"p2-s1","cefr":"A2","dif":2},"c":"en-c07"},{"i":"en-p2-06","q":"Where can you see this sign?","o":["In a hospital room","At a school entrance","In a clothing shop window"],"a":2,"e":"Un descuento (\"30% off\") se anuncia en una tienda. Hospital y colegio no venden con ofertas semanales.","t":{"part":2,"set":"p2-s2","cefr":"A1","dif":1},"c":"en-c08"},{"i":"en-p2-07","q":"Where can you see this notice?","o":["In a cinema","In a post office","In a library"],"a":2,"e":"Devolver libros (\"return books\") al escritorio es típico de una biblioteca. En un cine o en una oficina de correos no se prestan libros.","t":{"part":2,"set":"p2-s2","cefr":"A1","dif":2},"c":"en-c09"},{"i":"en-p2-08","q":"Where can you see this text?","o":["On a food menu","On a medicine package","On a bus ticket"],"a":1,"e":"\"Tablet\", dosis y horas indican las instrucciones de un medicamento. Un menú podría tener comida, pero no indica dosis.","t":{"part":2,"set":"p2-s2","cefr":"A2","dif":2},"c":"en-c10"},{"i":"en-p2-09","q":"Who is this message for?","o":["Mia","Dad","A shop assistant"],"a":0,"e":"El mensaje empieza con el nombre del destinatario (\"Mia\") y termina con la firma de quien escribe (\"Dad\"). Por eso Dad es el remitente, no el destinatario.","t":{"part":2,"set":"p2-s2","cefr":"A1","dif":1},"c":"en-c11"},{"i":"en-p2-10","q":"What does this sign mean?","o":["Some passengers should have these seats first.","Everyone must sit at the front.","Only young people can sit here."],"a":0,"e":"El cartel reserva los asientos delanteros para ciertas personas (mayores, embarazadas). No obliga a todos a sentarse allí ni excluye a las personas mayores; es lo opuesto.","t":{"part":2,"set":"p2-s2","cefr":"A2","dif":3},"c":"en-c12"},{"i":"en-p3-01","q":"Anna: \"Would you like some more coffee?\"","o":["Yes, I like it very much.","It was very hot yesterday.","No, thanks. I've had enough."],"a":2,"e":"Se ofrece más café; la respuesta natural es aceptar o declinar con cortesía. \"I've had enough\" declina de forma adecuada; las otras no responden a la oferta.","t":{"part":3,"set":"p3-s1","cefr":"A2","dif":1}},{"i":"en-p3-02","q":"Tom: \"Excuse me, is this seat free?\"","o":["Fine, thanks.","Sorry, it's taken.","It's next to the window."],"a":1,"e":"La pregunta es si el asiento está libre; \"Sorry, it's taken\" responde directamente. \"Fine, thanks\" responde a \"How are you?\".","t":{"part":3,"set":"p3-s1","cefr":"A2","dif":2}},{"i":"en-p3-03","q":"Laura: \"How about going to the movies tonight?\"","o":["I went there yesterday morning.","Sounds great! What time?","Yes, I'm watching it now."],"a":1,"e":"Es una invitación: se acepta con \"Sounds great\". Las otras opciones usan tiempos que no encajan con un plan para esta noche.","t":{"part":3,"set":"p3-s1","cefr":"A2","dif":2}},{"i":"en-p3-04","q":"Carlos: \"I'm sorry I'm late.\"","o":["That's OK. We've just started.","You're welcome.","Never mind, it's late."],"a":0,"e":"Ante una disculpa se responde con \"That's OK / No problem\". \"You're welcome\" responde a un agradecimiento, no a una disculpa.","t":{"part":3,"set":"p3-s1","cefr":"A2","dif":2}},{"i":"en-p3-05","q":"Sam: \"Could you help me carry these boxes?\"","o":["No, they aren't mine.","Yes, I carried them.","Of course. Where do you want them?"],"a":2,"e":"Es una petición de ayuda; \"Of course\" acepta y pregunta por el destino. \"Yes, I carried them\" usa pasado y no ofrece ayuda ahora.","t":{"part":3,"set":"p3-s1","cefr":"A2","dif":2}},{"i":"en-p3-06","q":"Julia: \"What do you think of my new haircut?\"","o":["I think it's on Monday.","I don't have the time.","It looks really good on you."],"a":2,"e":"Piden una opinión sobre el aspecto; \"It looks good on you\" es un comentario apropiado. Las otras no tienen relación con la pregunta.","t":{"part":3,"set":"p3-s2","cefr":"A2","dif":2}},{"i":"en-p3-07","q":"Mark: \"Do you mind if I open the window?\"","o":["Yes, I do. It's my favorite one.","Not at all. It's a bit hot in here.","No, I haven't seen it."],"a":1,"e":"A \"Do you mind...?\" se acepta con \"Not at all\" (no me molesta). Las otras opciones no tienen sentido en ese contexto.","t":{"part":3,"set":"p3-s2","cefr":"A2","dif":2}},{"i":"en-p3-08","q":"Receptionist: \"How long have you lived in this city?\"","o":["For about five years.","Almost ten kilometers.","Next to the park."],"a":0,"e":"\"How long\" pregunta por duración y se responde con \"for + tiempo\". Las otras dan una distancia o un lugar.","t":{"part":3,"set":"p3-s2","cefr":"A2","dif":3}},{"i":"en-p3-09","q":"Secretary: \"I'm afraid the manager is busy right now.\"","o":["That's OK. I can wait.","Yes, he is a good manager.","I'll be busy tomorrow."],"a":0,"e":"Ante la noticia de que el gerente está ocupado, lo adecuado es decir que se puede esperar. Las otras responden a otra cosa y no resuelven la situación.","t":{"part":3,"set":"p3-s2","cefr":"A2","dif":2}},{"i":"en-p3-10","q":"Elena: \"Shall we split the bill?\"","o":["No, I don't like the soup.","It's twenty dollars.","Sure, that's fair."],"a":2,"e":"\"Shall we split the bill?\" propone dividir la cuenta; \"Sure, that's fair\" acepta. \"It's twenty dollars\" informa un precio, pero no responde a la propuesta.","t":{"part":3,"set":"p3-s2","cefr":"A2","dif":3}},{"i":"en-p4-01","q":"(1)","o":["at","in","to"],"a":1,"e":"Con ciudades se usa \"in\": \"spend a weekend in Cartagena\". \"To\" indica dirección con verbos de movimiento.","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":1},"c":"en-c13"},{"i":"en-p4-02","q":"(2)","o":["in","on","at"],"a":1,"e":"Con días de la semana se usa \"on\": \"on Friday morning\".","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":2},"c":"en-c13"},{"i":"en-p4-03","q":"(3)","o":["but","because","so"],"a":0,"e":"Se contrasta \"small\" con \"very clean\"; \"but\" expresa ese contraste. \"So\" y \"because\" no encajan en la lógica.","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":2},"c":"en-c13"},{"i":"en-p4-04","q":"(4)","o":["an","any","the"],"a":2,"e":"Se trata de un castillo conocido y concreto, por eso \"the\". \"An\" no va delante de \"famous\" y \"any\" no se usa en frases afirmativas así.","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":3},"c":"en-c13"},{"i":"en-p4-05","q":"(5)","o":["many","a few","a lot of"],"a":2,"e":"\"Water\" es incontable, por lo que se usa \"a lot of\". \"Many\" y \"a few\" solo van con sustantivos contables.","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":2},"c":"en-c13"},{"i":"en-p4-06","q":"(6)","o":["are having","were having","had had"],"a":1,"e":"Acción en progreso interrumpida por otra en pasado (\"when it started to rain\"): past continuous. \"Are having\" es presente.","t":{"part":4,"set":"p4-s1","cefr":"B1","dif":3},"c":"en-c13"},{"i":"en-p4-07","q":"(7)","o":["better","best","good"],"a":0,"e":"Con \"than\" se necesita un comparativo: \"better than we expected\". \"Best\" es superlativo.","t":{"part":4,"set":"p4-s1","cefr":"A2","dif":2},"c":"en-c13"},{"i":"en-p4-08","q":"(8)","o":["have","am","did"],"a":0,"e":"\"The best trip I have had\" usa el present perfect tras un superlativo. \"Did had\" y \"am had\" son incorrectas.","t":{"part":4,"set":"p4-s1","cefr":"B1","dif":3},"c":"en-c13"},{"i":"en-p4-09","q":"(1)","o":["what","where","when"],"a":2,"e":"\"A time when...\": \"when\" se refiere a un momento. \"Where\" se usa con lugares.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":2},"c":"en-c14"},{"i":"en-p4-10","q":"(2)","o":["organize","organizes","organizing"],"a":1,"e":"Sujeto singular (\"it\") en presente simple: \"organizes\".","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":1},"c":"en-c14"},{"i":"en-p4-11","q":"(3)","o":["Because","If","Although"],"a":1,"e":"Se plantea una condición: \"If you sleep well, ...\". \"Because\" y \"although\" cambian el sentido.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":1},"c":"en-c14"},{"i":"en-p4-12","q":"(4)","o":["at least","at last","at first"],"a":0,"e":"\"At least seven hours\" significa \"como mínimo\". \"At last\" es \"por fin\" y \"at first\" es \"al principio\".","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":3},"c":"en-c14"},{"i":"en-p4-13","q":"(5)","o":["so","but","because"],"a":2,"e":"La luz de la pantalla es la razón de que sea difícil dormir: \"because\". \"So\" invertiría causa y efecto.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":2},"c":"en-c14"},{"i":"en-p4-14","q":"(6)","o":["are","to","should"],"a":2,"e":"Un consejo se expresa con \"should\" + verbo base. \"Are turn\" y \"to turn\" no son gramaticales aquí.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":1},"c":"en-c14"},{"i":"en-p4-15","q":"(7)","o":["since","for","by"],"a":1,"e":"\"For\" indica duración (\"for many hours\"). \"Since\" requiere un punto de inicio.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":2},"c":"en-c14"},{"i":"en-p4-16","q":"(8)","o":["who","which","whose"],"a":0,"e":"\"People who...\": pronombre relativo para personas. \"Which\" se usa con cosas.","t":{"part":4,"set":"p4-s2","cefr":"A2","dif":2},"c":"en-c14"},{"i":"en-p5-01","q":"When the railway opened in 1926, farmers","o":["had to walk for three hours to reach the station.","could reach the valley markets in much less time.","stopped selling their crops in the markets."],"a":1,"e":"El texto dice que el tren redujo el viaje de dos días de caminata a tres horas: 'could reach the markets in much less time' lo reformula. Quienes caminaban dos días eran los agricultores antes del tren; 'stopped selling their crops' contradice que el tren les permitió llegar a vender.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":1},"c":"en-d01"},{"i":"en-p5-02","q":"The railway was closed in 1989 because","o":["improved roads and trucks had made it less useful.","the farmers had stopped growing coffee and fruit.","the carriages were too rusty to be used."],"a":0,"e":"'New roads had been opened and trucks had become faster and cheaper' equivale a 'improved roads and trucks'. Los carruajes se oxidaron después del cierre (consecuencia, no causa), por eso el segundo distractor invierte el orden.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":1},"c":"en-d01"},{"i":"en-p5-03","q":"During the ten years after the closure, the station","o":["was repaired by former employees.","was turned into a place for tourists.","was left without any activity."],"a":2,"e":"'Stayed empty' se parafrasea como 'was left without any activity'. La reparación y el turismo ocurrieron después, a partir de 1999.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":1},"c":"en-d01"},{"i":"en-p5-04","q":"The retired workers managed to repair the locomotive thanks to","o":["money provided by the railway company.","donations and help from their neighbours.","a grant from the town council."],"a":1,"e":"El texto indica que no tenían dinero y los vecinos donaron herramientas, pintura y almuerzo: 'donations and help from neighbours'. Los otros dos distractores contradicen 'They had no money'.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":2},"c":"en-d01"},{"i":"en-p5-05","q":"The journey takes longer today because","o":["the track is in worse condition than before.","the train now stops at more stations.","the driver goes slowly deliberately to let people see the scenery."],"a":2,"e":"'On purpose, so that passengers can enjoy the views' se reformula como 'deliberately... to let people see the scenery'. El texto menciona una estación intermedia, pero no dice que haya más paradas ni que la vía esté peor.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":2},"c":"en-d01"},{"i":"en-p5-06","q":"Which statement about the journey today is true?","o":["Young children can travel without paying.","Passengers cannot bring any bags on board.","Tickets are more expensive than a cinema seat."],"a":0,"e":"'Children under six travel for free' = 'can travel without paying'. Se permite una bolsa pequeña (solo se prohíben maletas grandes) y el billete cuesta menos que una entrada de cine.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":2},"c":"en-d01"},{"i":"en-p5-07","q":"Marta Quiroga says that the train was originally built to","o":["carry tourists to the mountains.","transport goods.","connect the valley with the capital."],"a":1,"e":"'To move products' se parafrasea como 'transport goods'. Los turistas llegaron solo desde 1999 y el texto no menciona ninguna capital.","t":{"part":5,"set":"p5-s1","cefr":"B1","dif":1},"c":"en-d01"},{"i":"en-p5-08","q":"At first, Clara's neighbours","o":["asked the council to stop her project.","wanted to start hives of their own.","doubted that she was being serious."],"a":2,"e":"'Thought she was joking' se reformula como 'doubted that she was being serious'. Los vecinos preguntaron por las picaduras, pero el texto no dice que acudieran al consejo ni que quisieran colmenas propias.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":1},"c":"en-d02"},{"i":"en-p5-09","q":"Today, the hives in Almar are","o":["kept mainly on farms outside the city.","found on top of many different kinds of buildings.","limited to the botanical garden and the harbour."],"a":1,"e":"'On the roofs of schools, offices and even the city hospital' = 'on top of many different kinds of buildings'. El botánico y el puerto se mencionan solo para el sabor de la miel; las granjas se citan como un problema para las abejas.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":1},"c":"en-d02"},{"i":"en-p5-10","q":"According to the article, cities can be good for bees because","o":["there are fewer harmful chemicals and flowers last longer.","there are more farms with a wide variety of crops.","bees need less food in urban areas."],"a":0,"e":"El texto contrasta granjas con químicos y ciudades con flores de primavera a otoño: 'fewer harmful chemicals' y 'flowers last longer'. El segundo distractor reutiliza 'farms' pero invierte el sentido.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":2},"c":"en-d02"},{"i":"en-p5-11","q":"The honey from different parts of Almar","o":["is lighter near the harbour than near the garden.","tastes saltier when it comes from the botanical garden.","has a flavour that depends on where the hives are."],"a":2,"e":"Cada barrio produce un sabor distinto: el sabor depende de la ubicación. Los distractores intercambian los datos: la miel clara y floral viene del jardín botánico; la oscura y algo salada, del puerto.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":2},"c":"en-d02"},{"i":"en-p5-12","q":"What does the article say about the small shop?","o":["It sells honey only from hives near the harbour.","Its jars show the street where the honey was produced.","It belongs to the chef who uses honey in her restaurant."],"a":1,"e":"'Jars with the name of the street where each batch was made' se parafrasea como 'jars show the street where the honey was produced'. El texto no dice que la tienda sea de la chef ni que venda solo miel del puerto.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":2},"c":"en-d02"},{"i":"en-p5-13","q":"Clara says the beekeeping course is necessary because","o":["people can cause more trouble than the bees themselves.","children need to learn how to behave near hives.","the council wants beekeepers to register their hives."],"a":0,"e":"'The bees are not the real problem; careless people are' se reformula como 'people can cause more trouble than the bees'. Los niños y el registro se mencionan en el texto, pero no como razón que Clara da para el curso.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":3},"c":"en-d02"},{"i":"en-p5-14","q":"The project's next goal is to","o":["visit more schools every year.","double the number of hives on hospital roofs.","place hives in all areas of the city."],"a":2,"e":"'A hive in every district' = 'hives in all areas of the city'. Las visitas a escuelas ocurrieron el año pasado y no se plantean como meta; el hospital solo es un ejemplo de lugar con colmenas.","t":{"part":5,"set":"p5-s2","cefr":"B1","dif":1},"c":"en-d02"},{"i":"en-p6-01","q":"Why does Daniel mention that he read Priya's message three times?","o":["He found her message difficult to understand.","He was looking for reasons to say yes.","He wanted to make a careful decision, not an emotional one.","He was unsure whether to congratulate her."],"a":2,"e":"Daniel explica que quería asegurarse de no estar 'simply reacting to the excitement': busca una decisión meditada. No dice que el mensaje fuera confuso ni que buscara razones para aceptar; la felicitación ya está expresada.","t":{"part":6,"set":"p6-s1","cefr":"B2","dif":2},"c":"en-d03"},{"i":"en-p6-02","q":"What does “two years ago I would have packed my bags that same evening” suggest?","o":["His circumstances then made moving abroad an easy choice.","He regrets not having moved two years ago.","He disliked his job and wanted to leave it.","He had already agreed to move with Priya."],"a":0,"e":"Daniel describe un piso pequeño, un salario bajo y la idea de empezar de nuevo como aventura: entonces mudarse era fácil. El arrepentimiento no se menciona, y el condicional 'would have' indica algo hipotético, no un acuerdo previo.","t":{"part":6,"set":"p6-s1","cefr":"B2","dif":2},"c":"en-d03"},{
